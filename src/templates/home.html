<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eceeea">
  {{security}}
  <script src="./assets/js/intro-gate.js"></script>
  <title>{{page_title}}</title>
  <meta name="description" content="{{page_description}}">
  {{social}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/common.css">
  <link rel="stylesheet" href="./assets/css/home.css">
  <link rel="stylesheet" href="./assets/css/intro.css">
  <link rel="stylesheet" href="./assets/css/page-transitions.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <a class="skip-link" href="about/" data-scroll-exit="top">About Me로 이동</a>
  <div class="text-loop" data-text-loop aria-hidden="true"></div>
  {{intro}}<main class="page" id="main">
    <h1 class="sr-only" id="intro-title" tabindex="-1">박종찬 게임 디자이너 포트폴리오</h1>

    <section class="section" id="awards" aria-labelledby="awards-title">
      <h2 class="section-title" id="awards-title"><span class="marker">수상</span></h2>
      <ul class="award-list">
        <li class="award-card"><span class="award-sheet"><span class="award-paper" aria-hidden="true"></span><span class="award-tape" aria-hidden="true"></span><span class="award-year">2026</span><strong class="award-name"><span class="marker">국가수리과학<br>연구소장상</span></strong><span class="award-event">대전 인디(inD) 게임잼</span><img class="award-sticker" src="./assets/images/awards/sticker-paimon.webp" width="360" height="360" alt="" aria-hidden="true" decoding="async"></span></li>
        <li class="award-card"><span class="award-sheet"><span class="award-paper" aria-hidden="true"></span><span class="award-tape" aria-hidden="true"></span><span class="award-year">2025</span><strong class="award-name"><span class="marker">대상</span></strong><span class="award-event">대전 게임 브릿지</span><img class="award-sticker" src="./assets/images/awards/sticker-helmet.webp" width="360" height="360" alt="" aria-hidden="true" decoding="async"></span></li>
        <li class="award-card"><span class="award-sheet"><span class="award-paper" aria-hidden="true"></span><span class="award-tape" aria-hidden="true"></span><span class="award-year">2025</span><strong class="award-name"><span class="marker">베스트 리더상</span></strong><span class="award-event">스토브 크루 2기</span><img class="award-sticker" src="./assets/images/awards/sticker-shiroko.webp" width="360" height="360" alt="" aria-hidden="true" decoding="async"></span></li>
        <li class="award-card"><span class="award-sheet"><span class="award-paper" aria-hidden="true"></span><span class="award-tape" aria-hidden="true"></span><span class="award-year">2020</span><strong class="award-name"><span class="marker">우수상</span></strong><span class="award-event">넷마블<wbr>게임아카데미 5기</span><img class="award-sticker" src="./assets/images/awards/sticker-creeper.webp" width="360" height="360" alt="" aria-hidden="true" decoding="async"></span></li>
      </ul>
    </section>

{{release_section}}    <section class="section" id="projects" aria-labelledby="projects-title">
      <h2 class="section-title" id="projects-title"><span class="marker">프로젝트</span></h2>
      <div class="ptabs" data-project-tabs>
        <div class="ptabs-list" role="tablist" aria-label="프로젝트 고르기" hidden>
{{project_tabs}}        </div>
        <div class="ptabs-cards">
{{project_cards}}        </div>
      </div>
    </section>

  </main>
  <script src="./assets/js/motion-loop.js" defer></script>
  <script src="./assets/js/intro.js" defer></script>
  <script src="./assets/js/scroll-exit.js" defer></script>
  <script src="./assets/js/text-loop.js" defer></script>
  <script src="./assets/js/flow-row.js" defer></script>
  <script src="./assets/js/project-tabs.js" defer></script>
  <script src="./assets/js/awards.js" defer></script>
</body>
</html>
