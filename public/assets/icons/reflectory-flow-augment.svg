<svg viewBox="0 0 720 808" xmlns="http://www.w3.org/2000/svg">
  <title id="reflectory-augment-flow-title">Reflectory 증강 시스템 순서도</title>
  <desc id="reflectory-augment-flow-desc">첫 웨이브가 아니면 웨이브마다 가진 증강을 뺀 후보에서 세 장을 보여 주고, 처음 두 번은 강한 증강을 한 장으로 제한하며, 플레이어가 한 장을 골라 능력을 얻은 뒤 웨이브를 시작하는 흐름.</desc>
