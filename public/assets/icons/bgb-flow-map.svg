<svg viewBox="0 0 720 1072" xmlns="http://www.w3.org/2000/svg">
  <title id="bgb-map-flow-title">Barrel Good Barrel 맵과 보상 순서도</title>
  <desc id="bgb-map-flow-desc">방 10개를 랜덤 워크로 붙이고 보스, 중간보스, 타임어택, 보물, 상점, 정예, 일반 순서로 방 종류를 정함. 방마다 입장 보상 3장 중 1장을 고르고, 전투방이면 웨이브를 깰 때마다 보상 3장을 고르며 웨이브가 남으면 반복하고, 정예·타임어택·중간보스는 마지막에 클리어 보상을 더 받은 뒤 다음 방으로 이동.</desc>
