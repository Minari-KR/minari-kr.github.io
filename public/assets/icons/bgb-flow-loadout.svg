<svg viewBox="0 0 720 712" xmlns="http://www.w3.org/2000/svg">
  <title id="bgb-loadout-flow-title">Barrel Good Barrel 6칸 탄창 순서도</title>
  <desc id="bgb-loadout-flow-desc">발사하면 1번 칸부터 순서대로 칸이 선택되고, 칸마다 정한 슬롯 타입의 발사 패턴과 특성이 적용된 뒤 패턴마다 다른 대기 시간이 지나는 흐름. 6칸을 다 쏘지 않았으면 다음 칸으로 돌아가고, 다 쐈으면 1.8초 재장전 뒤 1번 칸으로 돌아가며, TAB 화면에서는 언제든 칸의 순서와 구성을 바꿀 수 있음.</desc>
