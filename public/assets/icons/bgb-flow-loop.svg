  <title id="bgb-loop-flow-title">Barrel Good Barrel 핵심 루프 순서도</title>
  <desc id="bgb-loop-flow-desc">한 판은 방 10개로 맵을 만들고 방에 들어가 입장 보상을 고른 뒤 방 종류에 따라 갈라지는 흐름. 전투방은 웨이브가 남으면 반복하고 없으면 방이 클리어되어 다음 방으로 이동하며, 보스방에서 보스 HP가 0이면 승리, 내 HP가 0이면 처음부터 다시 시작.</desc>
