<svg viewBox="0 0 720 996" xmlns="http://www.w3.org/2000/svg">
  <title id="bgb-threat-flow-title">Barrel Good Barrel 위협 설계 순서도</title>
  <desc id="bgb-threat-flow-desc">적은 예고, 공격, 빈틈 순서로 움직임. 아머는 0.8초 빨간 점선 예고 뒤 돌진하고 벽에 부딪히면 1.5초 기절하며, 쿨다운 2.5초 뒤 다시 예고함. 방패가 있을 때 후면은 피해 ×2, 정면은 ×0.2. 보스는 방패가 켜져 피해 ×0.5인 상태에서 패턴을 쏜 직후 코어가 노출되어 피해 ×2가 되며, 노출 시간은 1페이즈 3.0초, 2페이즈 2.0초, 3페이즈 1.5초이고 3페이즈에는 방패가 없음.</desc>
