name: Deploy AI Game Gallery
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the gallery scripts parse
        run: for f in site/app.js site/games.js; do node --check "$f"; done
      # A new ?v= whenever the gallery or its document pages change, so browsers never keep an old copy (Pages caches
      # 10 min). app.js passes the same ?v= on to the document pages it opens; they pass it to doc.css.
      - name: Version the gallery's script, style and document links
        run: |
          v=$(cat site/games.js site/app.js site/style.css site/docs/doc.css $(find site/docs -name '*.html' | sort) | sha256sum | cut -c1-8)
          sed -i -E "s#(href|src)=\"(style\.css|games\.js|app\.js)(\?v=[a-f0-9]+)?\"#\1=\"\2?v=$v\"#g" site/index.html
          grep -c "?v=$v" site/index.html | grep -qx 3
          find site/docs -name '*.html' -exec sed -i -E "s#href=\"([./]*doc\.css)(\?v=[a-f0-9]+)?\"#href=\"\1?v=$v\"#" {} +
      - name: Upload website files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
