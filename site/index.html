<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; frame-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>Games Made with AI</title>
  <link rel="stylesheet" href="style.css?v=eeea6dd6">
  <script src="games.js?v=eeea6dd6" defer></script>
  <script src="app.js?v=eeea6dd6" defer></script>
</head>
<body>
  <header class="top">
    <h1>Games Made with AI</h1>
  </header>
  <main>
    <ul class="grid" id="grid"></ul>
    <noscript><p class="empty">게임 목록을 보려면 JavaScript가 필요합니다.</p></noscript>

    <section class="workflow" aria-labelledby="workflow-title">
      <h2 id="workflow-title">AI 작업 워크플로우</h2>
      <a class="workflow-link" href="workflow.html" aria-label="AI 작업 워크플로우 그림 크게 보기">
        <img src="workflow.webp" width="1768" height="1037" loading="lazy"
          alt="AI 작업 워크플로우: 1 목표 정하기(문제·기준을 내가 정함), 2 지휘 AI 계획(브리프·일 나누기), 3 스킬 찾기(외부 스킬 비교), 4 나눠 맡기기(가장 알맞은 AI에게), 5 검토(테스트·화면 확인), 6 내가 고르기(실제 결과를 보고 결정), 7 기록·배운 점(다음 작업에 반영), 그리고 다시 1로 돌아가며 개선. 4단계에서 Opus(어려운 일·설계), Sonnet(코드·문서), Haiku(단순 반복), Codex(이미지), Grok(영상), Gemini(긴 글 다듬기), ComfyUI(캐릭터 그림, 내 PC)에게 나눠 맡기고, 큰 일은 Orca로 일꾼 세션을 따로 열어 진행이 보이게 한다.">
      </a>
    </section>
  </main>

  <dialog class="player game" id="game" aria-label="게임 플레이">
    <button class="close" type="button" aria-label="닫기">×</button>
    <iframe title="게임" allow="fullscreen; autoplay; gamepad"></iframe>
  </dialog>

  <dialog class="player" id="player" aria-label="플레이 영상">
    <button class="close" type="button" aria-label="닫기">×</button>
    <video controls playsinline preload="none"></video>
  </dialog>
</body>
</html>
