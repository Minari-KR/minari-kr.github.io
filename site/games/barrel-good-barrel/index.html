  cx.fillStyle=dg; cx.fillRect(0,0,W,H);
  cx.fillStyle='#B8860B'; cx.shadowColor='#D4AF37'; cx.shadowBlur=50;
  cx.font='900 46px Orbitron, Courier New'; cx.textAlign='center';
  cx.fillText('YOU DIED',W/2,210); cx.shadowBlur=0;
  cx.fillStyle='#8a7a50'; cx.font='14px Courier New';
  cx.fillText('The run has been lost.',W/2,258);
  cx.fillText(`Rooms cleared: ${roomsCleared}`,W/2,282);
  const bx=W/2-90, by=335;
  const hov=M.x>=bx&&M.x<=bx+180&&M.y>=by&&M.y<=by+48;
  cx.fillStyle=hov?'#1a1200':'#0a0600';
  cx.strokeStyle='#B8860B'; cx.lineWidth=1.5;
  cx.fillRect(bx,by,180,48); cx.strokeRect(bx,by,180,48);
  cx.fillStyle=hov?'#FFD700':'#D4AF37'; cx.shadowColor='#FFD700'; cx.shadowBlur=hov?12:0;
  cx.font='bold 16px Orbitron, Courier New';
  cx.fillText('RESTART',W/2,by+31); cx.shadowBlur=0;
}

function drawWin() {
  cx.fillStyle='rgba(0,0,0,0.92)'; cx.fillRect(0,0,W,H);
  // Golden radial glow
  const wg=cx.createRadialGradient(W/2,200,20,W/2,200,300);
  wg.addColorStop(0,'rgba(212,175,55,0.12)');
  wg.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=wg; cx.fillRect(0,0,W,H);
  // Gold particle streaks
  for(let i=0;i<12;i++){
    cx.fillStyle=`rgba(255,215,0,${0.03+rnd()*0.05})`;
    cx.fillRect(W/2-200+rnd()*400, 50+rnd()*120, 1, 30+rnd()*60);
  }
  const pulse=Math.sin(frameNow*0.004)*0.3+0.7;
  cx.fillStyle=`rgba(212,${Math.floor(150*pulse+105)},${Math.floor(55*pulse)},1)`;
  cx.shadowColor='#FFD700'; cx.shadowBlur=60;
  cx.font='900 50px Orbitron, Courier New'; cx.textAlign='center';
  cx.fillText('VICTORY',W/2,208);
  cx.shadowBlur=25;
  cx.fillText('VICTORY',W/2,208);
  cx.shadowBlur=0;
  cx.fillStyle='#D4AF37'; cx.font='14px Courier New';
  cx.fillText('The boss is down. Dawn returns to the graveyard.',W/2,256);
  const bx=W/2-90, by=315;
  const hov=M.x>=bx&&M.x<=bx+180&&M.y>=by&&M.y<=by+48;
  cx.fillStyle=hov?'#1a1400':'#0a0800';
  cx.strokeStyle='#D4AF37'; cx.lineWidth=2;
  cx.fillRect(bx,by,180,48); cx.strokeRect(bx,by,180,48);
  cx.fillStyle=hov?'#FFD700':'#D4AF37'; cx.shadowColor='#FFD700'; cx.shadowBlur=hov?16:6;
  cx.font='bold 17px Orbitron, Courier New';
  cx.fillText('RESTART',W/2,by+31); cx.shadowBlur=0;
}

// === CLICK HANDLER ===
function handleCanvasClick(mx, my) {
  if (transition.active) return;

  if (gameState==='menu') {
    if(mx>=W/2-120&&mx<=W/2+120&&my>=380&&my<=436) {
      playSound('menuOpen');
      startTransition(0.4, () => initGame());
    }
    return;
  }
  if (gameState==='dead'||gameState==='win') {
    if(mx>=W/2-85&&mx<=W/2+85&&my>=335&&my<=381) {
      playSound('menuClose');
      startTransition(0.4, () => { gameState='menu'; });
    }
    return;
  }
  if (gameState==='tab') {
    if (tabClickSuppress) { tabClickSuppress = false; return; }
    tabClick(mx,my);
    return;
  }
  if (gameState==='reward') {
    if(!pendingRewards) return;
    const n=pendingRewards.length, tw=164, tgap=24;
    const totalW=n*(tw+tgap)-tgap, sx=W/2-totalW/2;
    for(let i=0;i<n;i++){
      const rx=sx+i*(tw+tgap), ry=194;
      if(mx>=rx&&mx<=rx+tw&&my>=ry&&my<=ry+212){
        playSound('reward');
        grantRewardItem(pendingRewards[i]);
        pendingRewards=null;
        startTransition(0.3, finishRewardSelection);
        return;
      }
    }
    return;
  }
  if (gameState==='shop') {
    for(let i=0;i<shopItems.items.length;i++){
      const item=shopItems.items[i]; if(item.sold) continue;
      const rx=90+i*230,ry=190;
      if(mx>=rx&&mx<=rx+190&&my>=ry&&my<=ry+200){
        if (player.currency>=item.cost) {
          playSound('purchase');
          player.currency-=item.cost; grantRewardItem(item.reward); item.sold=true;
          addUIPopup(rx+95, ry+188, `-$${item.cost}`, '#ffd040');
        } else {
          playSound('error');
          triggerUIShake(9, 0.18);
          addUIPopup(rx+95, ry+188, '골드 부족', '#ff7070');
        }
        return;
      }
    }
    if(shopItems.potionAvail&&mx>=W/2-105&&mx<=W/2+105&&my>=430&&my<=508){
      if (player.currency>=2) {
        playSound('purchase');
        player.currency-=2; player.hp=Math.min(player.maxHp,player.hp+3); shopItems.potionAvail=false;
        addUIPopup(W/2, 470, '-$2 / +3 HP', '#8cff90');
      } else {
        playSound('error');
        triggerUIShake(9, 0.18);
        addUIPopup(W/2, 470, '골드 부족', '#ff7070');
      }
      return;
    }
    if(mx>=W/2-82&&mx<=W/2+82&&my>=526&&my<=564) {
      playSound('menuClose');
      startTransition(0.3, closeShop);
    }
    return;
  }
}
C.addEventListener('click', e => {
  if (performance.now() - lastTouchClickTime < 450) return;
  setPointerPos(e.clientX, e.clientY);
  handleCanvasClick(M.x, M.y);
});

// === GAME LOOP ===
let lastT=0;
function loop(t) {
  frameNow = t;
  const dt=Math.min((t-lastT)/1000, 0.05); lastT=t;
  if (hitStopTimer > 0) {
    hitStopTimer -= dt;
    if (hitStopTimer <= 0) timeScale = 1;
  } else {
    timeScale += (1 - timeScale) * Math.min(1, dt * 18);
  }
  const simDt = dt * timeScale;
  if (waveBannerTimer > 0) waveBannerTimer -= dt;
  if (doorTravelCooldown > 0) doorTravelCooldown = Math.max(0, doorTravelCooldown - dt);
  if (slotFlash.timer > 0) slotFlash.timer = Math.max(0, slotFlash.timer - dt);
  if (uiShake.timer > 0) uiShake.timer = Math.max(0, uiShake.timer - dt);
  if (hitDir.timer > 0) hitDir.timer = Math.max(0, hitDir.timer - dt);
  compactCustom(uiPopups, up => {
    up.life -= dt;
    up.y += up.vy * dt;
    up.vy *= 0.92;
    return up.life > 0;
  });
  if (transition.active) {
    transition.progress = Math.min(1, transition.progress + dt / transition.duration);
    if (!transition.midDone && transition.progress >= 0.5) {
      transition.midDone = true;
      if (transition.onMid) transition.onMid();
    }
    if (transition.progress >= 1) {
      transition.active = false;
      transition.onMid = null;
      transition.midDone = false;
    }
  }
  if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - dt * 2.8);
  if (chromaAmount > 0) chromaAmount = Math.max(0, chromaAmount - dt * 12);
  updateMusic(dt);
  cx.clearRect(0,0,W,H);

  if (gameState==='menu')   { drawMenu(); drawScreenFX(); requestAnimationFrame(loop); return; }
  if (gameState==='dead')   { drawDead(); drawScreenFX(); requestAnimationFrame(loop); return; }
  if (gameState==='win')    { drawWin(); drawScreenFX(); requestAnimationFrame(loop); return; }
  if (gameState==='reward') { drawCameraBG(); drawWithUIShake(drawReward); drawScreenFX(); requestAnimationFrame(loop); return; }
  if (gameState==='shop')   { drawCameraBG(); drawWithUIShake(drawShop); drawScreenFX(); requestAnimationFrame(loop); return; }
  if (gameState==='tab')    { drawCameraBG(); drawWithUIShake(drawTabMenu); drawUI(); drawWaveBanner(); drawScreenFX(); requestAnimationFrame(loop); return; }

  // Active gameplay (playing / boss)
  // Screen shake
  if (shakeDur > 0) shakeDur -= simDt;
  const _sx = shakeDur > 0 ? (rnd()-0.5)*shakeIntensity*2 : 0;
  const _sy = shakeDur > 0 ? (rnd()-0.5)*shakeIntensity*2 : 0;

  updateCamera();
  syncAimFromScreen();
  player.update(simDt);
  if (updateDoorTravel()) { requestAnimationFrame(loop); return; }

  if (M.down) player.tryShoot();

  for (let i = 0; i < roomHazards.length; i++) roomHazards[i].update(simDt);

  // Update enemies
  for(const e of enemies) e.update(simDt, player);
  if (boss) boss.update(simDt);

  // Update bullets
  compactUpdate(bullets, simDt, releaseBullet);
  compactUpdate(particles, simDt, releaseParticle);
  compactUpdate(shellCasings, simDt, releaseShellCasing);
  compactUpdate(pools, simDt, releasePool);

  // Update grenades
  compactUpdate(grenades, simDt);

  // Update gravity wells
  compactUpdate(gravityWells, simDt, releaseGravityWell);
  compactUpdate(turrets, simDt, releaseTurret);
  compactUpdate(vortexes, simDt, releaseVortex);

  compactCustom(damagePopups, dp => {
    dp.life -= simDt;
    dp.y += dp.vy * simDt;
    dp.vy *= 0.92;
    return dp.life > 0;
  });

  compactCustom(echoQueue, eq => {
    eq.timer -= simDt;
    if (eq.timer > 0) return true;
    if (!player || !['playing', 'boss'].includes(gameState)) return false;
    const angle = Math.atan2(eq.vy, eq.vx);
    if (eq.slotType) {
      fireSlotType({ x:eq.x, y:eq.y, facingAngle:angle }, 0, eq.slotType, eq.traits);
    } else {
      spawnBullet(eq.x,eq.y,eq.vx,eq.vy,true,eq.traits);
    }
    const baseAngle = Math.atan2(eq.vy, eq.vx);
    for(let i=0;i<5;i++){const pa=baseAngle+(rnd()-0.5)*0.8; spawnParticle(eq.x,eq.y,Math.cos(pa)*(150+rnd()*150),Math.sin(pa)*(150+rnd()*150),0.18,'#8080ff',3);}
    return false;
  });
  compactCustom(beamBursts, beam => {
    beam.tick -= simDt;
    while (beam.tick <= 0 && beam.life > 0) {
      applyBeamBurstDamage(beam);
      beam.tick += beam.tickInterval;
    }
    beam.life -= simDt;
    return beam.life > 0;
  });

  doCollisions(simDt);

  // Clean dead enemies
  compactCustom(enemies, e => e.alive);

  // Time attack countdown
  if (currentRoom?.type==='timeattack' && gameState==='playing') {
    taTimer-=simDt;
    if (taTimer<=0) {
      taTimer = 0;
      enemies = [];
      pendingWaveSpawn = null;
      roomCleared();
    }
  }

  // Wave / room clear logic
  if (gameState==='playing' && enemies.length===0 && !currentRoom.cleared && !pendingWaveSpawn && waves) {
    const nextWaveIdx = waveIdx + 1;
    const hasMoreWaves = nextWaveIdx < waves.length;
    showWaveReward(hasMoreWaves ? nextWaveIdx : null, !hasMoreWaves);
  }
  if (pendingWaveSpawn !== null) {
    pendingWaveSpawn -= simDt;
    if (pendingWaveSpawn <= 0) {
      enemies = spawnWave(waves[waveIdx]);
      pendingWaveSpawn = null;
      for(let i=0;i<12;i++) spawnParticle(AREA.x+rnd()*AREA.w,AREA.y+rnd()*AREA.h,(rnd()-0.5)*80,(rnd()-0.5)*80,0.9,'#ffd040',3);
    }
  }

  // Boss clear
  if (gameState==='boss' && boss && !boss.alive) {
    clearScheduledTimers();
    if (currentRoom?.type === 'midboss') {
      boss = null;
      roomCleared();
    } else {
      if (currentRoom) {
        currentRoom.cleared = true;
        currentRoom.locked = false;
      }
      gameState='win';
    }
  }

  // Render
  updateCamera();
  syncAimFromScreen();
  cx.save();
  cx.translate(Math.round(_sx - camera.x), Math.round(_sy - camera.y));
  drawBG();
  drawDoors();
  drawHazards();
  drawPools();
  for (let i = 0; i < gravityWells.length; i++) gravityWells[i].draw();
  for (let i = 0; i < vortexes.length; i++) vortexes[i].draw();
  for (let i = 0; i < turrets.length; i++) turrets[i].draw();
  for (let i = 0; i < grenades.length; i++) grenades[i].draw();
  drawParticles();
  for (let i = 0; i < beamBursts.length; i++) {
    const beam = beamBursts[i];
    cx.save();
    cx.globalAlpha = beam.life / beam.maxLife;
    cx.strokeStyle = beam.color;
    cx.lineWidth = beam.width;
    cx.shadowColor = beam.color;
    cx.shadowBlur = 18;
    cx.beginPath();
    cx.moveTo(beam.x1, beam.y1);
    cx.lineTo(beam.x2, beam.y2);
    cx.stroke();
    cx.restore();
  }
  drawBullets();
  for (let i = 0; i < enemies.length; i++) enemies[i].draw();
  if (boss) boss.draw();
  player.draw();
  drawDamagePopups();
  cx.restore(); // end world camera / screen shake
  for (let i = 0; i < shellCasings.length; i++) shellCasings[i].draw();
  drawUI();
  drawWaveBanner();
  drawScreenFX();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
