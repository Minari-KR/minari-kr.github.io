  }
}

// === GRENADE ===
class Grenade {
  constructor(sx, sy, tx, ty) {
    this.sx=sx; this.sy=sy; this.tx=tx; this.ty=ty;
    this.x=sx; this.y=sy;
    this.flyDur=0.65; this.flyTimer=0;
    this.fuseTimer=0; this.fuseDur=2.0;
    this.state='flying'; // flying | fuse | done
    this.r=62;
    this.trail=[];
  }
  update(dt) {
    // Fade trail lifetime
    compactCustom(this.trail, t => ((t.life -= dt) > 0));
    if (this.state==='flying') {
      this.flyTimer+=dt;
      const t=Math.min(this.flyTimer/this.flyDur,1);
      // Parabolic arc flight
      this.x=this.sx+(this.tx-this.sx)*t;
      this.y=this.sy+(this.ty-this.sy)*t - Math.sin(t*Math.PI)*55;
      this.trail.push({x:this.x,y:this.y,life:0.22});
      if (t>=1) {
        this.state='fuse';
        for(let i=0;i<12;i++){const a=rnd()*PI2; spawnParticle(this.tx,this.ty,Math.cos(a)*70,Math.sin(a)*70,0.5,'#cc00cc',3);}
      }
    } else if (this.state==='fuse') {
      this.fuseTimer+=dt;
      if (this.fuseTimer>=this.fuseDur) {
        this.state='done';
        spawnPool(this.tx,this.ty,this.r,3.5,false);
        for(let i=0;i<28;i++){const a=rnd()*PI2;const sp=70+rnd()*180; spawnParticle(this.tx,this.ty,Math.cos(a)*sp,Math.sin(a)*sp,0.9,'#cc00cc',6);}
        for(let i=0;i<16;i++){const a=rnd()*PI2;const sp=30+rnd()*90; spawnParticle(this.tx,this.ty,Math.cos(a)*sp,Math.sin(a)*sp,0.6,'#ff4040',4);}
      }
    }
    return this.state!=='done';
  }
  draw() {
    for(const t of this.trail){
      cx.save(); cx.globalAlpha=t.life/0.22*0.55;
      cx.fillStyle='#d040a0'; cx.beginPath(); cx.arc(t.x,t.y,4,0,PI2); cx.fill();
      cx.restore();
    }
    if (this.state==='flying') {
      // Grenade body (spinning)
      cx.save();
      cx.translate(this.x,this.y);
      cx.rotate(this.flyTimer*9);
      cx.fillStyle='#c83060'; cx.shadowColor='#ff2080'; cx.shadowBlur=12;
      cx.beginPath(); cx.arc(0,0,7,0,PI2); cx.fill();
      cx.strokeStyle='#ff80c0'; cx.lineWidth=2; cx.shadowBlur=6;
      cx.beginPath(); cx.moveTo(-6,0); cx.lineTo(6,0); cx.stroke();
      cx.beginPath(); cx.moveTo(0,-6); cx.lineTo(0,6); cx.stroke();
      cx.restore();
    } else if (this.state==='fuse') {
      const prog=this.fuseTimer/this.fuseDur;
      const flash=Math.sin(this.fuseTimer*(3+prog*12)*Math.PI)>0;
      cx.save();
      cx.globalAlpha=0.22+flash*0.3;
      cx.fillStyle=flash?'rgba(255,0,80,0.12)':'rgba(180,0,180,0.08)';
      cx.beginPath(); cx.arc(this.tx,this.ty,this.r,0,PI2); cx.fill();
      cx.strokeStyle=flash?'#ff2020':'#cc00cc';
      cx.shadowColor=flash?'#ff2020':'#cc00cc'; cx.shadowBlur=flash?20:8;
      cx.lineWidth=flash?2.5:1.5;
      cx.setLineDash([10,7]); cx.lineDashOffset=-this.fuseTimer*20;
      cx.beginPath(); cx.arc(this.tx,this.ty,this.r,0,PI2); cx.stroke();
      cx.setLineDash([]); cx.restore();
      // Center blinking marker
      cx.save();
      cx.fillStyle=flash?'#ff2020':'#cc00cc';
      cx.shadowColor=cx.fillStyle; cx.shadowBlur=flash?16:6;
      cx.beginPath(); cx.arc(this.tx,this.ty,5,0,PI2); cx.fill();
      cx.restore();
      // Countdown number
      const remaining=Math.ceil(this.fuseDur-this.fuseTimer);
      cx.save();
      cx.fillStyle=flash?'#ff8080':'#cc80cc';
      cx.shadowColor='#ff2020'; cx.shadowBlur=flash?10:0;
      cx.font=`bold ${flash?16:14}px Courier New`; cx.textAlign='center';
      cx.fillText(remaining, this.tx, this.ty-this.r-8);
      cx.restore();
    }
  }
}

// === BOSS ===
class Boss {
  constructor(hpBonus=0) {
    this.x=AREA.x+AREA.w/2; this.y=AREA.y+100;
    this.hp=this.maxHp=Math.round(70 + hpBonus); this.r=42; this.alive=true;
    this.phase=1; this.patTimer=0; this.patIdx=0;
    this.vx=0; this.vy=0; this.flashTimer=0;
    this.moveTimer=0; this.tx=this.x; this.ty=this.y;
    this.marked=false; this.markTimer=0; this.corrosionTimer=0;
    this.igniteTimer=0; this.igniteTick=0; this.venomStacks=0; this.venomTimer=0;
    this.freezeTimer=0;
    this.shielded=true;
    this.coreExposed=false;
    this.coreTimer=0;
    this.corePulse=0;
    this.patternScale = 1 + combatRoomsCleared * 0.05;
    playSound('boss');
  }
  update(dt) {
    if (!this.alive) return;
    if (this.flashTimer>0) this.flashTimer-=dt;
    if (this.corrosionTimer>0) this.corrosionTimer-=dt;
    if (this.marked) { this.markTimer-=dt; if(this.markTimer<=0) this.marked=false; }
    if (this.coreExposed) {
      this.coreTimer -= dt;
      this.corePulse += dt * (this.phase === 3 ? 10 : 7);
      if (this.coreTimer <= 0) {
        this.coreExposed = false;
        this.coreTimer = 0;
        this.shielded = this.phase < 3;
      }
    } else {
      this.corePulse += dt * 3;
    }
    if (this.venomStacks>0) { this.venomTimer-=dt; if(this.venomTimer<=0){ this.hp-=this.venomStacks*0.3; this.venomTimer=0.5; for(let i=0;i<3;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*50,Math.sin(a)*50,0.3,'#40c040',2);} if(this.hp<=0) this.alive=false; } }
    if (this.igniteTimer>0) { this.igniteTimer-=dt; this.igniteTick-=dt; if(this.igniteTick<=0){ this.hp-=1; this.igniteTick=1.0; for(let i=0;i<4;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*50,Math.sin(a)*50,0.3,'#ff6020',2);} if(this.hp<=0) this.alive=false; } }
    if (this.freezeTimer>0) { this.freezeTimer-=dt; return; }
    const hpRatio = this.hp / this.maxHp;
    if (hpRatio <= 0.3 && this.phase < 3) {
      this.phase=3;
      this.shielded=false;
      this.coreExposed=true;
      this.coreTimer=1.5;
      for(let i=0;i<72;i++){const a=rnd()*PI2; const sp=140+rnd()*300; spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,1.1+rnd()*0.8,'#ff4028',8);}
      for(let i=0;i<24;i++){const a=rnd()*PI2; const sp=80+rnd()*180; spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.75+rnd()*0.35,'#ffd0d0',5);}
      shakeDur = 0.45; shakeIntensity = 18;
      screenPulse('#ff4028', 0.4, 6);
    } else if (hpRatio <= 0.6 && this.phase === 1) {
      this.phase=2;
      this.shielded = !this.coreExposed;
      for(let i=0;i<40;i++){const a=rnd()*PI2; const sp=100+rnd()*220; spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.9+rnd()*0.3,'#ff4040',6);}
      for(let i=0;i<16;i++){const a=rnd()*PI2; const sp=80+rnd()*140; spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.6+rnd()*0.2,'#ffc080',4);}
      screenPulse('#ff6a3d', 0.2, 3);
    }
    // Movement
    this.moveTimer-=dt;
    if (this.moveTimer<=0) {
      this.tx=AREA.x+80+rnd()*(AREA.w-160);
      this.ty=AREA.y+60+rnd()*160;
      this.moveTimer=this.phase===1?2.2:(this.phase===2?1.55:1.05);
    }
    const bmdx=this.tx-this.x, bmdy=this.ty-this.y, bmd=Math.sqrt(bmdx*bmdx+bmdy*bmdy)||1;
    const moveSpeed = this.phase===1 ? 88 : (this.phase===2 ? 108 : 132);
    if (bmd>5) { this.x+=(bmdx/bmd)*moveSpeed*dt; this.y+=(bmdy/bmd)*moveSpeed*dt; }

    // Attack
    this.patTimer-=dt;
    if (this.coreExposed) return;
    if (this.patTimer<=0) {
      const pats=this.phase===3?['triple','laser','spread','random']:['triple','laser','spread'];
      this.patIdx=(this.patIdx+1)%pats.length;
      const p=pats[this.patIdx];
      const dx=player.x-this.x, dy=player.y-this.y, da=Math.atan2(dy,dx);
      let nextTimer = this.phase===1 ? 1.15 : (this.phase===2 ? 0.85 : 0.55);
      if (p==='triple') {
        const spread = this.phase===1 ? 0.12 : (this.phase===2 ? 0.1 : 0.09);
        const count = this.phase===1 ? 3 : 5;
        const projSpeed = enemyProjectileSpeed(this.phase===1 ? 225 : (this.phase===2 ? 270 : 320), false);
        const half = (count - 1) * 0.5;
        for(let i=0;i<count;i++){const a=da+(i-half)*spread; spawnBullet(this.x,this.y,Math.cos(a)*projSpeed,Math.sin(a)*projSpeed,false);}
        nextTimer = (this.phase===1 ? 1.35 : (this.phase===2 ? 1.05 : 0.78)) / this.patternScale;
      } else if (p==='laser') {
        const bursts = this.phase===1 ? 9 : (this.phase===2 ? 12 : 15);
        const delay = this.phase===1 ? 75 : (this.phase===2 ? 60 : 45);
        const projSpeed = enemyProjectileSpeed(this.phase===1 ? 310 : (this.phase===2 ? 360 : 405), false);
        for(let i=0;i<bursts;i++) scheduleGameTimeout(()=>{ if(!this.alive || boss !== this || gameState !== 'boss' || player?.hp <= 0)return; const sweep=this.phase===3?(rnd()-0.5)*0.05:0; spawnBullet(this.x,this.y,Math.cos(da+sweep)*projSpeed,Math.sin(da+sweep)*projSpeed,false);},i*delay);
        nextTimer = (this.phase===1 ? 1.95 : (this.phase===2 ? 1.55 : 1.1)) / this.patternScale;
      } else if (p==='spread') {
        const n=this.phase===1 ? 8 : (this.phase===2 ? 14 : 18);
        const projSpeed = enemyProjectileSpeed(this.phase===1 ? 185 : (this.phase===2 ? 225 : 255), false);
        for(let i=0;i<n;i++){const a=(PI2/n)*i + (this.phase===3 ? rnd()*0.08 : 0); spawnBullet(this.x,this.y,Math.cos(a)*projSpeed,Math.sin(a)*projSpeed,false);}
        nextTimer = (this.phase===1 ? 2.35 : (this.phase===2 ? 1.8 : 1.25)) / this.patternScale;
      } else {
        for(let i=0;i<18;i++){const a=rnd()*PI2; const sp=enemyProjectileSpeed(160+rnd()*190, false); spawnBullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,false);}
        nextTimer = 0.95 / this.patternScale;
      }
      this.coreExposed = true;
      this.coreTimer = this.phase===1 ? 3.0 : (this.phase===2 ? 2.0 : 1.5);
      this.shielded = false;
      this.patTimer = nextTimer;
    }
  }
  hit(dmg, traits) {
    let d=dmg;
    const crit = rnd()<0.3 && traits.includes('sight');
    if (traits.includes('silver'))   d*=1.6;
    if (traits.includes('overload')) d*=1.5;
    if (this.marked)                 { d*=2; this.marked=false; this.markTimer=0; }
    if (this.corrosionTimer>0)       d*=1.5;
    if (this.shielded) {
      d*=0.5;
      addDamagePopup(this.x, this.y-this.r-32, 'SHIELDED', '#8ec5ff', false);
    } else if (this.coreExposed) {
      d*=2;
    }
    if (crit) { d*=2; for(let i=0;i<8;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*130,Math.sin(a)*130,0.5,'#40e0ff',3);} }
    this.hp-=d; this.flashTimer=0.08;
    if (d>=3) { shakeDur=0.12; shakeIntensity=Math.min(12,d*0.5); }
    if (traits.includes('corrosion')) this.corrosionTimer=4.0;
    if (traits.includes('mark'))      { this.marked=true; this.markTimer=4.0; }
    if (traits.includes('ignite'))    { this.igniteTimer=3.0; this.igniteTick=1.0; }
    if (traits.includes('venom'))     { this.venomStacks=Math.min(3,this.venomStacks+1); this.venomTimer=0.5; }
    if (traits.includes('drain'))     player.hp=Math.min(player.maxHp, player.hp+d*0.25);
    addDamagePopup(this.x, this.y-this.r-16, Math.round(d*10)/10, crit ? '#ffe070' : '#ffb0b0', crit);
    playSound('enemyHit');
    triggerHitStop(0.04, 0.3);
    for(let i=0;i<6;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*110,Math.sin(a)*110,0.4,'#ff8080',4);}
    if (this.hp<=0) {
      this.alive=false;
      for(let i=0;i<50;i++){const a=rnd()*PI2;const sp=80+rnd()*220; spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,1.2+rnd()*0.8,'#ff4040',7);}
      triggerHitStop(0.5, 0.18);
      screenPulse('#ff5040', 0.32, 5);
      playSound('kill');
    }
  }
  draw() {
    if (!this.alive) return;
    cx.save();
    const fl=this.flashTimer>0;
    const pulse=Math.sin(frameNow*0.005)*0.3+0.7;
    const corePulse=0.65+Math.sin(this.corePulse)*0.35;
    const shellColor=this.phase===1?'#802020':(this.phase===2?'#b02222':'#d03018');
    const innerColor=this.phase===1?'#380':'#500';
    cx.shadowColor=this.coreExposed?'#ff5038':(this.phase===3?'#ff4028':(this.phase===2?'#ff2020':'#800020'));
    cx.shadowBlur=(this.coreExposed?42*corePulse:32*pulse)+(fl?20:0);
    cx.fillStyle=fl?'#fff':shellColor;
    cx.beginPath(); cx.arc(this.x,this.y,this.r,0,PI2); cx.fill();
    cx.fillStyle=fl?'#ffd0d0':innerColor;
    cx.beginPath(); cx.arc(this.x,this.y,this.r*0.65,0,PI2); cx.fill();
    if (this.shielded) {
      cx.save();
      cx.globalAlpha = 0.38 + pulse * 0.1;
      cx.strokeStyle = this.phase===2 ? '#7fc8ff' : '#94bfff';
      cx.lineWidth = 5;
      cx.shadowColor = '#9fd8ff';
      cx.shadowBlur = 20;
      cx.beginPath(); cx.arc(this.x,this.y,this.r+11+Math.sin(frameNow*0.01)*1.5,0,PI2); cx.stroke();
      cx.globalAlpha = 0.12;
      cx.fillStyle = '#9bcfff';
      cx.beginPath(); cx.arc(this.x,this.y,this.r+13,0,PI2); cx.fill();
      cx.restore();
    }
    if (this.coreExposed) {
      cx.save();
      cx.fillStyle = `rgba(255,70,40,${0.32 + corePulse * 0.25})`;
      cx.shadowColor = '#ff5038';
      cx.shadowBlur = 28 + corePulse * 18;
      cx.beginPath(); cx.arc(this.x,this.y,this.r*0.42 + corePulse*2.5,0,PI2); cx.fill();
      cx.strokeStyle = `rgba(255,180,160,${0.45 + corePulse * 0.2})`;
      cx.lineWidth = 2.5;
      cx.beginPath(); cx.arc(this.x,this.y,this.r*0.52 + corePulse*3.5,0,PI2); cx.stroke();
      cx.restore();
    }
    cx.fillStyle=fl?'#fff':'#ff8800'; cx.shadowColor='#ff8800'; cx.shadowBlur=12;
    cx.beginPath(); cx.arc(this.x-13,this.y-5,6,0,PI2); cx.arc(this.x+13,this.y-5,6,0,PI2); cx.fill();
    // Boss HP bar
    cx.shadowBlur=0;
    const barX = AREA.x+80, barY = AREA.y-28, barW = AREA.w-160, barH = 13;
    cx.fillStyle='#1a1000'; cx.fillRect(barX,barY,barW,barH);
    cx.fillStyle=this.phase===1?'#D4AF37':(this.phase===2?'#FFD700':'#ff6a3d');
    cx.fillRect(barX,barY,barW*(this.hp/this.maxHp),barH);
    cx.strokeStyle='rgba(212,175,55,0.5)';
    cx.lineWidth=1;
    cx.beginPath();
    cx.moveTo(barX + barW * 0.6, barY);
    cx.lineTo(barX + barW * 0.6, barY + barH);
    cx.moveTo(barX + barW * 0.3, barY);
    cx.lineTo(barX + barW * 0.3, barY + barH);
    cx.stroke();
    cx.strokeStyle='#B8860B'; cx.strokeRect(barX,barY,barW,barH);
    cx.fillStyle='#FFD700'; cx.font='bold 10px Orbitron, Courier New'; cx.textAlign='center';
    cx.fillText(`BOSS P${this.phase}  ${Math.ceil(this.hp)} / ${this.maxHp}`, AREA.x + AREA.w / 2, AREA.y-18);
    cx.restore();
  }
}

class PhantomKnight {
  constructor() {
    this.x = AREA.x + AREA.w / 2;
    this.y = AREA.y + 110;
    this.tx = this.x;
    this.ty = this.y;
    this.hp = this.maxHp = Math.round(scaleStat(40, 'hp', roomIdx, false));
    this.r = 32;
    this.phase = 1;
    this.alive = true;
    this.flashTimer = 0;
    this.attackTimer = 0.8;
    this.moveTimer = 0.6;
    this.dashTelegraph = 0;
    this.dashDir = 0;
    this.summoned = false;
    playSound('boss');
  }
  update(dt) {
    if (!this.alive) return;
    if (this.flashTimer > 0) this.flashTimer -= dt;
    if (this.hp <= this.maxHp * 0.5 && this.phase === 1) {
      this.phase = 2;
      this.attackTimer = 0.5;
      screenPulse('#9bc2ff', 0.16, 4);
      for (let i = 0; i < 22; i++) {
        const a = rnd() * PI2;
        spawnParticle(this.x, this.y, Math.cos(a) * (80 + rnd() * 160), Math.sin(a) * (80 + rnd() * 160), 0.8, '#b8d4ff', 5);
      }
    }
    this.moveTimer -= dt;
    if (this.moveTimer <= 0) {
      this.tx = AREA.x + 100 + rnd() * (AREA.w - 200);
      this.ty = AREA.y + 80 + rnd() * 170;
      this.moveTimer = this.phase === 1 ? 1.4 : 1.0;
    }
    const mdx = this.tx - this.x, mdy = this.ty - this.y, md = Math.sqrt(mdx * mdx + mdy * mdy) || 1;
    this.x += (mdx / md) * 95 * dt;
    this.y += (mdy / md) * 95 * dt;

    if (this.dashTelegraph > 0) {
      this.dashTelegraph -= dt;
      if (this.dashTelegraph <= 0) {
        const speed = this.phase === 1 ? 520 : 680;
        const projSpeed = enemyProjectileSpeed(230, false);
        for (let i = 0; i < 8; i++) {
          const off = (i - 3.5) * 0.08;
          spawnBullet(this.x, this.y, Math.cos(this.dashDir + off) * projSpeed, Math.sin(this.dashDir + off) * projSpeed, false);
        }
        this.x += Math.cos(this.dashDir) * 110;
        this.y += Math.sin(this.dashDir) * 110;
        if ((player.x - this.x) ** 2 + (player.y - this.y) ** 2 < 80 * 80) player.takeDamage(1, this.x, this.y);
        for (let i = 0; i < 20; i++) {
          const a = this.dashDir + (rnd() - 0.5) * 0.8;
          spawnParticle(this.x, this.y, Math.cos(a) * speed * (0.25 + rnd() * 0.25), Math.sin(a) * speed * (0.25 + rnd() * 0.25), 0.45, '#b8d4ff', 4);
        }
      }
      return;
    }

    this.attackTimer -= dt;
    if (this.attackTimer > 0) return;
    this.dashDir = Math.atan2(player.y - this.y, player.x - this.x);
    this.dashTelegraph = 1.0;
    this.attackTimer = this.phase === 1 ? 1.8 : 1.25;
    if (this.phase === 2 && !this.summoned) {
      this.summoned = true;
      for (let i = 0; i < 2; i++) {
        const p = findSafePointNear(this.x + (i ? 34 : -34), this.y + 24, 'slasher', 52);
        enemies.push(armRoomEnemy(spawnEnemy(p.x, p.y, 'slasher', ENEMY_SPAWN_DELAY)));
      }
    } else if (this.phase === 2 && rnd() < 0.6) {
      const p = findSafePointNear(this.x + (rnd() - 0.5) * 60, this.y + 24, 'slasher', 52);
      enemies.push(armRoomEnemy(spawnEnemy(p.x, p.y, 'slasher', ENEMY_SPAWN_DELAY)));
    }
  }
  hit(dmg, traits) {
    let d = dmg;
    const crit = rnd()<0.3 && traits.includes('sight');
    if (traits.includes('silver')) d *= 1.6;
    if (traits.includes('overload')) d *= 1.5;
    if (crit) d *= 2;
    this.hp -= d;
    this.flashTimer = 0.1;
    addDamagePopup(this.x, this.y-this.r-12, Math.round(d*10)/10, crit ? '#ffe070' : '#b8d4ff', crit);
    triggerHitStop(0.04, 0.3);
    playSound('enemyHit');
    if (this.hp <= 0) {
      this.alive = false;
      triggerHitStop(0.5, 0.18);
      screenPulse('#d6e6ff', 0.28, 5);
      playSound('kill');
    }
  }
  draw() {
    if (!this.alive) return;
    const pulse = Math.sin(frameNow * 0.006) * 0.28 + 0.72;
    cx.save();
    cx.shadowColor = '#aac8ff';
    cx.shadowBlur = 22 * pulse + (this.flashTimer > 0 ? 18 : 0);
    cx.fillStyle = this.flashTimer > 0 ? '#fff' : '#7f90c8';
    cx.beginPath(); cx.arc(this.x, this.y, this.r, 0, PI2); cx.fill();
    cx.fillStyle = '#11152a';
    cx.beginPath(); cx.arc(this.x, this.y, this.r * 0.6, 0, PI2); cx.fill();
    cx.strokeStyle = '#d8e6ff'; cx.lineWidth = 3;
    cx.beginPath(); cx.moveTo(this.x, this.y - 30); cx.lineTo(this.x, this.y + 26); cx.stroke();
    if (this.dashTelegraph > 0) {
      cx.strokeStyle = 'rgba(220,235,255,0.7)'; cx.lineWidth = 4;
      cx.beginPath();
      cx.moveTo(this.x, this.y);
      cx.lineTo(this.x + Math.cos(this.dashDir) * 140, this.y + Math.sin(this.dashDir) * 140);
      cx.stroke();
    }
    cx.fillStyle = '#300'; cx.fillRect(AREA.x+120, AREA.y-28, AREA.w-240, 11);
    cx.fillStyle = '#D4AF37'; cx.fillRect(AREA.x+120, AREA.y-28, (AREA.w-240)*(this.hp/this.maxHp), 11);
    cx.strokeStyle = '#B8860B'; cx.strokeRect(AREA.x+120, AREA.y-28, AREA.w-240, 11);
    cx.fillStyle = '#FFD700'; cx.font='bold 10px Orbitron, Courier New'; cx.textAlign='center';
    cx.fillText(`PHANTOM KNIGHT ${Math.ceil(this.hp)} / ${this.maxHp}`, AREA.x + AREA.w / 2, AREA.y-18);
    cx.restore();
  }
}

// === PLAYER ===
class Player {
  constructor() {
    this.x=AREA.x+AREA.w/2; this.y=AREA.y+AREA.h/2;
    this.vx=0; this.vy=0;
    this.hp=this.maxHp=PLAYER_HP; this.r=14;
    this.ammo=MAX_AMMO; this.reloading=false; this.reloadTimer=0;
    this.fireTimer=0;
    this.dashing=false; this.dashTimer=0; this.dashCD=0;
    this.dvx=0; this.dvy=0;
    this.invTimer=0; this.facingAngle=0;
    this.afterimages=[];
    this.slots=[[], [], [], [], [], []]; // 6 bullet slots, up to 3 traits each
    this.slotTypes=defaultSlotTypes();
    this.currency=0;
  }

  update(dt) {
    compactCustom(this.afterimages, a => ((a.life -= dt) > 0));
    if (this.invTimer>0) this.invTimer-=dt;

    if (this.dashing) {
      this.dashTimer-=dt;
      this.x+=this.dvx*dt; this.y+=this.dvy*dt;
      if (rnd()<0.6) this.afterimages.push({x:this.x,y:this.y,a:this.facingAngle,life:0.25});
      if (this.dashTimer<=0) this.dashing=false;
    } else {
      let mx=0,my=0;
      if (K['KeyW']||K['ArrowUp'])    my-=1;
      if (K['KeyS']||K['ArrowDown'])  my+=1;
      if (K['KeyA']||K['ArrowLeft'])  mx-=1;
      if (K['KeyD']||K['ArrowRight']) mx+=1;
      const ml=Math.sqrt(mx*mx+my*my); if(ml>0){mx/=ml;my/=ml;}
      this.vx+=(mx*PLAYER_SPEED-this.vx)*12*dt;
      this.vy+=(my*PLAYER_SPEED-this.vy)*12*dt;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
      // Push from armor enemies
      if (Math.abs(this.vx)>5||Math.abs(this.vy)>5) {
        this.vx*=0.9; this.vy*=0.9;
      }
      if (K['Space'] && this.dashCD<=0 && (mx||my)) {
        this.dashing=true; this.dashTimer=DASH_DUR; this.dashCD=DASH_CD;
        this.dvx=mx*DASH_SPEED; this.dvy=my*DASH_SPEED;
        this.invTimer=DASH_DUR+0.12;
        this.afterimages.push({x:this.x,y:this.y,a:this.facingAngle,life:0.3});
        playSound('dash');
      }
    }
    if (this.dashCD>0) this.dashCD-=dt;

    this.x=clamp(this.x,AREA.x+this.r,AREA.x+AREA.w-this.r);
    this.y=clamp(this.y,AREA.y+this.r,AREA.y+AREA.h-this.r);
    for (const hz of roomHazards) {
      if (hz.type === 'pillar') resolveSolidCircle(this, hz);
      if (hz.type === 'conveyor' && hz.contains(this.x, this.y)) {
        if (hz.w > hz.h) this.x += hz.dir * 130 * dt;
        else this.y += hz.dir * 130 * dt;
      }
    }

    if (this.reloading) {
      this.reloadTimer-=dt;
      if (this.reloadTimer<=0) { this.reloading=false; this.ammo=MAX_AMMO; }
    }
    if (this.fireTimer>0) this.fireTimer-=dt;
    this.facingAngle=Math.atan2(AIM.y-this.y, AIM.x-this.x);
  }

  tryShoot() {
    if (this.reloading || this.fireTimer>0) return;
    if (this.ammo<=0) { this._startReload(); return; }
    const slotIdx=MAX_AMMO-this.ammo;
    const traits=this.slots[slotIdx]||[];
    const slotType=this.slotTypes[slotIdx] || 'standard';
    const fired = fireSlotType(this, slotIdx, slotType, traits);
    if (traits.includes('twin')) {
      const a=this.facingAngle;
      const et=sanitizeTraitsForSlotType(slotType, traits.filter(t=>t!=='twin')).traits;
      const pos = muzzlePosForAngle(this, a, 22);
      echoQueue.push({x:this.x,y:this.y,vx:Math.cos(a)*BULLET_SPD,vy:Math.sin(a)*BULLET_SPD,traits:et,timer:TWIN_REPEAT_DELAY,slotType});
    }
    this.ammo--;
    this.fireTimer=fired.cooldown || FIRE_DELAY;
    playSound(fired.sound || 'shoot');
    const pos = muzzlePosForAngle(this, this.facingAngle, 22);
    for(let i=0;i<6;i++){const pa=this.facingAngle+(rnd()-0.5)*0.9; spawnParticle(pos.x,pos.y,Math.cos(pa)*(200+rnd()*200),Math.sin(pa)*(200+rnd()*200),0.16,'#ffe080',3);}
    if (this.ammo<=0) this._startReload();
  }

  _startReload() {
    this.reloading=true; this.reloadTimer=RELOAD_TIME;
    playSound('reload');
    const count = 24 + Math.floor(rnd() * 9);
    const left = 18;
    const right = W - 18;
    for (let i=0; i<count; i++) {
      const t = count <= 1 ? 0.5 : i / (count - 1);
      const depth = rnd();
      const sx = clamp(left + t * (right - left) + (rnd() - 0.5) * 42, 10, W - 10);
      const sy = H - 10 - rnd() * 52;
      const spreadBias = (sx - W / 2) / (W / 2);
      spawnShellCasing(sx, sy, {
        depth,
        scale: 0.75 + rnd() * 0.95 + depth * 0.35,
        vx: spreadBias * (30 + depth * 75) + (rnd() - 0.5) * (90 + depth * 240),
        vy: -(175 + rnd() * 145 + depth * 105),
        gravity: 520 + rnd() * 190 + depth * 70,
        life: 1.15 + rnd() * 0.45,
        ceilingY: AREA.y + AREA.h * (0.73 + rnd() * 0.11)
      });
    }
  }

  takeDamage(amt, srcX=this.x, srcY=this.y) {
    if (this.invTimer>0||this.dashing) return;
    this.hp-=amt; this.invTimer=0.65;
    addDamagePopup(this.x, this.y-26, amt, '#ff6060', false);
    const hitDx = srcX - this.x;
    const hitDy = srcY - this.y;
    hitDir.timer = 0.4;
    hitDir.angle = Math.atan2(hitDy, hitDx);
    playSound('playerHit');
    screenPulse('#ff4040', 0.18, 3.5);
    triggerHitStop(0.05, 0.35);
    for(let i=0;i<12;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*110,Math.sin(a)*110,0.45,'#ff8080',3);}
    if (this.hp<=0) {
      clearScheduledTimers();
      startTransition(0.4, () => { gameState='dead'; });
    }
  }

  draw() {
    const facingLeft = Math.abs(this.facingAngle) > Math.PI/2;
    for (const ai of this.afterimages) {
      const aiLeft = Math.abs(ai.a) > Math.PI/2;
      cx.save(); cx.globalAlpha=Math.max(0,ai.life/0.3)*0.35;
      cx.translate(ai.x,ai.y);
      cx.save(); if(aiLeft) cx.scale(-1,1); _drawPlayerBody('#80a0ff','#4060a0'); cx.restore();
      cx.save(); cx.rotate(ai.a); _drawGun('#4060a0'); cx.restore();
      cx.restore();
    }
    cx.save(); cx.translate(this.x,this.y);
    const fl=this.invTimer>0 && Math.floor(this.invTimer*10)%2===0;
    if (!fl) {
      cx.save(); if(facingLeft) cx.scale(-1,1); _drawPlayerBody('#e8d5a0','#4a3a2a'); cx.restore();
      cx.save(); cx.rotate(this.facingAngle); _drawGun('#1a0a00'); cx.restore();
    }
    cx.restore();
  }
}

function _drawPlayerBody(skin, coat) {
  cx.shadowColor='#e8d5a0'; cx.shadowBlur=8;
  cx.fillStyle=coat;
  cx.beginPath(); cx.ellipse(0,2,11,14,0,0,PI2); cx.fill();
  cx.fillStyle=skin;

function roomTypeAt(index) {
  if (index < 0 || index >= TOTAL_ROOMS) return null;
  if (index === MIDBOSS_ROOM_INDEX) return 'midboss';
  const seqIdx = index > MIDBOSS_ROOM_INDEX ? index - 1 : index;
  return roomSeq?.[seqIdx] || null;
}

function enemyProjectileSpeed(base, eliteBoost=false, idx=roomIdx) {
  return scaleStat(base, 'projectile', idx, eliteBoost);
}

function startTransition(duration=0.25, onMid=null) {
  transition.active = true;
  transition.progress = 0;
  transition.duration = Math.max(0.05, duration);
  transition.onMid = onMid;
  transition.midDone = false;
}

function triggerSlotFlash(slot, color='#ffd040') {
  slotFlash.slot = slot;
  slotFlash.timer = 0.22;
  slotFlash.color = color;
}

function triggerUIShake(intensity=8, duration=0.2) {
  uiShake.timer = Math.max(uiShake.timer, duration);
  uiShake.intensity = Math.max(uiShake.intensity, intensity);
}

function addUIPopup(x, y, text, color='#ffd040') {
  uiPopups.push({ x, y, text, color, life:0.6, maxLife:0.6, vy:-30 });
}

function generateFloorMap() {
  const coords = [{ x:0, y:0 }];
  const occupied = new Map([[roomCoordKey(0, 0), 0]]);
  let guard = 0;

  while (coords.length < FLOOR_ROOM_COUNT && guard < 800) {
    guard++;
    const base = rnd() < 0.66 ? coords[coords.length - 1] : coords[Math.floor(rnd() * coords.length)];
    for (const d of shuffledDirs()) {
      const nx = base.x + d.dx;
      const ny = base.y + d.dy;
      const key = roomCoordKey(nx, ny);
      if (occupied.has(key)) continue;
      occupied.set(key, coords.length);
      coords.push({ x:nx, y:ny });
      break;
    }
  }

  // Fallback keeps every room connected even if the random walk gets boxed in.
  while (coords.length < FLOOR_ROOM_COUNT) {
    let placed = false;
    for (const base of coords) {
      for (const d of DIRS) {
        const nx = base.x + d.dx;
        const ny = base.y + d.dy;
        const key = roomCoordKey(nx, ny);
        if (occupied.has(key)) continue;
        occupied.set(key, coords.length);
        coords.push({ x:nx, y:ny });
        placed = true;
        break;
      }
      if (placed) break;
    }
    if (!placed) break;
  }

  const rooms = coords.map((c, id) => ({
    id,
    type: id === 0 ? 'start' : 'combat',
    layoutId: 'normal_open',
    gridX: c.x,
    gridY: c.y,
    visited: false,
    cleared: id === 0,
    locked: false,
    entryRewardClaimed: false,
    rewardClaimed: false,
    rewardChoices: null,
    shopItems: null,
    waves: null,
    doors: { north:null, east:null, south:null, west:null }
  }));
  const byCoord = new Map(rooms.map(r => [roomCoordKey(r.gridX, r.gridY), r]));

  for (const room of rooms) {
    for (const d of DIRS) {
      const target = byCoord.get(roomCoordKey(room.gridX + d.dx, room.gridY + d.dy));
      if (target) room.doors[d.key] = target.id;
    }
  }

  const candidates = rooms.filter(r => r.id !== 0);
  const bossRoom = candidates.reduce((best, room) => {
    const bd = roomDistance(best);
    const rd = roomDistance(room);
    return rd > bd || (rd === bd && countRoomDoors(room) < countRoomDoors(best)) ? room : best;
  }, candidates[0]);
  bossRoom.type = 'boss';

  const used = new Set([0, bossRoom.id]);
  const pickUnusedRoom = (filterFn, sortFn) => {
    const picks = rooms.filter(r => !used.has(r.id) && (!filterFn || filterFn(r)));
    if (sortFn) picks.sort(sortFn);
    const room = picks[0];
    if (room) used.add(room.id);
    return room;
  };

  const midbossRoom = pickUnusedRoom(
    r => roomDistance(r) >= 2,
    (a, b) => {
      const ad = Math.abs(roomDistance(a) - 3);
      const bd = Math.abs(roomDistance(b) - 3);
      return ad - bd || countRoomDoors(a) - countRoomDoors(b);
    }
  );
  if (midbossRoom) midbossRoom.type = 'midboss';

  const timeAttackRoom = pickUnusedRoom(
    r => roomDistance(r) >= 2,
    (a, b) => roomDistance(b) - roomDistance(a) || countRoomDoors(a) - countRoomDoors(b)
  );
  if (timeAttackRoom) timeAttackRoom.type = 'timeattack';

  const deadEnds = rooms
    .filter(r => !used.has(r.id) && countRoomDoors(r) <= 1)
    .sort((a, b) => roomDistance(b) - roomDistance(a));
  const treasureRoom = deadEnds[0] || rooms.filter(r => !used.has(r.id)).sort((a, b) => roomDistance(b) - roomDistance(a))[0];
  if (treasureRoom) {
    treasureRoom.type = 'treasure';
    used.add(treasureRoom.id);
  }

  const shopCandidates = rooms
    .filter(r => !used.has(r.id) && roomDistance(r) >= 2)
    .sort((a, b) => Math.abs(roomDistance(a) - 3) - Math.abs(roomDistance(b) - 3));
  const shopRoom = shopCandidates[0] || rooms.find(r => !used.has(r.id));
  if (shopRoom) {
    shopRoom.type = 'shop';
    used.add(shopRoom.id);
  }

  const eliteRoom = rooms
    .filter(r => !used.has(r.id))
    .sort((a, b) => roomDistance(b) - roomDistance(a))[0];
  if (eliteRoom) {
    eliteRoom.type = 'elite';
    used.add(eliteRoom.id);
  }

  for (const room of rooms) {
    if (room.type === 'start' || room.type === 'treasure' || room.type === 'shop') room.layoutId = 'sanctuary';
    else if (room.type === 'midboss') room.layoutId = 'midboss_duel';
    else if (room.type === 'boss') room.layoutId = 'boss_arena';
    else room.layoutId = pickCombatLayout(room.type);
  }

  return {
    floorIndex: 1,
    startRoomId: 0,
    bossRoomId: bossRoom.id,
    midbossRoomId: midbossRoom?.id ?? null,
    timeAttackRoomId: timeAttackRoom?.id ?? null,
    rooms,
    roomById: new Map(rooms.map(r => [r.id, r]))
  };
}

function resetRoomRuntime() {
  clearScheduledTimers();
  bullets=[];
  pools=[];
  grenades=[];
  gravityWells=[];
  turrets=[];
  vortexes=[];
  beamBursts.length = 0;
  echoQueue=[];
  roomHazards=[];
  pendingWaveSpawn=null;
  pendingRewards=null;
  pendingRewardMeta=null;
  enemies=[];
  boss=null;
  waves=null;
  waveIdx=0;
  taTimer=0;
}

function placePlayerForEntry(entryDir=null) {
  if (!player) return;
  const margin = 82;
  const cx0 = AREA.x + AREA.w / 2;
  const cy0 = AREA.y + AREA.h / 2;
  if (entryDir === 'north') {
    player.x = cx0;
    player.y = AREA.y + margin;
  } else if (entryDir === 'south') {
    player.x = cx0;
    player.y = AREA_B - margin;
  } else if (entryDir === 'west') {
    player.x = AREA.x + margin;
    player.y = cy0;
  } else if (entryDir === 'east') {
    player.x = AREA_R - margin;
    player.y = cy0;
  } else {
    player.x = cx0;
    player.y = cy0;
  }
  player.x = clamp(player.x, AREA.x + player.r, AREA_R - player.r);
  player.y = clamp(player.y, AREA.y + player.r, AREA_B - player.r);
  player.vx = 0;
  player.vy = 0;
}

function enterRoom(roomId, entryDir=null) {
  const room = floorMap?.roomById.get(roomId);
  if (!room) return false;
  const needsEntryReward = !room.entryRewardClaimed;
  resetRoomRuntime();
  previousRoomId = currentRoomId;
  currentRoomId = room.id;
  currentRoom = room;
  currentRoom.visited = true;
  roomIdx = Math.max(0, roomsCleared);
  applyRoomLayout(room.layoutId);
  placePlayerForEntry(entryDir);
  updateCamera(true);
  syncAimFromScreen();
  if (needsEntryReward) {
    currentRoom.entryRewardClaimed = true;
    showEntryReward();
  } else {
    startCurrentRoom(room);
  }
  doorTravelCooldown = 0.35;
  return true;
}

function startCurrentRoom(room) {
  room.locked = false;
  if (room.type === 'start') {
    gameState = 'playing';
    waveBannerText = 'START ROOM';
    waveBannerTimer = 0.9;
    return;
  }
  if (room.type === 'treasure') {
    gameState = 'playing';
    if (!room.rewardClaimed) showReward(3);
    return;
  }
  if (room.type === 'shop') {
    openShop();
    return;
  }
  if (room.type === 'boss') {
    if (room.cleared) {
      gameState = 'playing';
      return;
    }
    room.locked = true;
    startBoss();
    return;
  }
  if (room.type === 'midboss') {
    if (room.cleared) {
      gameState = 'playing';
      waveBannerText = 'CLEARED';
      waveBannerTimer = 0.7;
      return;
    }
    startMidboss();
    return;
  }
  if (isBattleRoomType(room.type)) {
    spawnRoomHazards(room.type);
    if (room.cleared) {
      gameState = 'playing';
      waveBannerText = 'CLEARED';
      waveBannerTimer = 0.7;
      return;
    }
    room.locked = true;
    room.waves = room.waves || genWaves(room.type);
    waves = room.waves;
    waveIdx = 0;
    enemies = spawnWave(waves[0]);
    taTimer = room.type === 'timeattack' ? 60 : 0;
    gameState = 'playing';
    waveBannerText =
      room.type === 'elite' ? 'ELITE ROOM' :
      room.type === 'timeattack' ? 'TIME ATTACK' :
      'WAVE 1';
    waveBannerTimer = 1.0;
  }
}

function genRoomSeq() {
  const t=['normal','normal','elite','treasure','elite','timeattack','shop'];
  for(let i=t.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[t[i],t[j]]=[t[j],t[i]];}
  return t;
}

const LAYOUT_ENEMY_WEIGHTS = {
  normal_open:      { slasher:4, sniper:3, slime:3, doll:1, armor:1, bomber:1 },
  wide_hall:        { sniper:4, armor:3, bomber:3, slasher:2, doll:1, slime:1 },
  vertical_chapel:  { sniper:3, doll:3, slasher:3, slime:3, armor:1, bomber:1 },
  pillar_cross:     { slasher:3, slime:4, doll:3, bomber:2, armor:1, sniper:1 },
  split_lane:       { slime:4, bomber:3, slasher:3, doll:2, sniper:1, armor:1 },
  midboss_duel:     { slasher:4, armor:2, sniper:1, doll:1, bomber:1, slime:1 }
};

function weightedPick(weightMap) {
  const entries = Object.entries(weightMap).filter(([, weight]) => weight > 0);
  let total = 0;
  for (const [, weight] of entries) total += weight;
  let roll = rnd() * total;
  for (const [key, weight] of entries) {
    roll -= weight;
    if (roll <= 0) return key;
  }
  return entries[entries.length - 1]?.[0] || 'slasher';
}

function pickEnemyTypeForRoom(type, layoutId=currentLayoutId) {
  const weights = { ...(LAYOUT_ENEMY_WEIGHTS[layoutId] || LAYOUT_ENEMY_WEIGHTS.normal_open) };
  if (type === 'elite') {
    weights.armor += 2;
    weights.sniper += 1;
    weights.doll += 1;
  } else if (type === 'timeattack') {
    weights.bomber += 2;
    weights.slime += 2;
    weights.slasher += 1;
    weights.armor = Math.max(1, weights.armor - 1);
  } else if (type === 'midboss') {
    weights.slasher += 2;
    weights.armor += 1;
  }
  return weightedPick(weights);
}

function genWaves(type) {
  const eliteBoost = type === 'elite' || type === 'timeattack';
  const baseWaves = type==='timeattack' ? 2 : type==='elite' ? 3 : 1 + Math.floor(rnd()*3);
  const n = (type==='normal' || type==='combat')
    ? 2
    : type==='timeattack'
    ? 2
    : clamp(Math.round(scaleStat(baseWaves, 'wave', roomIdx, eliteBoost)), type==='elite' ? 3 : 1, 6);
  const res=[];
  for(let w=0;w<n;w++){
    const baseCount = type==='elite' ? 3 + Math.floor(rnd()*2) : 2 + Math.floor(rnd()*2);
    const scaledCount = Math.round(scaleStat(baseCount, 'spawn', roomIdx, eliteBoost));
    const cnt = clamp(scaledCount, 2, 7);
    res.push(Array.from({length:cnt},()=>pickEnemyTypeForRoom(type)));
  }
  return res;
}

function pickCombatLayout(type) {
  if (type === 'timeattack') return rnd() < 0.5 ? 'wide_hall' : 'split_lane';
  if (type === 'elite') {
    const picks = ['pillar_cross', 'vertical_chapel', 'split_lane'];
    return picks[Math.floor(rnd() * picks.length)];
  }
  const picks = ['normal_open', 'wide_hall', 'vertical_chapel', 'pillar_cross'];
  return picks[Math.floor(rnd() * picks.length)];
}

function spawnPointForMode(mode, pad=34) {
  if (mode === 'leftRight') {
    const left = rnd() < 0.5;
    return {
      x: left ? AREA.x + pad : AREA_R - pad,
      y: AREA.y + pad + rnd() * (AREA.h - pad * 2)
    };
  }
  if (mode === 'topBottom') {
    const top = rnd() < 0.5;
    return {
      x: AREA.x + pad + rnd() * (AREA.w - pad * 2),
      y: top ? AREA.y + pad : AREA_B - pad
    };
  }
  if (mode === 'corners') {
    const corners = [
      [AREA.x + pad, AREA.y + pad],
      [AREA_R - pad, AREA.y + pad],
      [AREA.x + pad, AREA_B - pad],
      [AREA_R - pad, AREA_B - pad]
    ];
    const [x, y] = corners[Math.floor(rnd() * corners.length)];
    return { x: x + (rnd() - 0.5) * 42, y: y + (rnd() - 0.5) * 42 };
  }
  if (mode === 'pockets') {
    const pockets = [
      [AREA.x + AREA.w * 0.22, AREA.y + AREA.h * 0.25],
      [AREA.x + AREA.w * 0.78, AREA.y + AREA.h * 0.25],
      [AREA.x + AREA.w * 0.22, AREA.y + AREA.h * 0.75],
      [AREA.x + AREA.w * 0.78, AREA.y + AREA.h * 0.75]
    ];
    const [x, y] = pockets[Math.floor(rnd() * pockets.length)];
    return { x: x + (rnd() - 0.5) * 54, y: y + (rnd() - 0.5) * 48 };
  }
  const side=Math.floor(rnd()*4);
  if (side===0) return { x: AREA.x+pad+rnd()*(AREA.w-pad*2), y: AREA.y+pad };
  if (side===1) return { x: AREA.x+pad+rnd()*(AREA.w-pad*2), y: AREA_B-pad };
  if (side===2) return { x: AREA.x+pad, y: AREA.y+pad+rnd()*(AREA.h-pad*2) };
  return { x: AREA_R-pad, y: AREA.y+pad+rnd()*(AREA.h-pad*2) };
}

function enemySpawnRadius(type) {
  return ENEMY_SPAWN_RADIUS[type] || 16;
}

function isSafeSpawnPoint(x, y, type='slasher', extraPad=0) {
  const r = enemySpawnRadius(type) + extraPad;
  if (x < AREA.x + r || x > AREA_R - r || y < AREA.y + r || y > AREA_B - r) return false;
  if (player && (player.x-x)**2 + (player.y-y)**2 < (160 + r) ** 2) return false;

  for (const hz of roomHazards) {
    if (hz.type === 'pillar') {
      const minD = hz.r + r + 12;
      if ((hz.x-x)**2 + (hz.y-y)**2 < minD * minD) return false;
    } else if (hz.type === 'acid') {
      const minD = hz.r + r + 30;
      if ((hz.x-x)**2 + (hz.y-y)**2 < minD * minD) return false;
    } else if (hz.type === 'conveyor') {
      if (circleRectOverlap(x, y, r + 8, hz)) return false;
    }
  }

  if (currentRoom?.doors) {
    const rects = getDoorRects();
    for (const d of DIRS) {
      if (currentRoom.doors[d.key] === null || currentRoom.doors[d.key] === undefined) continue;
      if (circleRectOverlap(x, y, r + 60, rects[d.key])) return false;
    }
  }

  if (enemies) {
    for (const e of enemies) {
      if (!e.alive) continue;
      const minD = e.r + r + 14;
      if ((e.x-x)**2 + (e.y-y)**2 < minD * minD) return false;
    }
  }

  return true;
}

function findSafeSpawnPoint(mode, type='slasher', pad=34, attempts=24) {
  let fallback = null;
  for (let i=0;i<attempts;i++) {
    const p = spawnPointForMode(mode, pad);
    const r = enemySpawnRadius(type);
    const x = clamp(p.x, AREA.x + r, AREA_R - r);
    const y = clamp(p.y, AREA.y + r, AREA_B - r);
    fallback = fallback || { x, y };
    if (isSafeSpawnPoint(x, y, type)) return { x, y };
  }
  return fallback || {
    x: clamp(AREA.x + AREA.w / 2, AREA.x + 28, AREA_R - 28),
    y: clamp(AREA.y + AREA.h / 2, AREA.y + 28, AREA_B - 28)
  };
}

function findSafePointNear(x, y, type='slasher', radius=42, attempts=18) {
  const r = enemySpawnRadius(type);
  for (let i=0;i<attempts;i++) {
    const dist = radius * (0.45 + rnd() * 0.9);
    const a = rnd() * PI2;
    const px = clamp(x + Math.cos(a) * dist, AREA.x + r, AREA_R - r);
    const py = clamp(y + Math.sin(a) * dist, AREA.y + r, AREA_B - r);
    if (isSafeSpawnPoint(px, py, type, 2)) return { x:px, y:py };
  }
  return {
    x: clamp(x, AREA.x + r, AREA_R - r),
    y: clamp(y, AREA.y + r, AREA_B - r)
  };
}

function spawnWave(wEnems) {
  return wEnems.map(t=>{
    const p = findSafeSpawnPoint(currentLayout?.spawnMode || 'edges', t);
    return armRoomEnemy(spawnEnemy(p.x, p.y, t, ENEMY_SPAWN_DELAY));
  });
}

function nextRoom() {
  clearScheduledTimers();
  roomIdx++;
  bullets=[]; pools=[]; gravityWells=[]; echoQueue=[]; roomHazards=[]; pendingWaveSpawn=null;
  if (roomIdx>=TOTAL_ROOMS) { startBoss(); return; }
  if (roomIdx===MIDBOSS_ROOM_INDEX) {
    currentRoom={type:'midboss',cleared:false};
    startMidboss();
    return;
  }
  const type=roomTypeAt(roomIdx);
  currentRoom={type,cleared:false};
  if (type==='normal'||type==='elite') {
    applyRoomLayout(pickCombatLayout(type));
    player.x = clamp(player.x, AREA.x + player.r, AREA_R - player.r);
    player.y = clamp(player.y, AREA.y + player.r, AREA_B - player.r);
    waves=genWaves(type); waveIdx=0;
    enemies=spawnWave(waves[0]); gameState='playing';
    spawnRoomHazards(type);
    waveBannerText='WAVE 1';
    waveBannerTimer=1.0;
  } else if (type==='treasure') {
    applyRoomLayout('sanctuary');
    enemies=[]; showReward(3);
  } else if (type==='timeattack') {
    applyRoomLayout(pickCombatLayout(type));
    player.x = clamp(player.x, AREA.x + player.r, AREA_R - player.r);
    player.y = clamp(player.y, AREA.y + player.r, AREA_B - player.r);
    waves=genWaves('timeattack'); waveIdx=0;
    enemies=spawnWave(waves[0]); taTimer=60; gameState='playing';
    spawnRoomHazards(type);
    waveBannerText='TIME ATTACK';
    waveBannerTimer=1.0;
  } else if (type==='shop') {
    applyRoomLayout('sanctuary');
    enemies=[]; openShop();
  }
}

function startMidboss() {
  clearScheduledTimers();
  applyRoomLayout('midboss_duel');
  if (player) {
    player.x = clamp(player.x, AREA.x + player.r, AREA_R - player.r);
    player.y = clamp(player.y, AREA.y + player.r, AREA_B - player.r);

  if (!currentRoom || currentRoom.type !== 'midboss') currentRoom={type:'midboss',cleared:false,locked:true};

  spawnRoomHazards('midboss');

  waveBannerTimer=1.2;
}

function startBoss() {
  clearScheduledTimers();
  applyRoomLayout('boss_arena');
  if (player) {
    player.x = clamp(player.x, AREA.x + player.r, AREA_R - player.r);

function showReward(extra=0, opt={}) {
  const count = opt.count ?? rewardChoiceCount(extra);
  const storeOnRoom = opt.storeOnRoom !== false;
  let choices = storeOnRoom ? currentRoom?.rewardChoices : null;
  if (!choices) {
    choices = rollMixedRewardChoices(count, !!opt.forceSlotType);
    if (storeOnRoom && currentRoom) currentRoom.rewardChoices = choices;
  }
  playSound('reward');
  pendingRewards=choices;
  pendingRewardMeta = {
    mode: opt.mode || 'room',
    title: opt.title || '보상 선택',
    subtitle: opt.subtitle || '특성 또는 슬롯 타입 하나를 골라 인벤토리에 추가하세요.',
    nextWaveIdx: opt.nextWaveIdx ?? null,
    completeRoom: !!opt.completeRoom
  };
  gameState='reward';
}

function showWaveReward(nextWaveIdx=null, completeRoom=false) {
  showReward(0, {
    count: waveRewardChoiceCount(),
    storeOnRoom: false,
    mode: 'wave',
    title: '웨이브 보상',
    subtitle: completeRoom ? '마지막 웨이브를 돌파했습니다. 보상 하나를 고르세요.' : '다음 웨이브 전에 보상 하나를 고르세요.',
    nextWaveIdx,
    completeRoom
  });
}

function showEntryReward() {
  showReward(0, {
    count: entryRewardChoiceCount(),
    storeOnRoom: false,
    mode: 'entry',
    title: '입장 보상',
    subtitle: '방에 들어서며 보상 하나를 획득합니다.',
    forceSlotType: slotTypeInventory.length + player.slotTypes.filter(Boolean).length < 2
  });
}

function openShop() {
  let stored = currentRoom?.shopItems;
  if (!stored) {
    const traitPool=[...TRAITS], slotPool=[...SLOT_TYPES].filter(type => !ownedSlotTypeIds().has(type.id)), items=[];
    for(let i=0;i<3;i++){
      const useSlot = slotPool.length && (i === 0 || rnd() < 0.35);
      if (useSlot) {
        const j=Math.floor(rnd()*slotPool.length);
        const slotType=slotPool.splice(j,1)[0];
        items.push({reward:makeSlotTypeRewardItem(slotType),cost:4,sold:false});
      } else if (traitPool.length) {
        const j=Math.floor(rnd()*traitPool.length);
        const trait=traitPool.splice(j,1)[0];
        items.push({reward:makeTraitRewardItem(trait),cost:3 + (trait.id==='overload'||trait.id==='chain_explosion'?1:0),sold:false});
      }
    }
    stored = {items,potionAvail:true};
    if (currentRoom) currentRoom.shopItems = stored;
  }
  playSound('menuOpen');
  shopItems=stored; gameState='shop';
}

function finishRewardSelection() {
  const rewardMeta = pendingRewardMeta;
  pendingRewardMeta = null;
  if (!floorMap) {
    nextRoom();
    return;
  }
  if (rewardMeta?.mode === 'wave') {
    pendingRewards = null;
    gameState = 'playing';
    if (rewardMeta.completeRoom) {
      roomCleared();
    } else if (rewardMeta.nextWaveIdx !== null && rewardMeta.nextWaveIdx !== undefined) {
      waveIdx = rewardMeta.nextWaveIdx;
      pendingWaveSpawn = waveDelayForRoom(roomIdx);
      waveBannerText = `WAVE ${waveIdx+1}`;
      waveBannerTimer = 1.0;
      playSound('wave');
    }
    return;
  }
  if (rewardMeta?.mode === 'entry') {
    pendingRewards = null;
    gameState = 'playing';
    if (currentRoom) startCurrentRoom(currentRoom);
    return;
  }
  if (currentRoom) {
    currentRoom.rewardClaimed = true;
    currentRoom.cleared = true;
    currentRoom.locked = false;
  }
  pendingRewards = null;
  gameState = 'playing';
  waveBannerText = 'ROOM CLEARED';
  waveBannerTimer = 0.75;
}

function closeShop() {
  if (!floorMap) {
    nextRoom();
    return;
  }
  if (currentRoom) {
    currentRoom.shopItems = shopItems;
    currentRoom.cleared = true;
    currentRoom.locked = false;
  }
  gameState = 'playing';
  waveBannerText = 'SHOP CLOSED';
  waveBannerTimer = 0.65;
}

function roomCleared() {
  if (!currentRoom || currentRoom.cleared) return;
  currentRoom.cleared=true;
  currentRoom.locked=false;
  roomsCleared++;
  if (isBattleRoomType(currentRoom.type)) combatRoomsCleared++;
  player.currency+=currentRoom.type==='elite'?3:currentRoom.type==='timeattack'?4:currentRoom.type==='midboss'?4:2;
  if (floorMap) {
    if (isRewardRoomType(currentRoom.type)) {
      startTransition(0.3, () => showReward(currentRoom.type==='midboss'?3:0));
    } else {
      waveBannerText='ROOM CLEARED';
      waveBannerTimer=1.0;
      playSound('reward');
    }
    return;
  }
  startTransition(0.3, () => showReward(currentRoom.type==='midboss'?3:0));
}

function getDoorRects() {
  const doorW = 96;
  const doorT = 30;
  const midX = AREA.x + AREA.w / 2;
  const midY = AREA.y + AREA.h / 2;
  return {
    north: { x:midX - doorW / 2, y:AREA.y - 2, w:doorW, h:doorT },
    south: { x:midX - doorW / 2, y:AREA_B - doorT + 2, w:doorW, h:doorT },
    west:  { x:AREA.x - 2, y:midY - doorW / 2, w:doorT, h:doorW },
    east:  { x:AREA_R - doorT + 2, y:midY - doorW / 2, w:doorT, h:doorW }
  };
}

function circleRectOverlap(x, y, r, rect) {
  const nx = clamp(x, rect.x, rect.x + rect.w);
  const ny = clamp(y, rect.y, rect.y + rect.h);
  const dx = x - nx;
  const dy = y - ny;
  return dx * dx + dy * dy <= r * r;
}

function drawDoors() {
  if (!currentRoom?.doors) return;
  const rects = getDoorRects();
  const locked = !!currentRoom.locked;
  for (const d of DIRS) {
    const targetId = currentRoom.doors[d.key];
    if (targetId === null || targetId === undefined) continue;
    const r = rects[d.key];
    const target = floorMap?.roomById.get(targetId);
    const special =
      target?.type === 'boss' ? '#ff5050' :
      target?.type === 'shop' ? '#70ff90' :
      target?.type === 'treasure' ? '#ffd040' :
      target?.type === 'timeattack' ? '#80d0ff' :
      target?.type === 'midboss' ? '#b8d4ff' :
      target?.type === 'elite' ? '#ff9c70' :
      '#D4AF37';
    cx.save();
    cx.fillStyle = locked ? 'rgba(30,8,4,0.92)' : 'rgba(8,8,4,0.86)';
    cx.strokeStyle = locked ? '#7a2a20' : special;
    cx.lineWidth = locked ? 3 : 2;
    cx.shadowColor = locked ? '#ff4020' : special;
    cx.shadowBlur = locked ? 8 : 10;
    cx.fillRect(r.x, r.y, r.w, r.h);
    cx.strokeRect(r.x, r.y, r.w, r.h);
    cx.shadowBlur = 0;
    cx.fillStyle = locked ? '#a05040' : special;
    cx.font = 'bold 10px Courier New';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    const label = locked ? 'LOCK' :
      target?.type === 'boss' ? 'BOSS' :
      target?.type === 'shop' ? 'SHOP' :
      target?.type === 'treasure' ? 'LOOT' :
      target?.type === 'timeattack' ? 'TIME' :
      target?.type === 'midboss' ? 'MID' :
      target?.type === 'elite' ? 'ELITE' :
      'DOOR';
    cx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    cx.restore();
  }
}

function enterDoor(direction) {
  if (!currentRoom?.doors || currentRoom.locked || doorTravelCooldown > 0 || transition.active) return false;
  const targetId = currentRoom.doors[direction];
  if (targetId === null || targetId === undefined) return false;
  const entryDir = DIR_BY_KEY[direction]?.opposite || null;
  playSound('menuClose');
  return enterRoom(targetId, entryDir);
}

function updateDoorTravel() {
  if (!floorMap || !player || !currentRoom || gameState !== 'playing') return false;
  if (currentRoom.locked || doorTravelCooldown > 0 || transition.active) return false;
  const rects = getDoorRects();
  for (const d of DIRS) {
    const targetId = currentRoom.doors?.[d.key];
    if (targetId === null || targetId === undefined) continue;
    if (circleRectOverlap(player.x, player.y, player.r + 2, rects[d.key])) return enterDoor(d.key);
  }
  return false;
}

// === TAB MENU ===
function handleTab() {
  if (transition.active) return;
  if (gameState==='playing'||gameState==='boss') {
    playSound('menuOpen');
    startTransition(0.15, () => {
      gameState='tab';
      dragTrait=null;
      tabSelSlotTypeInv = -1;
      invScroll = clamp(invScroll, 0, maxInvScroll());
    });
  } else if (gameState==='tab') {
    playSound('menuClose');
    startTransition(0.15, () => {
      gameState=currentRoom?.type==='boss'?'boss':'playing';
      dragTrait=null;
      tabSelSlotTypeInv = -1;
    });
  }
}

const TS_X=165, TS_Y=255, TS_W=88, TS_GAP=98;
const TI_X=145, TI_Y=410, TI_W=92, TI_H=64, TI_GAP=102;
const STI_X=131, STI_Y=360, STI_W=78, STI_H=38, STI_GAP=84;

function slotRect(s){return{x:TS_X+s*TS_GAP,y:TS_Y,w:TS_W,h:TS_W};}
function slotTypeRect(s){const r=slotRect(s); return{x:r.x+6,y:r.y+20,w:r.w-12,h:16};}
function invRect(i){const col=i%8,row=Math.floor(i/8); return{x:TI_X+col*TI_GAP,y:TI_Y+row*76,w:TI_W,h:TI_H};}
function slotTypeInvRect(i){const col=i%8,row=Math.floor(i/8); return{x:STI_X+col*STI_GAP,y:STI_Y+row*44,w:STI_W,h:STI_H};}
function maxInvScroll() {
  return Math.max(0, Math.ceil(inventory.length / 8) - 2);
}
function tabInventoryHitIndex(mx, my) {
  const invStart = invScroll * 8;
  const invEnd = Math.min(inventory.length, invStart + 16);
  for (let i = invStart; i < invEnd; i++) {
    const r = invRect(i - invStart);
    if (mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) return i;
  }
  return -1;
}
function tabSlotHitIndex(mx, my) {
  for (let s=0;s<6;s++){
    const r=slotRect(s);
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h) return s;
  }
  return -1;
}
function collectOwnedTraitIds() {
  const ids = new Set(inventory.map(t => t.id));
  for (let s=0; s<6; s++) for (const tid of player.slots[s]) ids.add(tid);
  return ids;
}
function getSynergyMatches(baseId) {
  if (!baseId) return [];
  const owned = collectOwnedTraitIds();
  return SYNERGIES
    .filter(s => s.pair.includes(baseId))
    .map(s => ({ ...s, other: s.pair[0]===baseId ? s.pair[1] : s.pair[0] }))
    .filter(s => owned.has(s.other));
}
function getSlotSynergyKeys(slot) {
  const ids = new Set(slot);
  return new Set(SYNERGIES
    .filter(s => s.pair.every(id => ids.has(id)))
    .map(s => s.pair.join('+')));
}
function triggerSlotSynergyFeedback(slot, x, y, previousKeys=new Set()) {
  const ids = new Set(slot);
  const matches = SYNERGIES.filter(s => s.pair.every(id => ids.has(id)) && !previousKeys.has(s.pair.join('+')));
  if (!matches.length) return;
  const latest = matches[matches.length - 1];
  playSound('reward');
  triggerUIShake(8, 0.22);
  screenPulse('#ffd040', 0.12, 2);
  addUIPopup(x, y, `시너지: ${latest.name}`, '#ffd040');
}

function calcSlotDirectDamagePreview(traitIds=[]) {
  return calcSlotTypePreview('buckshot', traitIds);
}

function beginTabDrag(mx, my) {
  if (transition.active) return false;
  const invIdx = tabInventoryHitIndex(mx, my);
  if (invIdx < 0 || !inventory[invIdx]) return false;
  dragTrait = {
    trait: inventory[invIdx],
    fromInv: invIdx,
    startX: mx,
    startY: my,
    moved: false
  };
  tabSelInv = invIdx;
  tabSelSlotTypeInv = -1;
  tabSelSlot = -1;
  return true;
}
function finishTabDrag(mx, my) {
  if (!dragTrait) return;
  const slotIdx = tabSlotHitIndex(mx, my);
  const td = dragTrait.trait;
  let applied = false;
  if (slotIdx >= 0 && td) {
    const slot = player.slots[slotIdx];
    if (slot.length < 3) {
      const liveIdx = inventory.indexOf(td);
      if (liveIdx >= 0) {
        const beforeSynergyKeys = getSlotSynergyKeys(slot);
        slot.push(td.id);
        inventory.splice(liveIdx, 1);
        playSound('equip');
        triggerSlotFlash(slotIdx, td.color);
        const r = slotRect(slotIdx);
        addUIPopup(r.x + r.w * 0.5, r.y - 4, td.name, td.color);
        triggerSlotSynergyFeedback(slot, r.x + r.w * 0.5, r.y - 24, beforeSynergyKeys);
        tabSelSlot = slotIdx;
        tabSelInv = -1;
        applied = true;
      }
    } else {
      playSound('error');
      triggerUIShake(7, 0.16);
      addUIPopup(mx, my - 8, '슬롯 가득 참', '#ff7070');
    }
  }
  if (!applied && dragTrait.moved) playSound('menuClose');
  dragTrait = null;
  invScroll = clamp(invScroll, 0, maxInvScroll());
}

function tabClick(mx,my) {
  if (transition.active || dragTrait) return;
  // Check cylinder slots
  for(let s=0;s<6;s++){
    const r=slotRect(s);
    const typeRect = slotTypeRect(s);
    if (mx>=typeRect.x&&mx<=typeRect.x+typeRect.w&&my>=typeRect.y&&my<=typeRect.y+typeRect.h) {
      if (tabSelSlotTypeInv >= 0 && slotTypeInventory[tabSelSlotTypeInv]) {
        const type = slotTypeInventory[tabSelSlotTypeInv];
        const prev = player.slotTypes[s];
        if (prev) slotTypeInventory.push(slotTypeDef(prev));
        player.slotTypes[s] = type.id;
        slotTypeInventory.splice(tabSelSlotTypeInv, 1);
        playSound('equip');
        triggerSlotFlash(s, type.color);
        addUIPopup(r.x+r.w*0.5, r.y-16, type.name, type.color);
        tabSelSlotTypeInv = -1;
      } else if (player.slotTypes[s]) {
        slotTypeInventory.push(slotTypeDef(player.slotTypes[s]));
        playSound('unequip');
        addUIPopup(r.x+r.w*0.5, r.y-16, '타입 해제', '#ffd040');
        player.slotTypes[s] = null;
      } else {
        playSound('menuOpen');
        tabSelSlot = tabSelSlot===s ? -1 : s;
      }
      tabSelSlot = s;
      tabSelInv = -1;
      invScroll = clamp(invScroll, 0, maxInvScroll());
      return;
    }
    // Check remove sub-traits
    const slot=player.slots[s];
    for(let t=0;t<slot.length;t++){
      const tx=r.x+4+t*24, ty=r.y+r.h-22;
      if(mx>=tx&&mx<=tx+20&&my>=ty&&my<=ty+18){
        const tid=slot.splice(t,1)[0];
        const td=traitDef(tid); if(td) inventory.push(td);
        playSound('unequip');
        triggerSlotFlash(s, td?.color || '#ff8080');
        addUIPopup(r.x+r.w*0.5, r.y-4, td ? `+ ${td.name}` : '해제', td?.color || '#ffd040');
        tabSelSlot=s;
        tabSelInv=-1; tabSelSlotTypeInv=-1; return;
      }
    }
    // Click slot to place selected trait
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
      if(tabSelInv>=0 && slot.length<3){
        const td = inventory[tabSelInv];
        const beforeSynergyKeys = getSlotSynergyKeys(slot);
        slot.push(td.id);
        inventory.splice(tabSelInv,1);
        playSound('equip');
        triggerSlotFlash(s, td.color);
        addUIPopup(r.x+r.w*0.5, r.y-4, td.name, td.color);
        triggerSlotSynergyFeedback(slot, r.x+r.w*0.5, r.y-24, beforeSynergyKeys);
        tabSelSlot=s;
        tabSelInv=-1;
        tabSelSlotTypeInv=-1;
      } else if (tabSelInv>=0 && slot.length>=3) {
        playSound('error');
        triggerUIShake(7, 0.16);
        addUIPopup(mx, my - 8, '슬롯 가득 참', '#ff7070');
      } else {
        tabSelSlot = tabSelSlot===s ? -1 : s;
        playSound('menuOpen');
      }
      invScroll = clamp(invScroll, 0, maxInvScroll());
      return;
    }
  }
  // Check inventory
  const invStart = invScroll * 8;
  const invEnd = Math.min(inventory.length, invStart + 16);
  for(let i=invStart;i<invEnd;i++){
    const r=invRect(i-invStart);
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
      playSound('menuOpen');
      tabSelSlot=-1;
      tabSelSlotTypeInv=-1;
      tabSelInv=(tabSelInv===i)?-1:i;
      return;
    }
  }
  for (let i=0;i<slotTypeInventory.length;i++) {
    const r=slotTypeInvRect(i);
    if(mx>=r.x&&mx<=r.x+r.w&&my>=r.y&&my<=r.y+r.h){
      playSound('menuOpen');
      tabSelSlot=-1;
      tabSelInv=-1;
      tabSelSlotTypeInv=(tabSelSlotTypeInv===i)?-1:i;
      return;
    }
  }
  tabSelInv=-1;
  tabSelSlot=-1;
  tabSelSlotTypeInv=-1;
}

// === COLLISIONS ===
function doCollisions(dt) {
  // Player bullets -> enemies/boss
  for(const b of bullets){
    if(!b.alive||!b.fromPlayer) continue;
    for (const hz of roomHazards) {
      if (hz.type === 'pillar' && hz.contains(b.x, b.y)) { b.alive = false; break; }
      if (hz.type === 'conveyor' && hz.contains(b.x, b.y)) {
        if (hz.w > hz.h) b.x += hz.dir * 2;
        else b.y += hz.dir * 2;
      }
    }
    if (!b.alive) continue;
    if(boss&&boss.alive){
      if(dist2(b,boss)<(boss.r+b.radius)**2){
        boss.hit(b.damage,b.traits);
        b.remainingHits--;
        if (b.remainingHits <= 0) b.alive=false;
      }
    }
    for(const e of enemies){
      if(!e.alive||!b.alive) continue;
      if(dist2(b,e)<(e.r+b.radius)**2){
        e.hit(b.damage,b.traits,b.x,b.y);
        b.remainingHits--;
        if (b.remainingHits <= 0) b.alive=false;
        // Explosive
        if(b.hasExplosive){
          for(const e2 of enemies) if(e2!==e&&e2.alive&&dist2(b,e2)<60*60) e2.hit(0.6,[],b.x,b.y);
          for(let i=0;i<14;i++){const a=rnd()*PI2; spawnParticle(b.x,b.y,Math.cos(a)*160,Math.sin(a)*160,0.55,'#ff8040',4);}
        }
        // Gravity
        if(b.hasGravity){
          spawnGravityWell(b.x, b.y);
        }
        // Chain
        if(b.hasChain && !b.chainDone){
          b.chainDone=true;
          let near=null,nd=1e9;
          for(const e2 of enemies) if(e2!==e&&e2.alive){const d=dist2(b,e2);if(d<nd){nd=d;near=e2;}}
          if(near){const d=Math.sqrt(nd); spawnBullet(b.x,b.y,(near.x-b.x)/d*BULLET_SPD*0.8,(near.y-b.y)/d*BULLET_SPD*0.8,true,b.chainTraits);}
        }
        // Split
        if(b.hasSplit){
          const spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy), ang=Math.atan2(b.vy,b.vx);
          const st=b.splitTraits;
          spawnBullet(b.x,b.y,Math.cos(ang+0.52)*spd,Math.sin(ang+0.52)*spd,true,st);
          spawnBullet(b.x,b.y,Math.cos(ang-0.52)*spd,Math.sin(ang-0.52)*spd,true,st);
          b.alive=false;
        }
        if(b.remainingHits <= 0) break;
      }
    }
  }
  // Enemy bullets -> player
  for(const b of bullets){
    if(!b.alive||b.fromPlayer) continue;
    for (const hz of roomHazards) {
      if (hz.type === 'pillar' && hz.contains(b.x, b.y)) { b.alive = false; break; }
    }
    if (!b.alive) continue;
    if(dist2(b,player)<(player.r+b.radius)**2){
      player.takeDamage(1, b.x, b.y); b.alive=false;
    }
  }
  // Curse pools -> player
  for(const p of pools){
    if(p.friendly) continue;
    if(dist2(p,player)<p.r*p.r){
      p.damageTick-=dt;
      if(p.damageTick<=0){ player.takeDamage(1, p.x, p.y); p.damageTick=1.0; }
    }
  }
  for (const hz of roomHazards) {
    if (hz.type !== 'acid') continue;
    hz.damageTick -= dt;
    if (hz.damageTick <= 0) {
      if (hz.contains(player.x, player.y)) player.takeDamage(1, player.x, player.y + 50);
      for (const e of enemies) if (e.alive && hz.contains(e.x, e.y)) e.hit(1, []);
      hz.damageTick = 0.5;
    }
  }
}

function drawBG() {

function drawCylinder() {
  // Barrel ring position: bottom-center
  const ccx=W/2, ccy=H-82;
  const outerR=54, orbitR=32, chamR=14;

  // Cylinder rotation offset (next shot points upward, 12 o'clock)
  const firedCount = MAX_AMMO - player.ammo;
  let rotOff = -firedCount * (PI2 / MAX_AMMO);
  if (player.reloading) {
    const t = 1 - player.reloadTimer / RELOAD_TIME;
    rotOff -= t * PI2 * 1.5; // Reload spin speed (1.5 turns)
  }

  cx.save();
  cx.translate(ccx, ccy);

  // Main barrel body
  const grad = cx.createRadialGradient(-14,-14,4, 0,0,outerR);
  grad.addColorStop(0, '#2a2000');
  grad.addColorStop(1, '#0a0800');
  cx.fillStyle=grad;
  cx.shadowColor='#D4AF37'; cx.shadowBlur=20;
  cx.beginPath(); cx.arc(0,0,outerR,0,PI2); cx.fill();
  cx.shadowBlur=0;
  cx.strokeStyle='#D4AF37'; cx.lineWidth=2.5;
  cx.beginPath(); cx.arc(0,0,outerR,0,PI2); cx.stroke();
  cx.strokeStyle='#6a5520'; cx.lineWidth=1;
  cx.beginPath(); cx.arc(0,0,outerR-7,0,PI2); cx.stroke();

  // Draw 6 chamber slots
  for (let i=0; i<MAX_AMMO; i++) {
    const angle = -Math.PI/2 + rotOff + i*(PI2/MAX_AMMO);
    const px=Math.cos(angle)*orbitR, py=Math.sin(angle)*orbitR;
    const isFired = !player.reloading && i<firedCount;
    const isNext  = !player.reloading && i===firedCount; // Next chamber to fire
    // Chamber background
    cx.fillStyle = isFired ? '#0a0000' : (isNext ? '#2e1e08' : '#1c1008');
    cx.beginPath(); cx.arc(px,py,chamR,0,PI2); cx.fill();

    cx.strokeStyle = isFired ? '#2a1800' : (isNext ? '#FFD700' : '#B8860B');
    cx.lineWidth = isNext ? 2 : 1.5;
    if (isNext) { cx.shadowColor='#FFD700'; cx.shadowBlur=10; }
    cx.beginPath(); cx.arc(px,py,chamR,0,PI2); cx.stroke();
    cx.shadowBlur=0;

    if (!isFired) {
      // Primer light (trait color)
      const tr=player.slots[i];
      const primerCol = tr.length>0 ? traitColor(tr[0]) : (player.slotTypes[i] ? slotTypeDef(player.slotTypes[i]).color : '#606060');
      cx.fillStyle=primerCol;
      cx.shadowColor=primerCol; cx.shadowBlur=isNext?10:5;
      cx.beginPath(); cx.arc(px,py,chamR*0.42,0,PI2); cx.fill();
      cx.shadowBlur=0;
    }

    // Chamber order label (1~6)
    cx.save();
    cx.translate(px, py);
    if (isFired) {
      cx.fillStyle='#4a1515'; cx.font='bold 11px Courier New';
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(i+1, 0, 0);
    } else {
      const numCol = isNext ? '#ffffc0' : '#d0a060';
      cx.fillStyle=numCol;
      if (isNext) { cx.shadowColor='#ffffc0'; cx.shadowBlur=8; }
      cx.font=`bold ${isNext?13:11}px Courier New`;
      cx.textAlign='center'; cx.textBaseline='middle';
      cx.fillText(i+1, 0, 0);
      cx.shadowBlur=0;
      // Trait stack count
      if (player.slots[i].length>0) {
        cx.fillStyle='#fff'; cx.font='bold 7px Courier New';
        cx.textAlign='center'; cx.textBaseline='middle';
        cx.fillText(player.slots[i].length, chamR*0.55, -chamR*0.55);
      }
      if (player.slotTypes[i]) {
        cx.fillStyle=slotTypeDef(player.slotTypes[i]).color;
        cx.font='bold 6px Courier New';
        cx.fillText(slotTypeDef(player.slotTypes[i]).short.slice(0,2), 0, chamR*0.72);
      }
    }
    cx.textBaseline='alphabetic';
    cx.restore();
  }

  // Barrel center cap
  cx.fillStyle='#B8860B'; cx.strokeStyle='#D4AF37'; cx.lineWidth=1.5;
  cx.beginPath(); cx.arc(0,0,5,0,PI2); cx.fill(); cx.stroke();

  // Firing direction marker (12 o'clock indicator)
  cx.fillStyle='#FFD700'; cx.shadowColor='#D4AF37'; cx.shadowBlur=14;
  cx.beginPath();
  cx.moveTo(-5, -(outerR+12));
  cx.lineTo( 5, -(outerR+12));
  cx.lineTo( 0, -(outerR));
  cx.closePath(); cx.fill();
  cx.shadowBlur=0;

  // Reload progress arc + text
  if (player.reloading) {
    const prog=1-player.reloadTimer/RELOAD_TIME;
    cx.strokeStyle='#FFD700'; cx.shadowColor='#FFD700'; cx.shadowBlur=10;
    cx.lineWidth=3;
    cx.beginPath(); cx.arc(0,0,outerR+7, -Math.PI/2, -Math.PI/2+prog*PI2); cx.stroke();
    cx.shadowBlur=0;
    cx.fillStyle='#D4AF37'; cx.font='bold 10px Orbitron, Courier New'; cx.textAlign='center';
    cx.fillText('재장전 중', 0, outerR+22);
  }

  cx.restore();

  cx.fillStyle='#504030'; cx.font='10px Courier New'; cx.textAlign='right';
  cx.fillText('[TAB] 특성 배치', W-8, H-6);
}

function drawMinimap() {
  if (!floorMap?.rooms?.length) return;
  const rooms = floorMap.rooms;
  const minX = Math.min(...rooms.map(r => r.gridX));
  const maxX = Math.max(...rooms.map(r => r.gridX));
  const minY = Math.min(...rooms.map(r => r.gridY));
  const maxY = Math.max(...rooms.map(r => r.gridY));
  const cell = 18;
  const gap = 5;
  const mapW = (maxX - minX + 1) * (cell + gap) - gap;
  const mapH = (maxY - minY + 1) * (cell + gap) - gap;
  const ox = W - mapW - 20;
  const oy = 82;

  cx.save();
  cx.fillStyle='rgba(0,0,0,0.72)';
  cx.strokeStyle='rgba(212,175,55,0.35)';
  cx.lineWidth=1;
  cx.fillRect(ox - 10, oy - 24, mapW + 20, mapH + 34);
  cx.strokeRect(ox - 10, oy - 24, mapW + 20, mapH + 34);
  cx.fillStyle='#D4AF37';
  cx.font='bold 10px Orbitron, Courier New';
  cx.textAlign='left';
  cx.fillText(`FLOOR ${floorMap.floorIndex}`, ox - 4, oy - 9);

  for (const room of rooms) {
    const visible = room.visited || DIRS.some(d => {
      const id = room.doors[d.key];
      return id !== null && floorMap.roomById.get(id)?.visited;
    });
    if (!visible) continue;
    const x = ox + (room.gridX - minX) * (cell + gap);
    const y = oy + (room.gridY - minY) * (cell + gap);
    const isCurrent = room.id === currentRoomId;
    const col =
      room.type === 'boss' ? '#ff5050' :
      room.type === 'shop' ? '#70ff90' :
      room.type === 'treasure' ? '#ffd040' :
      room.type === 'timeattack' ? '#80d0ff' :
      room.type === 'midboss' ? '#b8d4ff' :
      room.type === 'elite' ? '#ff9c70' :
      room.type === 'start' ? '#b8d4ff' :
      '#D4AF37';
    cx.fillStyle = room.visited ? 'rgba(12,10,4,0.95)' : 'rgba(12,12,12,0.72)';
    cx.strokeStyle = isCurrent ? '#ffffff' : (room.visited ? col : 'rgba(160,140,90,0.45)');
    cx.lineWidth = isCurrent ? 2.5 : 1.2;
    cx.fillRect(x, y, cell, cell);
    cx.strokeRect(x, y, cell, cell);
    cx.fillStyle = room.visited || isCurrent ? col : 'rgba(160,140,90,0.55)';
    cx.font='bold 10px Courier New';
    cx.textAlign='center';
    cx.textBaseline='middle';
    const label =
      room.type === 'boss' ? 'B' :
      room.type === 'shop' ? '$' :
      room.type === 'treasure' ? '?' :
      room.type === 'timeattack' ? 'T' :
      room.type === 'midboss' ? 'M' :
      room.type === 'elite' ? 'E' :
      room.type === 'start' ? 'S' :
      room.cleared ? '✓' : '';
    cx.fillText(label, x + cell / 2, y + cell / 2 + 1);
  }
  cx.restore();
}

function drawDamagePopups() {
  for (const dp of damagePopups) {
    const a = Math.max(0, dp.life / dp.maxLife);
    cx.save();
    cx.globalAlpha = a;
    cx.fillStyle = dp.color;
    cx.shadowColor = dp.color;
    cx.shadowBlur = dp.crit ? 14 : 8;
    cx.font = `bold ${dp.crit ? 22 : 16}px Courier New`;
    cx.textAlign = 'center';
    cx.fillText(dp.value, dp.x, dp.y);
    cx.restore();
  }
}

function drawWaveBanner() {
  if (waveBannerTimer <= 0) return;
  const a = Math.min(1, waveBannerTimer * 2);
  cx.save();
  cx.globalAlpha = Math.min(1, a);
  cx.fillStyle = 'rgba(0,0,0,0.6)';
  cx.fillRect(0, H/2 - 42, W, 84);

  cx.fillStyle = 'rgba(212,175,55,0.3)';

function drawWithUIShake(fn) {
  if (uiShake.timer <= 0) { fn(); return; }
  const mag = uiShake.intensity * clamp(uiShake.timer / 0.2, 0, 1);
  cx.save();
  cx.translate((rnd()-0.5)*mag, (rnd()-0.5)*mag);
  fn();
  cx.restore();
}

function drawScreenFX() {
  if (screenFlash > 0) {
    cx.save();
    cx.globalAlpha = screenFlash;
    cx.fillStyle = screenFlashColor;
    cx.fillRect(0, 0, W, H);
    cx.restore();
  }
  if (chromaAmount > 0) {
    cx.save();
    cx.globalAlpha = Math.min(0.12, chromaAmount * 0.04);
    cx.fillStyle = '#ff3040';
    cx.fillRect(chromaAmount, 0, W, H);
    cx.fillStyle = '#40d8ff';
    cx.fillRect(-chromaAmount, 0, W, H);
    cx.restore();
  }
  if (transition.active) {
    const t = clamp(Math.sin(transition.progress * Math.PI), 0, 1);
    cx.save();
    cx.globalAlpha = 0.92 * t;
    cx.fillStyle = '#100800';
    cx.fillRect(0, 0, W, H);
    cx.restore();
  }
}

function drawHitDirectionIndicator() {
  if (hitDir.timer <= 0) return;
  const alpha = clamp(hitDir.timer / 0.4, 0, 1);
  const px = player?.x || W * 0.5;
  const py = player?.y || H * 0.5;
  const r = 34;
  cx.save();
  cx.translate(px, py);
  cx.rotate(hitDir.angle);
  cx.globalAlpha = alpha * 0.85;
  cx.fillStyle = '#ff5040';
  cx.beginPath();
  cx.moveTo(r + 10, 0);
  cx.lineTo(r - 8, -8);
  cx.lineTo(r - 8, 8);
  cx.closePath();
  cx.fill();
  cx.restore();
}

const gravityWellPool = [];
function releaseGravityWell(gw) { gravityWellPool.push(gw); }
function spawnGravityWell(x, y) {
  const gw = gravityWellPool.pop() || new GravityWell(x, y);
  gravityWells.push(gw.reset(x, y));
  return gw;
}

function drawReward() {
  const rewardTitle = pendingRewardMeta?.title || '보상 선택';
  const rewardSubtitle = pendingRewardMeta?.subtitle || '보상 하나를 골라 인벤토리에 추가하세요.';
  cx.fillStyle='rgba(0,0,0,0.9)';
  cx.fillRect(0,0,W,H);
  cx.fillStyle='#FFD700'; cx.shadowColor='#D4AF37'; cx.shadowBlur=20;
  cx.font='900 24px Orbitron, Courier New';
  cx.textAlign='center';
  cx.fillText(rewardTitle,W/2,132); cx.shadowBlur=0;
  // Gold accent line
  cx.fillStyle='rgba(212,175,55,0.3)';
  cx.fillRect(W/2-120,140,240,1);
  cx.fillStyle='#B8860B';
  cx.font='13px Courier New';
  cx.fillText(rewardSubtitle,W/2,160);
  if(!pendingRewards) return;
  const n=pendingRewards.length;
  const tw=164, tgap=24, totalW=n*(tw+tgap)-tgap;
  const sx=W/2-totalW/2;
  for(let i=0;i<n;i++){
    const td=pendingRewards[i];
    const baseX=sx+i*(tw+tgap), baseY=194, rh=212;
    const hov=M.x>=baseX&&M.x<=baseX+tw&&M.y>=baseY&&M.y<=baseY+rh;
    const scale=hov?1.05:1;
    const rw=tw*scale, hh=rh*scale;
    const rx=baseX-(rw-tw)/2, ry=baseY-(hh-rh)/2;
    const glow=hov?18:6;
    cx.save();
    if (td.rewardKind === 'slotType') {
      // === 슬롯 타입 카드 ===
      // 배경
      cx.fillStyle='rgba(8,4,22,0.97)';
      cx.shadowColor=td.color; cx.shadowBlur=glow*1.6;
      cx.fillRect(rx,ry,rw,hh); cx.shadowBlur=0;
      // 사선 패턴 오버레이
      cx.save();
      cx.beginPath(); cx.rect(rx,ry,rw,hh); cx.clip();
      cx.strokeStyle='rgba(255,255,255,0.03)'; cx.lineWidth=1;
      for(let s=-hh;s<rw+hh;s+=12){
        cx.beginPath(); cx.moveTo(rx+s,ry); cx.lineTo(rx+s+hh,ry+hh); cx.stroke();
      }
      cx.restore();
      // 이중 테두리
      cx.strokeStyle=td.color; cx.lineWidth=hov?3:2;
      cx.strokeRect(rx,ry,rw,hh);
      cx.strokeStyle=td.color; cx.lineWidth=0.5; cx.globalAlpha=0.35;
      cx.strokeRect(rx+4,ry+4,rw-8,hh-8);
      cx.globalAlpha=1;
      // 상단 컬러 헤더 밴드
      const grad = cx.createLinearGradient(rx,ry,rx+rw,ry);
      grad.addColorStop(0,'rgba(0,0,0,0)');
      grad.addColorStop(0.5,td.color+'55');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=grad;
      cx.fillRect(rx,ry,rw,36);
      // "발사 패턴" 레이블
      cx.fillStyle=td.color; cx.font='bold 9px Orbitron, Courier New';
      cx.textAlign='center';
      cx.fillText('◈  발사 패턴  ◈', rx+rw/2, ry+22);
      // 육각형 아이콘 영역
      const hcx=rx+rw/2, hcy=ry+72, hr=30;
      cx.save();
      cx.shadowColor=td.color; cx.shadowBlur=hov?20:10;
      cx.beginPath();
      for(let s=0;s<6;s++){
        const a=Math.PI/180*(60*s-30);
        s===0?cx.moveTo(hcx+hr*Math.cos(a),hcy+hr*Math.sin(a)):cx.lineTo(hcx+hr*Math.cos(a),hcy+hr*Math.sin(a));
      }
      cx.closePath();
      cx.fillStyle=td.color+'22'; cx.fill();
      cx.strokeStyle=td.color; cx.lineWidth=2; cx.stroke();
      cx.shadowBlur=0;
      cx.fillStyle=td.color; cx.font='bold 13px Orbitron, Courier New';
      cx.textAlign='center';
      cx.fillText((td.data?.short||td.id.slice(0,3).toUpperCase()),hcx,hcy+5);
      cx.restore();
      // 이름
      cx.fillStyle='#ffffff'; cx.font='900 14px Orbitron, Courier New';
      cx.textAlign='center';
      cx.shadowColor=td.color; cx.shadowBlur=8;
      cx.fillText(td.name,rx+rw/2,ry+118); cx.shadowBlur=0;
      // 구분선
      cx.strokeStyle=td.color+'66'; cx.lineWidth=1;
      cx.beginPath(); cx.moveTo(rx+20,ry+126); cx.lineTo(rx+rw-20,ry+126); cx.stroke();
      // 설명
      cx.fillStyle='#c0a8e8'; cx.font='10px Courier New';
      // 줄바꿈 처리
      const descWords=td.desc.split(''); let descLine=''; let descY=ry+142;
      for(const ch of descWords){

      // 하단 버튼

    } else {
      // === 일반 특성 카드 ===
      cx.fillStyle='rgba(16,10,0,0.96)';
      cx.shadowColor=td.color; cx.shadowBlur=glow;
      cx.fillRect(rx,ry,rw,hh); cx.shadowBlur=0;

      drawTraitIcon(td.id, rx+rw/2-24, ry+18, 48);

      cx.fillRect(rx+14,ry+hh-44,rw-28,24);

}
