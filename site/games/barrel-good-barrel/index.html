function resize() {

  C.style.height = (H * s) + 'px';

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const SFX = {
  ctx: null,
  master: null,
  musicGain: null,
  musicTick: 0,
  muted: false,
  unlocked: false
};
const noiseBufferCache = new Map();

function ensureAudio() {
  if (SFX.unlocked || !AudioCtx) return;
  SFX.ctx = new AudioCtx();
  SFX.master = SFX.ctx.createGain();
  SFX.musicGain = SFX.ctx.createGain();
  SFX.master.gain.value = 0.18;
  SFX.musicGain.gain.value = 0.09;
  SFX.musicGain.connect(SFX.master);
  SFX.master.connect(SFX.ctx.destination);
  SFX.unlocked = true;
}

function setMute(nextMuted) {
  SFX.muted = nextMuted;
  if (!SFX.master) return;
  SFX.master.gain.cancelScheduledValues(SFX.ctx.currentTime);
  SFX.master.gain.linearRampToValueAtTime(SFX.muted ? 0 : 0.18, SFX.ctx.currentTime + 0.05);
}

function playTone(freq, dur, type='sine', opt={}) {
  if (!SFX.ctx || SFX.muted) return;
  const now = SFX.ctx.currentTime;
  const osc = SFX.ctx.createOscillator();
  const gain = SFX.ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (opt.freqEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(25, opt.freqEnd), now + dur);
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(opt.volume || 0.05, now + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  osc.connect(gain);
  gain.connect((opt.music ? SFX.musicGain : SFX.master));
  osc.start(now);
  osc.stop(now + dur + 0.02);
}

function playNoise(dur, opt={}) {
  if (!SFX.ctx || SFX.muted) return;
  const len = Math.max(1, Math.floor(SFX.ctx.sampleRate * dur));
  const key = `${SFX.ctx.sampleRate}:${len}`;
  let buf = noiseBufferCache.get(key);
  if (!buf) {
    buf = SFX.ctx.createBuffer(1, len, SFX.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    noiseBufferCache.set(key, buf);
  }
  const src = SFX.ctx.createBufferSource();
  const filter = SFX.ctx.createBiquadFilter();
  const gain = SFX.ctx.createGain();
  src.buffer = buf;
  filter.type = opt.filterType || 'bandpass';
  filter.frequency.value = opt.filter || 1200;
  gain.gain.value = opt.volume || 0.05;
  src.connect(filter);
  filter.connect(gain);
  gain.connect(SFX.master);
  src.start();
}

function playSound(kind) {
  if (!SFX.unlocked) return;
  if (kind === 'shoot') {
    playNoise(0.05, { filter: 1800, volume: 0.02 });
    playTone(320, 0.08, 'triangle', { freqEnd: 140, volume: 0.035 });
  } else if (kind === 'enemyHit') {
    playTone(180, 0.06, 'square', { freqEnd: 120, volume: 0.025 });
  } else if (kind === 'kill') {
    playTone(260, 0.14, 'triangle', { freqEnd: 90, volume: 0.04 });
    playNoise(0.08, { filter: 700, volume: 0.02 });
  } else if (kind === 'reload') {
    playTone(220, 0.09, 'square', { freqEnd: 440, volume: 0.03 });
    playTone(330, 0.12, 'triangle', { freqEnd: 180, volume: 0.025 });
  } else if (kind === 'dash') {
    playNoise(0.07, { filterType: 'highpass', filter: 1500, volume: 0.018 });
    playTone(140, 0.1, 'sawtooth', { freqEnd: 60, volume: 0.03 });
  } else if (kind === 'playerHit') {
    playNoise(0.1, { filter: 600, volume: 0.035 });
    playTone(120, 0.12, 'square', { freqEnd: 55, volume: 0.04 });
  } else if (kind === 'purchase') {
    playTone(440, 0.06, 'triangle', { freqEnd: 560, volume: 0.026 });
    playTone(660, 0.08, 'triangle', { freqEnd: 740, volume: 0.024 });
    playNoise(0.05, { filterType: 'highpass', filter: 2200, volume: 0.012 });
  } else if (kind === 'equip') {
    playTone(520, 0.08, 'square', { freqEnd: 700, volume: 0.023 });
    playNoise(0.035, { filterType: 'highpass', filter: 3000, volume: 0.01 });
  } else if (kind === 'unequip') {
    playTone(380, 0.07, 'square', { freqEnd: 260, volume: 0.02 });
  } else if (kind === 'error') {
    playTone(120, 0.12, 'square', { freqEnd: 90, volume: 0.03 });
  } else if (kind === 'menuOpen') {
    playTone(300, 0.09, 'triangle', { freqEnd: 600, volume: 0.018 });
  } else if (kind === 'menuClose') {
    playTone(800, 0.08, 'triangle', { freqEnd: 500, volume: 0.018 });
  } else if (kind === 'reward') {
    playTone(400, 0.06, 'triangle', { volume: 0.02 });
    playTone(500, 0.07, 'triangle', { volume: 0.02 });
    playTone(600, 0.09, 'triangle', { volume: 0.022 });
  } else if (kind === 'ui') {
    playTone(640, 0.05, 'triangle', { freqEnd: 820, volume: 0.02 });
  } else if (kind === 'wave') {
    playTone(260, 0.18, 'sawtooth', { freqEnd: 400, volume: 0.03 });
    playTone(520, 0.2, 'triangle', { freqEnd: 340, volume: 0.026 });
  } else if (kind === 'boss') {
    playTone(110, 0.22, 'sawtooth', { freqEnd: 92, volume: 0.045 });
  }
}

function updateMusic(dt) {
  if (!SFX.ctx || SFX.muted || gameState === 'menu' || gameState === 'dead' || gameState === 'win') return;
  SFX.musicTick -= dt;
  if (SFX.musicTick > 0) return;
  const tense = gameState === 'boss' || currentRoom?.type === 'midboss';
  const base = tense ? 92 : 138;
  playTone(base, 0.28, 'triangle', { freqEnd: base * 0.98, volume: tense ? 0.03 : 0.018, music: true });
  playTone(base * (tense ? 1.5 : 2), 0.18, 'sine', { freqEnd: base * 1.2, volume: tense ? 0.02 : 0.012, music: true });
  SFX.musicTick = tense ? 0.42 : 0.58;
}

function triggerHitStop(duration, scale) {
  hitStopTimer = Math.max(hitStopTimer, duration);
  timeScale = Math.min(timeScale, scale);
}

function screenPulse(color, flash=0.18, aberration=2) {
  screenFlash = Math.max(screenFlash, flash);
  screenFlashColor = color;
  chromaAmount = Math.max(chromaAmount, aberration);
}

function addDamagePopup(x, y, value, color='#ffd040', crit=false) {
  damagePopups.push({
    x, y, value,
    color,
    crit,
    life: crit ? 0.8 : 0.65,
    maxLife: crit ? 0.8 : 0.65,
    vy: crit ? -42 : -30
  });
}

function scaleStat(base, kind, idx=roomIdx, eliteBoost=false) {
  const room = Math.max(0, idx);
  const mul =
    kind === 'hp' ? (1 + room * 0.15) :
    kind === 'speed' ? (1 + room * 0.05) :
    kind === 'wave' ? (1 + room * 0.5) :
    kind === 'projectile' ? (1 + room * 0.08) :
    kind === 'spawn' ? (1 + room * 0.08) :
    1;
  const elite = eliteBoost ? 1.3 : 1;
  return base * mul * elite;
}

function waveDelayForRoom(idx=roomIdx) {
  return Math.max(0.35, 1.1 - idx * 0.08);
}

let WORLD_H = H;
const camera = { x:0, y:0 };
const AIM = { x:0, y:0 };

function updateCamera(snap=false) {
  const focusX = player ? player.x : AREA.x + AREA.w / 2;
  const focusY = player ? player.y : AREA.y + AREA.h / 2;
  const targetX = clamp(focusX - W / 2, 0, Math.max(0, WORLD_W - W));
  const targetY = clamp(focusY - H / 2, 0, Math.max(0, WORLD_H - H));
  if (snap) {
    camera.x = targetX;
    camera.y = targetY;
  } else {
    camera.x += (targetX - camera.x) * 0.18;
    camera.y += (targetY - camera.y) * 0.18;
  }
}

function syncAimFromScreen() {
  AIM.x = M.x + camera.x;
  AIM.y = M.y + camera.y;
}

function updateCanvasMetrics() {
  canvasRect = C.getBoundingClientRect();
  canvasScale = canvasRect.width ? W / canvasRect.width : 1;
}

function applyRoomLayout(id='normal_open') {
  currentLayoutId = ROOM_LAYOUTS[id] ? id : 'normal_open';
  currentLayout = ROOM_LAYOUTS[currentLayoutId];
  AREA = { ...currentLayout.area };
  AREA_R = AREA.x + AREA.w;
  AREA_B = AREA.y + AREA.h;
  WORLD_W = Math.max(W, AREA_R + 70);
  WORLD_H = Math.max(H, AREA_B + 70);
  makeStaticBG();
  updateCamera(true);
  syncAimFromScreen();
}

function roomCoordKey(x, y) {
  return `${x},${y}`;
}

function shuffledDirs() {
  const dirs = [...DIRS];
  for (let i = dirs.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
  }
  return dirs;
}

function roomDistance(room) {
  return Math.abs(room.gridX) + Math.abs(room.gridY);
}

function countRoomDoors(room) {
  let n = 0;
  for (const d of DIRS) if (room.doors[d.key] !== null) n++;
  return n;
}

function isBattleRoomType(type) {
  return ['combat', 'normal', 'elite', 'timeattack', 'midboss'].includes(type);
}

function isRewardRoomType(type) {
  return ['elite', 'treasure', 'midboss', 'timeattack'].includes(type);
}

function rewardChoiceCount(extra=0) {
  if (currentRoom?.type === 'treasure') return 3;
  if (currentRoom?.type === 'elite') return 3;
  if (currentRoom?.type === 'midboss') return 3 + extra;
  if (currentRoom?.type === 'timeattack') return 3;
  if (currentRoom?.type === 'combat' || currentRoom?.type === 'normal') return 3;
  return Math.max(3, extra || 3);
}

function waveRewardChoiceCount() {
  return 3;
}

function entryRewardChoiceCount() {
  return 3;
}

function scheduleGameTimeout(fn, delay) {
  const id = setTimeout(() => {
    scheduledTimers.delete(id);
    fn();
  }, delay);
  scheduledTimers.add(id);
  return id;
}

function clearScheduledTimers() {
  for (const id of scheduledTimers) clearTimeout(id);
  scheduledTimers.clear();
}

function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function dist2(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy;}
function angleDelta(a,b){return Math.abs(((a-b+Math.PI*3)%PI2)-Math.PI);}
function compactUpdate(arr, dt, release) {
  let w = 0;
  for (let i = 0; i < arr.length; i++) {
    const item = arr[i];
    if (item.update(dt)) arr[w++] = item;
    else if (release) release(item);
  }
  arr.length = w;
}
function compactCustom(arr, keep, release) {
  let w = 0;
  for (let i = 0; i < arr.length; i++) {
    const item = arr[i];
    if (keep(item, i)) arr[w++] = item;
    else if (release) release(item);
  }
  arr.length = w;
}
function makeStaticBG() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = WORLD_W;
  bgCanvas.height = WORLD_H;
  const bgx = bgCanvas.getContext('2d');
  const grid = currentLayout?.grid || 65;
  bgx.fillStyle = '#000000';
  bgx.fillRect(0, 0, WORLD_W, WORLD_H);
  bgx.fillStyle = '#080804';
  bgx.fillRect(AREA.x, AREA.y, AREA.w, AREA.h);
  bgx.strokeStyle = 'rgba(180,150,60,0.08)';
  bgx.lineWidth = 1;
  for (let x = AREA.x; x <= AREA_R; x += grid) {
    bgx.beginPath();
    bgx.moveTo(x, AREA.y);
    bgx.lineTo(x, AREA_B);
    bgx.stroke();
  }
  for (let y = AREA.y; y <= AREA_B; y += grid) {
    bgx.beginPath();
    bgx.moveTo(AREA.x, y);
    bgx.lineTo(AREA_R, y);
    bgx.stroke();
  }
  // Gold arena border with double-line luxury feel
  bgx.strokeStyle = '#B8860B';
  bgx.lineWidth = 2;
  bgx.strokeRect(AREA.x, AREA.y, AREA.w, AREA.h);
  bgx.strokeStyle = 'rgba(212,175,55,0.25)';
  bgx.lineWidth = 1;
  bgx.strokeRect(AREA.x-3, AREA.y-3, AREA.w+6, AREA.h+6);
  // Corner accents (Lamborghini angular motif)
  bgx.strokeStyle = '#D4AF37';
  bgx.lineWidth = 2;
  const cLen = 18;
  [[AREA.x,AREA.y,1,1],[AREA_R,AREA.y,-1,1],[AREA.x,AREA_B,1,-1],[AREA_R,AREA_B,-1,-1]].forEach(([cx,cy,dx,dy])=>{
    bgx.beginPath(); bgx.moveTo(cx,cy); bgx.lineTo(cx+cLen*dx,cy); bgx.stroke();
    bgx.beginPath(); bgx.moveTo(cx,cy); bgx.lineTo(cx,cy+cLen*dy); bgx.stroke();
  });
  const cx0 = AREA.x + AREA.w / 2;
  const cy0 = AREA.y + AREA.h / 2;
  const vignetteRadius = Math.max(WORLD_W, WORLD_H) * 0.58;
  const gv = bgx.createRadialGradient(cx0, cy0, 80, cx0, cy0, vignetteRadius);
  gv.addColorStop(0, 'rgba(0,0,0,0)');
  gv.addColorStop(1, 'rgba(0,0,0,0.65)');
  bgx.fillStyle = gv;
  bgx.fillRect(0, 0, WORLD_W, WORLD_H);
}

// === INPUT ===
const K = {};
const M = { x:0, y:0, down:false };
let lastTouchClickTime = 0;
function resetInputState() {
  for (const key in K) K[key] = false;
  M.down = false;
}
function setPointerPos(clientX, clientY) {
  if (!canvasRect || !canvasRect.width || !canvasRect.height) updateCanvasMetrics();
  M.x = clamp((clientX - canvasRect.left) * canvasScale, 0, W);
  M.y = clamp((clientY - canvasRect.top)  * canvasScale, 0, H);
  syncAimFromScreen();
}
function updateDragState() {
  if (!dragTrait) return;
  const dx = M.x - dragTrait.startX;
  const dy = M.y - dragTrait.startY;
  if (dx * dx + dy * dy > 49) dragTrait.moved = true;
}

document.addEventListener('keydown', e => {
  ensureAudio();
  K[e.code] = true;
  if (transition.active && e.code === 'Tab') { e.preventDefault(); return; }
  if (e.code === 'Tab')   { e.preventDefault(); handleTab(); }
  if (e.code === 'Space') { e.preventDefault(); }

  if (e.code === 'KeyM' && !e.repeat) {
    setMute(!SFX.muted);
    playSound(SFX.muted ? 'menuClose' : 'menuOpen');
  }
});
document.addEventListener('keyup',   e => { K[e.code] = false; });
C.addEventListener('mousemove', e => {
  setPointerPos(e.clientX, e.clientY);
  updateDragState();
});
C.addEventListener('mousedown', e => {
  ensureAudio();
  if (e.button!==0) return;
  if (gameState === 'tab' && beginTabDrag(M.x, M.y)) return;
  M.down = true;
});
C.addEventListener('mouseup', e => {
  if (e.button!==0) return;
  if (gameState === 'tab' && dragTrait) {
    finishTabDrag(M.x, M.y);
    tabClickSuppress = true;
  }
  M.down = false;
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) M.down = false;
});
C.addEventListener('touchstart', e => {
  if (!e.touches.length) return;
  e.preventDefault();
  ensureAudio();
  const t = e.touches[0];
  setPointerPos(t.clientX, t.clientY);
  if (gameState === 'tab' && beginTabDrag(M.x, M.y)) return;
  M.down = true;
}, { passive: false });
C.addEventListener('touchmove', e => {
  if (!e.touches.length) return;
  e.preventDefault();
  const t = e.touches[0];
  setPointerPos(t.clientX, t.clientY);
  updateDragState();
}, { passive: false });
C.addEventListener('touchend', e => {
  e.preventDefault();
  lastTouchClickTime = performance.now();
  if (gameState === 'tab' && dragTrait) {
    finishTabDrag(M.x, M.y);
    tabClickSuppress = true;
  }
  M.down = false;
  handleCanvasClick(M.x, M.y);
}, { passive: false });
C.addEventListener('touchcancel', () => {
  M.down = false;
});
C.addEventListener('wheel', e => {
  if (gameState !== 'tab') return;
  e.preventDefault();
  if (transition.active) return;
  const dir = e.deltaY > 0 ? 1 : -1;
  invScroll = clamp(invScroll + dir, 0, maxInvScroll());
}, { passive: false });
window.addEventListener('blur', resetInputState);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) resetInputState();
});

const SLOT_TYPE_BY_ID = Object.fromEntries(SLOT_TYPES.map(type => [type.id, type]));
function slotTypeDef(id) { return SLOT_TYPE_BY_ID[id] || SLOT_TYPES[0]; }
function defaultSlotTypes() {
  return Array(MAX_AMMO).fill(null);
}
function nextSlotTypeId(id, dir=1) {
  const idx = SLOT_TYPES.findIndex(type => type.id === id);
  const safeIdx = idx >= 0 ? idx : 0;
  return SLOT_TYPES[(safeIdx + dir + SLOT_TYPES.length) % SLOT_TYPES.length].id;
}
function muzzlePosForAngle(src, angle, dist=22) {
  return { x: src.x + Math.cos(angle) * dist, y: src.y + Math.sin(angle) * dist };
}
function findNearestEnemy(x, y, range=9999) {
  let best = null;
  let bestD2 = range * range;
  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = e.x - x;
    const dy = e.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) {
      bestD2 = d2;
      best = e;
    }
  }
  if (boss?.alive) {
    const dx = boss.x - x;
    const dy = boss.y - y;
    const d2 = dx * dx + dy * dy;
    if (d2 < bestD2) best = boss;
  }
  return best;
}
function pointLineDistance(px, py, ax, ay, bx, by) {
  const abx = bx - ax;
  const aby = by - ay;
  const apx = px - ax;
  const apy = py - ay;
  const denom = abx * abx + aby * aby || 1;
  const t = clamp((apx * abx + apy * aby) / denom, 0, 1);
  const qx = ax + abx * t;
  const qy = ay + aby * t;
  const dx = px - qx;
  const dy = py - qy;
  return Math.sqrt(dx * dx + dy * dy);
}
function sanitizeTraitsForSlotType(typeId, traits=[]) {
  let blocked = null;
  let out = traits.filter(t => TRAIT_BY_ID[t]);
  if (['beam', 'turret', 'vortex'].includes(typeId) && out.includes('ricochet')) {
    out = out.filter(t => t !== 'ricochet');
    blocked = blocked || '도탄';
  }
  if (['beam', 'turret', 'vortex'].includes(typeId) && out.includes('split')) {
    out = out.filter(t => t !== 'split');
    blocked = blocked || '분열';
  }
  return { traits: out, blocked };
}
function calcSlotTypePreview(typeId, traitIds=[]) {
  if (!typeId) {
    return {
      directTotal: 0,
      bonusText: '타입 필요'
    };
  }
  const type = slotTypeDef(typeId);
  let base = 2;
  let shots = 1;
  if (typeId === 'buckshot') { base = 0.8; shots = 5; }
  else if (typeId === 'barrage') { base = 0.45; shots = 8; }
  else if (typeId === 'heavy_bore') { base = 4; shots = 1; }
  else if (typeId === 'cluster') { base = 2.6; shots = 1; }
  else if (typeId === 'mortar') { base = 3.2; shots = 1; }
  else if (typeId === 'homing') { base = 1.5; shots = 1; }
  else if (typeId === 'beam') { base = 2.2; shots = 1; }
  else if (typeId === 'turret') { base = 0.9; shots = 3; }
  else if (typeId === 'vortex') { base = 2.6; shots = 1; }
  traitIds = traitIds.filter(t => TRAIT_BY_ID[t]);
  if (traitIds.includes('overload')) base *= 1.5;
  const critMul = 1;
  const twinBonus = traitIds.includes('twin') ? 2 : 1;
  const directTotal = base * shots * critMul * twinBonus;
  const bonusTags = [type.short];
  return {
    directTotal,
    bonusText: bonusTags.join(' / ')
  };
}

function applyBeamBurstDamage(beam) {

    if (!e.alive) continue;
    if (pointLineDistance(e.x, e.y, beam.x1, beam.y1, beam.x2, beam.y2) <= e.r + 8) {
      e.hit(beam.damage, beam.traits, e.x, e.y);
      applyHitTraitEffects(beam.traits, e.x, e.y, e);

  if (boss?.alive && pointLineDistance(boss.x, boss.y, beam.x1, beam.y1, beam.x2, beam.y2) <= boss.r + 12) {

function makeTraitRewardItem(trait) {
  return { rewardKind:'trait', data:trait, id:trait.id, name:trait.name, desc:trait.desc, color:trait.color };
}
function makeSlotTypeRewardItem(slotType) {
  return { rewardKind:'slotType', data:slotType, id:slotType.id, name:slotType.name, desc:slotType.desc, color:slotType.color };
}
function grantRewardItem(item) {
  if (!item) return;
  if (item.rewardKind === 'slotType') slotTypeInventory.push(item.data);
  else inventory.push(item.data);
}
function ownedSlotTypeIds() {
  const ids = new Set(slotTypeInventory.map(t => t.id));
  if (player?.slotTypes) for (const id of player.slotTypes) if (id) ids.add(id);
  return ids;
}
function rollMixedRewardChoices(n, forceSlotType=false) {
  const traitPool = [...TRAITS];
  const slotPool = [...SLOT_TYPES].filter(type => !ownedSlotTypeIds().has(type.id));
  const choices = [];
  if (forceSlotType && slotPool.length) {
    const j = Math.floor(rnd() * slotPool.length);
    choices.push(makeSlotTypeRewardItem(slotPool.splice(j, 1)[0]));
  }
  while (choices.length < n && (traitPool.length || slotPool.length)) {
    const useSlot = slotPool.length && (forceSlotType ? rnd() < 0.5 : rnd() < 0.28);
    if (useSlot) {
      const j = Math.floor(rnd() * slotPool.length);
      choices.push(makeSlotTypeRewardItem(slotPool.splice(j, 1)[0]));
    } else if (traitPool.length) {
      const j = Math.floor(rnd() * traitPool.length);
      choices.push(makeTraitRewardItem(traitPool.splice(j, 1)[0]));
    } else if (slotPool.length) {
      const j = Math.floor(rnd() * slotPool.length);
      choices.push(makeSlotTypeRewardItem(slotPool.splice(j, 1)[0]));
    }
  }
  return choices;
}

class Particle {
  constructor(x, y, vx, vy, life, color, size=3) {
    this.reset(x, y, vx, vy, life, color, size);
  }
  reset(x, y, vx, vy, life, color, size=3) {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.color = color; this.size = size;
    return this;
  }
  update(dt) {
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.vx *= 0.93;      this.vy *= 0.93;
    this.life -= dt;
    return this.life > 0;
  }
  draw() {
    const a = Math.max(0, this.life/this.maxLife);
    cx.globalAlpha = a;
    cx.fillStyle = this.color;
    cx.shadowColor = this.color; cx.shadowBlur = 6;
    cx.beginPath();
    cx.arc(this.x, this.y, this.size*a, 0, Math.PI*2);
    cx.fill();
  }
}

const particlePool = [];
function releaseParticle(p) { particlePool.push(p); }
function spawnParticle(x, y, vx, vy, life, color, size=3) {
  const p = particlePool.pop() || new Particle(x, y, vx, vy, life, color, size);
  particles.push(p.reset(x, y, vx, vy, life, color, size));
  return p;
}

// === SHELL CASINGS ===
class ShellCasing {
  constructor(x, y, opt={}) {
    this.reset(x, y, opt);
  }
  reset(x, y, opt={}) {
    this.x = x;
    this.y = y;
    this.depth = opt.depth ?? rnd();
    this.scale = opt.scale ?? (0.85 + rnd() * 0.95 + this.depth * 0.3);
    this.vx = opt.vx ?? ((rnd() - 0.5) * (110 + this.depth * 180));
    this.vy = opt.vy ?? -(210 + rnd() * 170 + this.depth * 70);
    this.gravity = opt.gravity ?? (500 + rnd() * 170 + this.depth * 80);
    this.rotation = rnd() * PI2;
    this.rotSpd = opt.rotSpd ?? ((rnd() - 0.5) * (14 + this.depth * 18));
    this.dragX = 0.985 - this.depth * 0.012;
    this.spinDrag = 0.972 - this.depth * 0.012;
    this.life = opt.life ?? (1.15 + rnd() * 0.45);
    this.maxLife = this.life;
    this.w = (4 + rnd() * 2.4) * this.scale;
    this.h = (8 + rnd() * 4.2) * this.scale;
    this.glint = 0.25 + rnd() * 0.4;
    this.ceilingY = opt.ceilingY ?? (AREA.y + AREA.h * (0.73 + rnd() * 0.12));
    return this;
  }
  update(dt) {
    if (this.y < this.ceilingY) this.vy += this.gravity * 0.7 * dt;
    this.vy += this.gravity * dt;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rotation += this.rotSpd * dt;
    this.vx *= this.dragX;
    this.rotSpd *= this.spinDrag;
    this.life -= dt;
    return this.life > 0;
  }
  draw() {
    let a = Math.max(0, this.life / this.maxLife);
    if (this.y < AREA.y + AREA.h * 0.6) a *= 0.4;
    cx.save();
    cx.globalAlpha = Math.min((0.32 + this.depth * 0.38) * a * 1.7, 0.82);
    cx.translate(this.x, this.y);
    cx.rotate(this.rotation);
    cx.shadowColor = 'rgba(212,175,55,0.3)';
    cx.shadowBlur = 4 + this.depth * 5;
    cx.fillStyle = '#D4AF37';
    cx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
    cx.fillStyle = '#B8860B';
    cx.fillRect(-this.w / 2, this.h / 2 - Math.max(1.5, this.scale * 1.5), this.w, Math.max(1.5, this.scale * 1.5));
    cx.fillStyle = '#e8c870';
    cx.fillRect(-this.w / 2, -this.h / 2, this.w, Math.max(1.5, this.scale * 1.4));
    cx.fillStyle = `rgba(255,240,180,${this.glint})`;
    cx.fillRect(-this.w / 2 + this.scale * 0.7, -this.h / 2 + this.scale * 1.2, Math.max(1.3, this.scale * 1.1), this.h - this.scale * 2.8);
    cx.restore();
  }
}

class Bullet {
  constructor(x, y, vx, vy, fromPlayer, traits=[], opt={}) {
    this.reset(x, y, vx, vy, fromPlayer, traits, opt);
  }
  reset(x, y, vx, vy, fromPlayer, traits=[], opt={}) {
    this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.fromPlayer=fromPlayer; this.traits=traits;
    this.alive=true;
    this.slotType = opt.slotType || 'standard';
    this.bounces = traits.includes('ricochet') ? 1 : 0;
    this.remainingHits = opt.remainingHits ?? (traits.includes('pierce') ? 99 : 1);
    this.chainDone = false;
    this.hasExplosive = traits.includes('explosive');
    this.hasGravity = traits.includes('gravity');
    this.hasChain = traits.includes('chain');
    this.hasSplit = traits.includes('split');
    this.chainTraits = this.hasChain ? traits.filter(t => t !== 'chain') : traits;
    this.splitTraits = this.hasSplit ? traits.filter(t => t !== 'split') : traits;
    this.damage = 2 * (opt.damageMul || 1);
    this.critChance = traits.includes('sight') ? 0.3 : 0;
    this.radius = opt.radius || (fromPlayer ? 5 : 6);
    this.trailColor = opt.trailColor || (fromPlayer ? '#ffe080' : '#ff5050');
    this.fillColor = opt.fillColor || (fromPlayer ? '#fff8c0' : '#ff9090');
    this.shadowColor = opt.shadowColor || (fromPlayer ? '#ffe080' : '#ff6060');
    this.ttl = opt.ttl ?? Infinity;
    this.turnRate = opt.turnRate || 0;
    this.homing = opt.homing || 0;
    this.homingRange = opt.homingRange || 220;
    this.splitAfter = opt.splitAfter || 0;
    this.splitCount = opt.splitCount || 0;
    this.splitSpread = opt.splitSpread || 0.9;
    this.fragmentDamageMul = opt.fragmentDamageMul || 0.4;
    this.fragmentOpt = opt.fragmentOpt || null;
    this.explodeRadius = opt.explodeRadius || 0;
    this.spawnGravityOnExpire = !!opt.spawnGravityOnExpire;
    this.spawnVortexOnExpire = !!opt.spawnVortexOnExpire;
    this.piercing = this.remainingHits > 1;
    return this;
  }
  update(dt) {
    this.ttl -= dt;
    if (this.ttl <= 0) {
      if (this.splitAfter > 0 && this.splitCount > 0) {
        splitProjectile(this);
      }
      if (this.explodeRadius > 0) {
        explodeProjectile(this, this.explodeRadius, this.damage * 0.7);
      }
      if (this.spawnGravityOnExpire) spawnGravityWell(this.x, this.y);
      if (this.spawnVortexOnExpire) {
        spawnVortexField(this.x, this.y, this.traits);
        for (let i=0;i<12;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*80,Math.sin(a)*80,0.5,'#b890ff',3);}
      }
      this.alive = false;
      return false;
    }
    if (this.homing > 0) {
      const target = findNearestEnemy(this.x, this.y, this.homingRange);
      if (target) {
        const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy) || 1;
        const ta = Math.atan2(target.y - this.y, target.x - this.x);
        const ca = Math.atan2(this.vy, this.vx);
        const da = clamp(((ta - ca + Math.PI * 3) % PI2) - Math.PI, -this.homing * dt, this.homing * dt);
        const na = ca + da;
        this.vx = Math.cos(na) * speed;
        this.vy = Math.sin(na) * speed;
      }
    }
    if (this.turnRate) {
      const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy) || 1;
      const a = Math.atan2(this.vy, this.vx) + this.turnRate * dt;
      this.vx = Math.cos(a) * speed;
      this.vy = Math.sin(a) * speed;
    }
    this.x += this.vx*dt; this.y += this.vy*dt;
    if (this.x < AREA.x || this.x > AREA.x+AREA.w ||
        this.y < AREA.y || this.y > AREA.y+AREA.h) {
      for(let i=0;i<10;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*120,Math.sin(a)*120,0.35,'#80ff40',3);}
      shakeDur=0.06; shakeIntensity=3;
      this.alive = false;
      return false;
    }
    if (Math.random() < 0.4) {
      spawnParticle(this.x, this.y, (rnd()-0.5)*30, (rnd()-0.5)*30, 0.18, this.trailColor, 2);
    }
    return this.alive;
  }
  draw() {
    cx.shadowColor = this.shadowColor;
    cx.shadowBlur  = 14;
    cx.fillStyle   = this.fillColor;
    cx.beginPath();
    cx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
    cx.fill();
  }
}

const bulletPool = [];
function releaseBullet(b) { bulletPool.push(b); }
function spawnBullet(x, y, vx, vy, fromPlayer, traits=[], opt={}) {
  const b = bulletPool.pop() || new Bullet(x, y, vx, vy, fromPlayer, traits, opt);
  bullets.push(b.reset(x, y, vx, vy, fromPlayer, traits, opt));
  return b;
}

function splitProjectile(bullet) {
  const speed = Math.sqrt(bullet.vx * bullet.vx + bullet.vy * bullet.vy) || BULLET_SPD * 0.8;
  const ang = Math.atan2(bullet.vy, bullet.vx);
  const count = bullet.splitCount || 4;
  for (let i = 0; i < count; i++) {
    const t = count <= 1 ? 0.5 : i / (count - 1);
    const a = ang - bullet.splitSpread * 0.5 + bullet.splitSpread * t;
    spawnBullet(
      bullet.x,
      bullet.y,
      Math.cos(a) * speed,
      Math.sin(a) * speed,
      bullet.fromPlayer,
      bullet.traits,
      {
        ...bullet.fragmentOpt,
        slotType: bullet.slotType,
        damageMul: (bullet.damage / 2) * bullet.fragmentDamageMul
      }
    );
  }
  for (let i = 0; i < 12; i++) {
    const a = rnd() * PI2;
    spawnParticle(bullet.x, bullet.y, Math.cos(a) * (90 + rnd() * 110), Math.sin(a) * (90 + rnd() * 110), 0.45, '#ff9cd8', 3);
  }
}

function explodeProjectile(bullet, radius, damage) {
  for (const e of enemies) {
    if (!e.alive || dist2(bullet, e) > radius * radius) continue;
    e.hit(damage, bullet.traits, bullet.x, bullet.y);
  }
  if (boss?.alive && dist2(bullet, boss) <= (radius + boss.r) * (radius + boss.r)) {
    boss.hit(damage, bullet.traits);
  }
  const pScale = Math.min(radius / 88, 2.2);
  const pCount = Math.floor(16 + pScale * 12);
  for (let i = 0; i < pCount; i++) {
    const a = rnd() * PI2;
    const spd = (100 + rnd() * 180) * pScale;
    spawnParticle(bullet.x, bullet.y, Math.cos(a)*spd, Math.sin(a)*spd, 0.55 + pScale*0.1, '#ff9a60', 4);
  }
  for (let i = 0; i < 8; i++) {
    const a = rnd() * PI2;
    spawnParticle(bullet.x, bullet.y, Math.cos(a)*(40+rnd()*60)*pScale, Math.sin(a)*(40+rnd()*60)*pScale, 0.8, '#fff0b0', 3);
  }
}

class GravityWell {
  constructor(x, y) {
    this.reset(x, y);
  }
  reset(x, y) {
    this.x=x; this.y=y; this.timer=2.5; this.r=90; this.force=260;
    this.angle=0;
    return this;
  }
  update(dt) {
    this.timer -= dt;
    this.angle += dt * 4;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx=this.x-e.x, dy=this.y-e.y, d=Math.sqrt(dx*dx+dy*dy)||1;
      if (d < this.r) {
        const str = this.force * (1 - d/this.r) * dt;
        e.x += (dx/d)*str; e.y += (dy/d)*str;
      }
    }
    if (rnd() < 0.7) {
      const a=rnd()*PI2, r=20+rnd()*65;
      const px=this.x+Math.cos(a)*r, py=this.y+Math.sin(a)*r;
      spawnParticle(px,py,(this.x-px)*2.5,(this.y-py)*2.5,0.35,'#8040ff',2);
    }
    return this.timer > 0;
  }
  draw() {
    const pulse=Math.sin(frameNow*0.009)*0.25+0.75;
    cx.save(); cx.globalAlpha=0.12*pulse;
    cx.fillStyle='#8040ff'; cx.shadowColor='#8040ff'; cx.shadowBlur=28;
    cx.beginPath(); cx.arc(this.x,this.y,this.r,0,PI2); cx.fill();
    cx.restore();
    cx.save(); cx.globalAlpha=0.55*pulse;
    cx.strokeStyle='#8040ff'; cx.lineWidth=1.5;
    cx.shadowColor='#8040ff'; cx.shadowBlur=10;
    cx.beginPath(); cx.arc(this.x,this.y,this.r,0,PI2); cx.stroke();
    cx.restore();

    cx.fillStyle='#1a0030'; cx.shadowColor='#8040ff'; cx.shadowBlur=16;
    cx.beginPath(); cx.arc(this.x,this.y,9,0,PI2); cx.fill();
    cx.restore();
  }
}

class RoomHazard {
  constructor(type, x, y, opt={}) {
    this.type = type;
    this.x = x;
    this.y = y;
    this.w = opt.w || 0;
    this.h = opt.h || 0;
    this.r = opt.r || 0;
    this.vx = opt.vx || 0;
    this.vy = opt.vy || 0;
    this.timer = 0;
    this.damageTick = 0;
    this.moveA = rnd() * PI2;
    this.dir = opt.dir || 1;
  }
  update(dt) {
    this.timer += dt;
    if (this.type === 'fog') {
      this.moveA += dt * 0.6 * this.dir;
      this.x += Math.cos(this.moveA) * 18 * dt;
      this.y += Math.sin(this.moveA * 1.3) * 12 * dt;
      this.x = clamp(this.x, AREA.x + this.r, AREA.x + AREA.w - this.r);
      this.y = clamp(this.y, AREA.y + this.r, AREA.y + AREA.h - this.r);
    }
  }
  contains(px, py) {
    if (this.type === 'acid' || this.type === 'fog' || this.type === 'pillar') {
      const dx = px - this.x;
      const dy = py - this.y;
      return dx * dx + dy * dy <= this.r * this.r;
    }
    return px >= this.x && px <= this.x + this.w && py >= this.y && py <= this.y + this.h;
  }
  draw() {
    cx.save();
    if (this.type === 'acid') {
      const pulse = Math.sin(this.timer * 3.2) * 0.16 + 0.8;
      cx.globalAlpha = 0.42;
      cx.fillStyle = '#49c224';
      cx.shadowColor = '#95ff5c';
      cx.shadowBlur = 28 * pulse;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, PI2);
      cx.fill();
      cx.globalAlpha = 0.8;
      cx.strokeStyle = '#b8ff72';
      cx.lineWidth = 2;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r - 4, 0, PI2);
      cx.stroke();
    } else if (this.type === 'fog') {
      const pulse = Math.sin(this.timer * 2 + this.moveA) * 0.18 + 0.72;
      cx.globalAlpha = 0.25;
      cx.fillStyle = '#6b6f84';
      cx.shadowColor = '#d8def6';
      cx.shadowBlur = 18;
      for (let i = 0; i < 4; i++) {
        const a = this.moveA + i * 1.57;
        cx.beginPath();
        cx.arc(this.x + Math.cos(a) * 18, this.y + Math.sin(a) * 12, this.r * pulse * (0.75 + i * 0.08), 0, PI2);
        cx.fill();
      }
    } else if (this.type === 'conveyor') {
      cx.fillStyle = 'rgba(60,100,135,0.26)';
      cx.fillRect(this.x, this.y, this.w, this.h);
      cx.strokeStyle = '#8cd8ff';
      cx.lineWidth = 2;
      cx.strokeRect(this.x, this.y, this.w, this.h);
      const step = 32;
      for (let i = 0; i < (this.w > this.h ? this.w : this.h); i += step) {
        cx.beginPath();
        if (this.w > this.h) {
          const px = this.x + i + 10;
          const py = this.y + this.h / 2;
          cx.moveTo(px - 9 * this.dir, py - 8);
          cx.lineTo(px + 9 * this.dir, py);
          cx.lineTo(px - 9 * this.dir, py + 8);
        } else {
          const px = this.x + this.w / 2;
          const py = this.y + i + 10;
          cx.moveTo(px - 8, py - 9 * this.dir);
          cx.lineTo(px, py + 9 * this.dir);
          cx.lineTo(px + 8, py - 9 * this.dir);
        }
        cx.stroke();
      }
    } else if (this.type === 'pillar') {
      cx.fillStyle = '#2a2628';
      cx.shadowColor = '#000';
      cx.shadowBlur = 10;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r, 0, PI2);
      cx.fill();
      cx.fillStyle = '#4b4548';
      cx.beginPath();
      cx.arc(this.x, this.y, this.r - 7, 0, PI2);
      cx.fill();
      cx.strokeStyle = '#837879';
      cx.lineWidth = 2;
      cx.beginPath();
      cx.arc(this.x, this.y, this.r - 4, 0, PI2);
      cx.stroke();
    }
    cx.restore();
  }
}

function createHazard(type) {
  if (type === 'pillar_cross') {
    const cx0 = AREA.x + AREA.w * 0.5;
    const cy0 = AREA.y + AREA.h * 0.5;
    return [
      new RoomHazard('pillar', cx0, cy0, { r: 32 }),
      new RoomHazard('pillar', cx0 - AREA.w * 0.22, cy0, { r: 24 }),
      new RoomHazard('pillar', cx0 + AREA.w * 0.22, cy0, { r: 24 }),
      new RoomHazard('pillar', cx0, cy0 - AREA.h * 0.24, { r: 24 }),
      new RoomHazard('pillar', cx0, cy0 + AREA.h * 0.24, { r: 24 })
    ];
  }
  if (type === 'split_lane') {
    const cx0 = AREA.x + AREA.w * 0.5;
    return [
      new RoomHazard('pillar', cx0, AREA.y + AREA.h * 0.32, { r: 30 }),
      new RoomHazard('pillar', cx0, AREA.y + AREA.h * 0.68, { r: 30 }),
      new RoomHazard('conveyor', AREA.x + AREA.w * 0.22, AREA.y + AREA.h * 0.48, { w: AREA.w * 0.22, h: 30, dir: 1 }),
      new RoomHazard('conveyor', AREA.x + AREA.w * 0.56, AREA.y + AREA.h * 0.48, { w: AREA.w * 0.22, h: 30, dir: -1 })
    ];
  }
  if (type === 'acid') {
    return new RoomHazard(type, AREA.x + 90 + rnd() * Math.max(80, AREA.w - 180), AREA.y + 90 + rnd() * Math.max(80, AREA.h - 180), {
      r: 44 + rnd() * 26
    });
  }
  if (type === 'fog') {
    return new RoomHazard(type, AREA.x + 90 + rnd() * Math.max(80, AREA.w - 180), AREA.y + 80 + rnd() * Math.max(80, AREA.h - 160), {
      r: 36 + rnd() * 14,
      dir: rnd() < 0.5 ? -1 : 1
    });
  }
  if (type === 'conveyor') {
    const horizontal = rnd() < 0.5;
    return new RoomHazard(type, AREA.x + 70 + rnd() * Math.max(80, AREA.w - 240), AREA.y + 70 + rnd() * Math.max(80, AREA.h - 140), horizontal ? {
      w: Math.min(230, 140 + rnd() * 90),
      h: 32,
      dir: rnd() < 0.5 ? -1 : 1
    } : {
      w: 32,
      h: Math.min(230, 140 + rnd() * 90),
      dir: rnd() < 0.5 ? -1 : 1
    });
  }
  return new RoomHazard(type, AREA.x + 110 + rnd() * Math.max(80, AREA.w - 220), AREA.y + 90 + rnd() * Math.max(80, AREA.h - 180), {
    r: 28 + rnd() * 20
  });
}

function spawnRoomHazards(type) {
  roomHazards = [];
  if (!isBattleRoomType(type)) return;
  const pool = [...(currentLayout?.hazards || [])];
  const extraPool = ['acid', 'fog', 'conveyor', 'pillar'];
  for (const structural of ['pillar_cross', 'split_lane']) {
    const idx = pool.indexOf(structural);
    if (idx < 0) continue;
    pool.splice(idx, 1);
    const made = createHazard(structural);
    if (Array.isArray(made)) roomHazards.push(...made);
    else roomHazards.push(made);
  }
  const hazardCount = currentLayoutId === 'normal_open' ? Math.floor(rnd() * 2) : Math.floor(rnd() * 2);
  for (let i = 0; i < hazardCount; i++) {
    const source = pool.length ? pool : extraPool;
    const pick = source.splice(Math.floor(rnd() * source.length), 1)[0];
    const made = createHazard(pick);
    if (Array.isArray(made)) roomHazards.push(...made);
    else roomHazards.push(made);
  }
}

class VortexField {
  constructor(x, y, traits=[]) {
    this.reset(x, y, traits);
  }
  reset(x, y, traits=[]) {
    this.x = x;
    this.y = y;
    this.r = 96;
    this.life = 3;
    this.tick = 0.3;
    this.traits = traits.slice();
    this.angle = 0;
    return this;
  }
  update(dt) {
    this.life -= dt;
    this.tick -= dt;
    this.angle += dt * 3;
    for (const e of enemies) {
      if (!e.alive) continue;
      const dx = this.x - e.x;
      const dy = this.y - e.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < this.r) {
        const pull = 220 * (1 - d / this.r) * dt;
        e.x += dx / d * pull;
        e.y += dy / d * pull;
      }
    }
    if (boss?.alive) {
      const dx = this.x - boss.x;
      const dy = this.y - boss.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < this.r) {
        const pull = 110 * (1 - d / this.r) * dt;
        boss.x += dx / d * pull;
        boss.y += dy / d * pull;
      }
    }
    if (this.tick <= 0) {
      this.tick = 0.5;
      for (const e of enemies) if (e.alive && dist2(this, e) < this.r * this.r) {
        e.hit(0.8, this.traits, this.x, this.y);
        applyHitTraitEffects(this.traits, e.x, e.y, e);
      }
      if (boss?.alive && dist2(this, boss) < (this.r + boss.r) * (this.r + boss.r)) {
        boss.hit(0.8, this.traits);
        applyHitTraitEffects(this.traits, boss.x, boss.y, null);
      }
    }
    return this.life > 0;
  }
  draw() {
    cx.save();
    cx.translate(this.x, this.y);
    cx.rotate(this.angle);
    cx.globalAlpha = 0.18;
    cx.fillStyle = '#9a70ff';
    cx.shadowColor = '#9a70ff';
    cx.shadowBlur = 24;
    cx.beginPath();
    cx.arc(0, 0, this.r, 0, PI2);
    cx.fill();
    cx.restore();
    cx.save();
    cx.translate(this.x, this.y);
    cx.rotate(-this.angle * 1.2);
    cx.strokeStyle = '#d0b0ff';
    cx.lineWidth = 2;
    cx.globalAlpha = 0.7;
    cx.beginPath();
    for (let i = 0; i < 3; i++) {
      cx.arc(0, 0, 20 + i * 22, i * 0.8, i * 0.8 + Math.PI * 1.2);
    }
    cx.stroke();
    cx.restore();
  }
}
const vortexPool = [];
function releaseVortex(v) { vortexPool.push(v); }
function spawnVortexField(x, y, traits=[]) {
  const vortex = vortexPool.pop() || new VortexField(x, y, traits);
  vortexes.push(vortex.reset(x, y, traits));
  return vortex;
}

function applyHitTraitEffects(traits, hitX, hitY, excludeEnemy=null) {
  if (traits.includes('explosive')) {
    for (const e2 of enemies) if (e2 !== excludeEnemy && e2.alive && dist2({x:hitX,y:hitY}, e2) < 60*60) e2.hit(0.6, [], hitX, hitY);
    if (boss?.alive && dist2({x:hitX,y:hitY}, boss) < (60+boss.r)*(60+boss.r)) boss.hit(0.6, []);
    for (let i=0;i<14;i++){const a=rnd()*PI2; spawnParticle(hitX,hitY,Math.cos(a)*160,Math.sin(a)*160,0.55,'#ff8040',4);}
  }
  if (traits.includes('gravity')) {
    spawnGravityWell(hitX, hitY);
  }
  if (traits.includes('chain') && excludeEnemy) {
    const chainTraits = traits.filter(t => t !== 'chain');
    let near=null, nd=1e9;
    for (const e2 of enemies) if (e2 !== excludeEnemy && e2.alive) { const d=dist2({x:hitX,y:hitY},e2); if(d<nd){nd=d;near=e2;} }
    if (near) { const d=Math.sqrt(nd); spawnBullet(hitX,hitY,(near.x-hitX)/d*BULLET_SPD*0.8,(near.y-hitY)/d*BULLET_SPD*0.8,true,chainTraits); }
  }
}

function fireBeamWeapon(src, angle, traits, damageMul=1.1) {
  const start = muzzlePosForAngle(src, angle, 18);
  const range = 420;
  const endX = start.x + Math.cos(angle) * range;
  const endY = start.y + Math.sin(angle) * range;
  const beamDamagePerTick = (2 * damageMul) / Math.max(1, Math.round(BEAM_DURATION / BEAM_TICK));
  spawnBeamBurst(start.x, start.y, endX, endY, '#80e8ff', 11, traits, beamDamagePerTick);
  for (let i = 0; i < 10; i++) {
    const t = i / 9;
    const px = start.x + (endX - start.x) * t;
    const py = start.y + (endY - start.y) * t;
    spawnParticle(px, py, (rnd() - 0.5) * 40, (rnd() - 0.5) * 40, 0.18, '#80e8ff', 2);
  }
}

function spawnPlayerProjectile(src, angle, speedMul, traits, opt={}) {
  const pos = muzzlePosForAngle(src, angle, opt.muzzle || 22);

}

        spawnPlayerProjectile(player, angle + spread, 0.82, traits, {

          damageMul: 0.4,

        fillColor: '#fff0fa',
        shadowColor: '#ff9cd8'
      });
    });
    return { fired:true, cooldown:0.72, sound:'shoot' };
  }
  if (slotTypeId === 'sabot') {
    fireOnce(angle => {
      spawnPlayerProjectile(player, angle, 1.5, traits, {
        slotType: slotTypeId,
        damageMul: 1.2,

        radius: 4,
        trailColor: '#c0f0ff',
        fillColor: '#ffffff',
        shadowColor: '#80d8ff'
      });
    });
    return { fired:true, cooldown:0.54, sound:'shoot' };
  }
  if (slotTypeId === 'mortar') {
    fireOnce(angle => {
      spawnPlayerProjectile(player, angle, 0.5, traits, {

        damageMul: 1.5,
        radius: 7,

        trailColor: '#ff9a60',
        fillColor: '#ffe0c0',
        shadowColor: '#ff9a60'
      });
    });
    return { fired:true, cooldown:0.88, sound:'shoot' };
  }
  if (slotTypeId === 'spiral') {
    const baseAngleSp = player.facingAngle;
    const count = 5;
    for (let i = 0; i < count; i++) {
      const offsetAngle = (PI2 / count) * i;
      // 각 탄환의 초기 발사 방향: 조준 방향에서 72° 간격으로 배치

  if (slotTypeId === 'vortex') {
    const pos = muzzlePosForAngle(player, baseAngle, 72);
    spawnVortexField(pos.x, pos.y, traits);
    return { fired:true, cooldown:0.98, sound:'reward' };
  }

  fireOnce(angle => {
    spawnPlayerProjectile(player, angle, 1, traits, { slotType:slotTypeId });
  });
  return { fired:true, cooldown:FIRE_DELAY, sound:'shoot' };
}

function resolveSolidCircle(entity, hz) {
  const dx = entity.x - hz.x;
  const dy = entity.y - hz.y;
  const d = Math.sqrt(dx * dx + dy * dy) || 1;
  const minD = entity.r + hz.r;
  if (d >= minD) return false;
  entity.x = hz.x + (dx / d) * minD;
  entity.y = hz.y + (dy / d) * minD;
  return true;
}

function resolveSolidRect(entity, hz) {
  const nearestX = clamp(entity.x, hz.x, hz.x + hz.w);
  const nearestY = clamp(entity.y, hz.y, hz.y + hz.h);
  const dx = entity.x - nearestX;
  const dy = entity.y - nearestY;
  if (dx * dx + dy * dy > entity.r * entity.r) return false;
  if (Math.abs(dx) > Math.abs(dy)) entity.x = nearestX + Math.sign(dx || 1) * entity.r;
  else entity.y = nearestY + Math.sign(dy || 1) * entity.r;
  return true;
}

function lineCircleIntersects(ax, ay, bx, by, cx0, cy0, r) {
  const abx = bx - ax;
  const aby = by - ay;
  const ab2 = abx * abx + aby * aby;
  if (ab2 <= 0.0001) {
    const dx = ax - cx0;
    const dy = ay - cy0;
    return dx * dx + dy * dy <= r * r;
  }
  const t = clamp(((cx0 - ax) * abx + (cy0 - ay) * aby) / ab2, 0, 1);
  const px = ax + abx * t;
  const py = ay + aby * t;
  const dx = px - cx0;
  const dy = py - cy0;
  return dx * dx + dy * dy <= r * r;
}

function hasLineOfSight(ax, ay, bx, by) {
  for (const hz of roomHazards) {
    if (hz.type !== 'pillar') continue;
    if (lineCircleIntersects(ax, ay, bx, by, hz.x, hz.y, hz.r + 6)) return false;
  }
  return true;
}

// === ENEMIES ===
const ENEMY_SPAWN_DELAY = 1.0;
const MELEE_ATTACK_LIMIT = 2;
const MELEE_TYPES = new Set(['slasher', 'armor', 'bomber']);
const ENEMY_SPAWN_RADIUS = {
  sniper: 14,
  slasher: 16,
  armor: 22,
  doll: 12,
  bomber: 10,
  slime: 18,
  slimelet: 8
};

function spawnEnemy(x, y, type, spawnDelay = 0) {
  const enemy = new Enemy(x, y, type);
  if (spawnDelay > 0) enemy.setSpawnDelay(spawnDelay);
  return enemy;
}

function armRoomEnemy(enemy) {
  enemy.roomAggro = true;
  enemy.awareTimer = 2.2 + rnd() * 0.8;
  enemy.suspicionReady = true;
  return enemy;
}

class Enemy {
  constructor(x, y, type) {
    this.x=x; this.y=y; this.type=type;
    this.vx=0; this.vy=0; this.alive=true;
    this.stateTimer=0; this.slowTimer=0; this.flashTimer=0;
    this.venomStacks=0; this.venomTimer=0; this.corrosionTimer=0;
    this.igniteTimer=0; this.igniteTick=0;
    this.freezeTimer=0;
    this.spawnDelay=0; this.spawnBlinkOffset=rnd()*PI2;
    this.terrorTimer=0; this.terrorAngle=0;
    this.marked=false; this.markTimer=0;
    this.homeX=x; this.homeY=y;
    this.roomAggro = false;
    this.lastHitTraits = [];
    this.deathContext = null;
    switch(type) {
      case 'sniper':
        this.hp=this.maxHp=3; this.speed=130; this.r=14; this.color='#a0c8e8';
        this.shootCD=0; this.shootInt=2.5;
        this.preferDist = 185 + rnd() * 55;
        this.strafeDir = rnd() < 0.5 ? -1 : 1;
        this.strafeTimer = 0.65 + rnd() * 0.95;
        this.evadeCD = 1.25 + rnd() * 0.8;
        this.evadeBoost = 0;
        this.evadeBoostTimer = 0;
        this.aimTimer = 0;
        break;
      case 'slasher':
        this.hp=this.maxHp=5; this.speed=95; this.r=16; this.color='#c0a0d8';
        this.atkCD=0; this.atkInt=1.8; this.telegraph=false; this.telegTimer=0;
        this.slashTimer=0; this.slashDur=0.24; this.slashAngle=0;
        this.slashHitDone=false; this.slashReach=74;
        this.orbitDir = rnd() < 0.5 ? -1 : 1;
        this.feinting = false;
        this.comboWindow = 0;
        break;
      case 'armor':
        this.hp=this.maxHp=8; this.speed=48; this.r=22; this.color='#708090';
        this.shieldAngle=0; this.chargeState='idle'; this.chargeTelegraph=0;
        this.chargeDir=0; this.chargeSpeed=350; this.chargeCD=2.5;
        this.stunTimer=0; this.shieldActive=true; break;
      case 'doll':
        this.hp=this.maxHp=4; this.speed=72; this.r=12; this.color='#d04040';
        this.curseInt=3.5;
        this.curseCD=this._nextDollThrowDelay();
        this.windingUp=false; this.windupTimer=0; this.throwTarget=null; break;
      case 'bomber':
        this.hp=this.maxHp=2; this.speed=180; this.r=10; this.color='#ff8840';
        this.fuse=false; this.fuseTimer=1.5; this.fuseBase=1.5; this.deathFuse=false; break;
      case 'slime':
        this.hp=this.maxHp=6; this.speed=55; this.r=18; this.color='#72ffa8';
        this.canSplit=true; break;
      case 'slimelet':
        this.hp=this.maxHp=1; this.speed=120; this.r=8; this.color='#8fffc4';
        this.canSplit=false; break;
    }
    const detectByType = {
      sniper: 285,
      slasher: 210,
      armor: 210,
      doll: 245,
      bomber: 200,
      slime: 205,
      slimelet: 150
    };
    const homeRadiusByType = {
      sniper: 140,
      slasher: 155,
      armor: 150,
      doll: 145,
      bomber: 130,
      slime: 150,
      slimelet: 85
    };
    this.detectRange = detectByType[type] || 230;
    this.forgetRange = this.detectRange + 120;
    this.homeRadius = homeRadiusByType[type] || 140;
    this.awareTimer = 0;
    this.suspiciousTimer = 0;
    this.suspicionReady = false;
    this.idleAngle = rnd() * PI2;
    this.idleTurnTimer = 0.5 + rnd() * 0.9;
    if (type !== 'slimelet') {
      const eliteBoost = currentRoom?.type === 'elite' || currentRoom?.type === 'timeattack';
      this.maxHp = Math.max(1, Math.round(scaleStat(this.maxHp, 'hp', roomIdx, eliteBoost)));
      this.hp = this.maxHp;
      this.speed = scaleStat(this.speed, 'speed', roomIdx, eliteBoost);
    }
  }

  setSpawnDelay(duration = ENEMY_SPAWN_DELAY) {
    this.spawnDelay = Math.max(this.spawnDelay, duration);
    this.vx = 0;
    this.vy = 0;
    return this;
  }

  _updateAwareness(dist, dt) {
    if (this.awareTimer > 0) this.awareTimer = Math.max(0, this.awareTimer - dt);
    if (this.roomAggro) return true;
    if (this.suspiciousTimer > 0) {
      this.suspiciousTimer = Math.max(0, this.suspiciousTimer - dt);
      if (this.suspiciousTimer <= 0) this.suspicionReady = true;
    }
    if (dist <= this.detectRange) {
      if (this.awareTimer <= 0 && !this.suspicionReady) {
        this.suspiciousTimer =
          this.type === 'sniper' ? 0.28 :
          this.type === 'slasher' ? 0.34 :
          0.4;
        return false;
      }
      if (this.suspiciousTimer > 0) return false;
      this.awareTimer = Math.max(this.awareTimer, 2.2);
      this.suspicionReady = false;
      return true;
    }
    if (this.awareTimer <= 0) {
      this.suspiciousTimer = 0;
      this.suspicionReady = false;
    }
    return this.awareTimer > 0 && dist <= this.forgetRange;
  }

  _idlePatrol(dt, slow) {
    this.idleTurnTimer -= dt;
    if (this.idleTurnTimer <= 0) {
      this.idleTurnTimer = 0.55 + rnd() * 1.15;
      this.idleAngle += (rnd() - 0.5) * 1.7;
    }
    if (this.type === 'slasher') {
      this.telegraph = false;
      this.feinting = false;
      this.comboWindow = 0;
    }
    if (this.type === 'sniper') this.aimTimer = 0;
    const homeDx = this.homeX - this.x;
    const homeDy = this.homeY - this.y;
    const homeDist = Math.sqrt(homeDx * homeDx + homeDy * homeDy) || 1;
    const outsideHome = homeDist > this.homeRadius;
    if (outsideHome) this.idleAngle = Math.atan2(homeDy, homeDx) + (rnd() - 0.5) * 0.25;
    const idleMul =
      this.type === 'sniper' ? 0.2 :
      this.type === 'slasher' ? 0.24 :
      this.type === 'bomber' ? 0.18 :
      0.16;
    const tvx = Math.cos(this.idleAngle) * this.speed * idleMul * (outsideHome ? 1.6 : 1) * slow;
    const tvy = Math.sin(this.idleAngle) * this.speed * idleMul * (outsideHome ? 1.6 : 1) * slow;
    this.vx += (tvx - this.vx) * Math.min(1, dt * 4.2);
    this.vy += (tvy - this.vy) * Math.min(1, dt * 4.2);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
  }

  _hasMeleeAttackSlot(pl) {
    if (!MELEE_TYPES.has(this.type)) return true;
    const limit = currentRoom?.type === 'elite' || currentRoom?.type === 'timeattack' ? MELEE_ATTACK_LIMIT + 1 : MELEE_ATTACK_LIMIT;
    let active = 0;
    for (const e of enemies) {
      if (e === this || !e.alive || !MELEE_TYPES.has(e.type)) continue;
      const d2 = (e.x - pl.x) ** 2 + (e.y - pl.y) ** 2;
      if (d2 > 180 * 180) continue;
      const isActive =
        (e.type === 'slasher' && (e.telegraph || e.slashTimer > 0)) ||
        (e.type === 'armor' && (e.chargeState === 'telegraph' || e.chargeState === 'charging')) ||
        (e.type === 'bomber' && e.fuse);
      if (isActive) active++;
    }
    return active < limit;
  }

  update(dt, pl) {
    if (!this.alive) return;
    if (this.flashTimer > 0) this.flashTimer -= dt;
    const slow = this.slowTimer > 0 ? 0.55 : 1;
    if (this.slowTimer > 0) this.slowTimer -= dt;
    if (this.corrosionTimer > 0) this.corrosionTimer -= dt;
    // Venom tick damage
    if (this.venomStacks > 0) {
      this.venomTimer -= dt;
      if (this.venomTimer <= 0) {
        this.hp -= this.venomStacks * 0.3;
        this.venomTimer = 0.5;
        for(let i=0;i<3;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*50,Math.sin(a)*50,0.3,'#40c040',2);}
        if (this.hp <= 0) { this.finishStatusDeath('venom', this.venomStacks * 0.3); return; }
      }
    }
    // Ignite tick
    if (this.igniteTimer > 0) {
      this.igniteTimer -= dt; this.igniteTick -= dt;
      if (this.igniteTick <= 0) {
        this.hp -= 1; this.igniteTick = 1.0;
        for(let i=0;i<4;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*50,Math.sin(a)*50,0.3,'#ff6020',2);}
        if (this.hp <= 0) { this.finishStatusDeath('ignite', 1); return; }
      }
    }
    // Mark timer
    if (this.marked) { this.markTimer -= dt; if(this.markTimer<=0) this.marked=false; }
    if (this.freezeTimer > 0) this.freezeTimer -= dt;
    if (this.spawnDelay > 0) {
      this.spawnDelay = Math.max(0, this.spawnDelay - dt);
      this.vx = 0;
      this.vy = 0;
      return;
    }
    // Freeze: skip all movement
    if (this.freezeTimer > 0) return;

    const dx=pl.x-this.x, dy=pl.y-this.y, dist=Math.sqrt(dx*dx+dy*dy)||1;
    const aware = this._updateAwareness(dist, dt);

    // Terror: flee
    if (this.terrorTimer > 0) {
      this.terrorTimer -= dt;
      this.vx=Math.cos(this.terrorAngle)*this.speed*slow;
      this.vy=Math.sin(this.terrorAngle)*this.speed*slow;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
    } else if (!aware) {
      this._idlePatrol(dt, slow);
    } else {
      if      (this.type==='sniper')  this._sniper(dt,pl,dx,dy,dist,slow);
      else if (this.type==='slasher') this._slasher(dt,pl,dx,dy,dist,slow);
      else if (this.type==='armor')   this._armor(dt,pl,dx,dy,dist,slow);
      else if (this.type==='doll')    this._doll(dt,pl,dx,dy,dist,slow);
      else if (this.type==='bomber')  this._bomber(dt,pl,dx,dy,dist,slow);
      else if (this.type==='slime' || this.type==='slimelet') this._slime(dt,pl,dx,dy,dist,slow);
    }

    // Boundary clamp
    this.x = clamp(this.x, AREA.x+this.r, AREA.x+AREA.w-this.r);
    this.y = clamp(this.y, AREA.y+this.r, AREA.y+AREA.h-this.r);
    for (const hz of roomHazards) {
      if (hz.type === 'pillar') {
        const hitSolid = resolveSolidCircle(this, hz);
        if (hitSolid && this.type === 'armor' && this.chargeState === 'charging') this._startArmorStun();
      }
      if (hz.type === 'conveyor' && hz.contains(this.x, this.y)) {
        if (hz.w > hz.h) this.x += hz.dir * 80 * dt;
        else this.y += hz.dir * 80 * dt;
      }
    }

    // Separate from other enemies
    for (const e of enemies) {
      if (e===this || !e.alive) continue;
      const ex=this.x-e.x, ey=this.y-e.y, ed=Math.sqrt(ex*ex+ey*ey)||1;
      const minD = this.r + e.r + 2;
      if (ed < minD) {
        const push = (minD-ed)/minD * 80;
        this.x += (ex/ed)*push*dt;
        this.y += (ey/ed)*push*dt;
      }
    }
  }

  _sniper(dt,pl,dx,dy,dist,slow) {
    const projSpeed = enemyProjectileSpeed(210, currentRoom?.type === 'elite' || currentRoom?.type === 'timeattack');
    const ux = dx / dist, uy = dy / dist;
    const tx = -uy, ty = ux;
    this.strafeTimer -= dt;
    if (this.strafeTimer <= 0) {
      this.strafeTimer = 0.65 + rnd() * 1.05;
      this.strafeDir *= -1;
      if (rnd() < 0.2) this.preferDist = 180 + rnd() * 65;
    }
    this.evadeCD -= dt;
    if (this.evadeBoostTimer > 0) {
      this.evadeBoostTimer -= dt;
      if (this.evadeBoostTimer <= 0) this.evadeBoost = 0;
    }
    if (this.evadeCD <= 0 && dist < 220 && pl.dashing) {
      this.evadeCD = 1.35 + rnd() * 0.85;
      this.strafeDir *= -1;
      this.evadeBoost = 1;
      this.evadeBoostTimer = 0.2;
    }
    const radial = clamp((dist - this.preferDist) * 1.9, -this.speed * 0.8, this.speed * 0.8);
    const lateralBase = this.speed * (0.22 + (Math.min(140, Math.abs(dist - this.preferDist)) / 520));
    const lateral = lateralBase * this.strafeDir * (1 + this.evadeBoost * 0.6);
    this.vx = (ux * radial + tx * lateral) * slow;
    this.vy = (uy * radial + ty * lateral) * slow;
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.shootCD -= dt;
    if (this.shootCD<=0 && dist<380) {
      const leadX = pl.x + pl.vx * 0.18;
      const leadY = pl.y + pl.vy * 0.18;
      if (!hasLineOfSight(this.x, this.y, leadX, leadY)) {
        this.aimTimer = 0;
        if (this.strafeTimer < 0.18) this.strafeDir *= -1;
        return;
      }
      if (this.aimTimer <= 0) this.aimTimer = 0.34;
      this.aimTimer -= dt;
      this.vx *= 0.55;
      this.vy *= 0.55;
      if (this.aimTimer > 0) return;
      this.aimTimer = 0;
      const aim = Math.atan2(leadY - this.y, leadX - this.x);
      const spread = dist < this.preferDist + 10 ? 0.12 : 0.1;
      const n = 3;
      const half = (n - 1) * 0.5;
      for (let i = 0; i < n; i++) {
        const a = aim + (i - half) * spread;
        const sp = projSpeed * 0.96;
        spawnBullet(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,false);
      }
      this.shootCD = this.shootInt;
      this.vx = (-ux * this.speed * 0.85 + tx * this.strafeDir * this.speed * 0.45) * slow;
      this.vy = (-uy * this.speed * 0.85 + ty * this.strafeDir * this.speed * 0.45) * slow;
      this.strafeDir *= -1;
    } else {
      this.aimTimer = 0;
    }
  }

  _slasher(dt,pl,dx,dy,dist,slow) {
    if (this.atkCD > 0) this.atkCD -= dt;
    if (this.comboWindow > 0) this.comboWindow -= dt;
    if (this.slashTimer > 0) {
      this.slashTimer -= dt;
      this.vx *= 0.7; this.vy *= 0.7;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const prog = clamp(1 - this.slashTimer / this.slashDur, 0, 1);
      if (!this.slashHitDone && prog >= 0.28 && dist < this.slashReach + pl.r) {
        const aim = Math.atan2(dy, dx);
        if (angleDelta(aim, this.slashAngle) < 0.9) {
          pl.takeDamage(1, this.x, this.y);
          this.slashHitDone = true;
        }
      }
      if (this.slashTimer <= 0) {
        this.slashTimer = 0;
        if (dist < 86 && rnd() < 0.24) {
          this.comboWindow = 0.3;
          this.atkCD = 0.22;
        } else {
          this.comboWindow = 0;
          this.atkCD = this.atkInt;
        }
      }
      return;
    }
    if (this.telegraph) {
      this.telegTimer -= dt;
      this.slashAngle = Math.atan2(dy, dx);
      this.vx *= 0.65; this.vy *= 0.65;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.telegTimer <= 0) {
        this.telegraph = false;
        if (this.feinting) {
          this.feinting = false;
          this.comboWindow = Math.max(this.comboWindow, 0.26);
          this.atkCD = 0.16;
          const side = this.orbitDir || 1;
          this.vx += (-dy / dist) * this.speed * side * 1.1;
          this.vy += (dx / dist) * this.speed * side * 1.1;
        } else {
          this.slashTimer = this.slashDur;
          this.slashHitDone = false;
          playSound('dash');
          for(let i=0;i<7;i++){const a=this.slashAngle+(rnd()-0.5)*1.2; const r=24+rnd()*38; spawnParticle(this.x+Math.cos(a)*r,this.y+Math.sin(a)*r,Math.cos(a)*(80+rnd()*90),Math.sin(a)*(80+rnd()*90),0.22,'#fff080',3);}
        }
      }
      return;
    }
    if (dist > 66) {
      const ux = dx / dist, uy = dy / dist;
      const tx = -uy, ty = ux;
      if (dist < 135) {
        this.vx = (ux * this.speed * 0.88 + tx * this.orbitDir * this.speed * 0.24) * slow;
        this.vy = (uy * this.speed * 0.88 + ty * this.orbitDir * this.speed * 0.24) * slow;
      } else {
        this.vx = ux * this.speed * slow;
        this.vy = uy * this.speed * slow;
      }
    } else {
      if (this.atkCD<=0) {
        if (!this._hasMeleeAttackSlot(pl)) {
          const tx = -dy / dist;
          const ty = dx / dist;
          this.vx = (tx * this.orbitDir * this.speed * 0.22 - (dx / dist) * this.speed * 0.12) * slow;
          this.vy = (ty * this.orbitDir * this.speed * 0.22 - (dy / dist) * this.speed * 0.12) * slow;
          this.x += this.vx * dt;
          this.y += this.vy * dt;
          return;
        }
        const comboReady = this.comboWindow > 0;
        this.feinting = !comboReady && !pl.dashing && dist > 48 && dist < 64 && rnd() < 0.12;
        this.telegraph=true;
        this.telegTimer = comboReady ? 0.24 : (this.feinting ? 0.28 : 0.42);
        this.slashAngle=Math.atan2(dy,dx);
        this.vx=0; this.vy=0;
        if (comboReady) this.comboWindow = 0;
      } else {
        const tx = -dy / dist;
        const ty = dx / dist;
        this.vx = (tx * this.orbitDir * this.speed * 0.24) * slow;
        this.vy = (ty * this.orbitDir * this.speed * 0.24) * slow;
      }
    }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
  }

  _startArmorStun() {
    this.stunTimer = 1.5;
    this.chargeState = 'stunned';
    this.chargeTelegraph = 0;
    this.shieldActive = false;
    shakeDur = 0.15;
    shakeIntensity = 8;
    playSound('playerHit');
    for (let i = 0; i < 16; i++) {
      const a = rnd() * PI2;
      spawnParticle(this.x, this.y, Math.cos(a) * 120, Math.sin(a) * 120, 0.6, '#a0b0c0', 4);
    }
  }

  _armor(dt,pl,dx,dy,dist,slow) {
    // Update shield angle to face player
    this.shieldAngle = Math.atan2(dy, dx);

    // Stun state
    if (this.stunTimer > 0) {
      this.stunTimer -= dt;
      this.shieldActive = false;
      this.vx *= 0.85; this.vy *= 0.85;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.stunTimer <= 0) { this.shieldActive = true; this.chargeState = 'idle'; this.chargeCD = 2.5; }
      return;
    }

    // Charge telegraph
    if (this.chargeState === 'telegraph') {
      this.chargeTelegraph -= dt;
      this.vx *= 0.8; this.vy *= 0.8;
      this.x += this.vx * dt; this.y += this.vy * dt;
      if (this.chargeTelegraph <= 0) {
        this.chargeState = 'charging';
        this.chargeDir = Math.atan2(dy, dx);
      }
      return;
    }

    // Charging
    if (this.chargeState === 'charging') {
      this.vx = Math.cos(this.chargeDir) * this.chargeSpeed;
      this.vy = Math.sin(this.chargeDir) * this.chargeSpeed;
      this.x += this.vx * dt; this.y += this.vy * dt;
      // Wall collision check
      if (this.x - this.r <= AREA.x || this.x + this.r >= AREA_R ||
          this.y - this.r <= AREA.y || this.y + this.r >= AREA_B) {
        this._startArmorStun();
      }
      // Player collision during charge
      if (dist < this.r + pl.r + 4) {
        pl.takeDamage(2, this.x, this.y);
        const push = 400;
        pl.vx += (dx / dist) * push * dt * 8; pl.vy += (dy / dist) * push * dt * 8;
      }
      return;
    }

    // Normal movement + charge trigger
    this.chargeCD -= dt;
    this.vx = (dx / dist) * this.speed * slow; this.vy = (dy / dist) * this.speed * slow;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (dist < this.r + pl.r + 4) {
      const push = 300;
      pl.vx += (dx / dist) * push * dt; pl.vy += (dy / dist) * push * dt;
    }
    // Trigger charge on cooldown
    if (this.chargeCD <= 0 && this.chargeState === 'idle' && dist < 260 && this._hasMeleeAttackSlot(pl)) {
      this.chargeState = 'telegraph';
      this.chargeTelegraph = 0.8;
    }
  }

  _doll(dt,pl,dx,dy,dist,slow) {
    // Windup: pause briefly, then throw cursed grenade
    if (this.windingUp) {
      this.vx*=0.85; this.vy*=0.85;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
      this.windupTimer-=dt;
      if (this.windupTimer<=0) {
        this.windingUp=false;
        grenades.push(new Grenade(this.x, this.y, this.throwTarget.x, this.throwTarget.y));
        this.curseCD=this._nextDollThrowDelay();
      }
      return;
    }
    // ?쇰컲 諛고쉶
    this.stateTimer-=dt;
    if (this.stateTimer<=0) {
      const a=rnd()*Math.PI*2;
      this.vx=Math.cos(a)*this.speed*slow; this.vy=Math.sin(a)*this.speed*slow;
      this.stateTimer=0.8+rnd()*0.8;
    }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.curseCD-=dt;
    if (this.curseCD<=0) {
      this.windingUp=true;
      this.windupTimer=0.7;
      this.throwTarget=this._getDollThrowTarget(pl);
      this.vx=0; this.vy=0;
    }
  }

  _nextDollThrowDelay() {
    return this.curseInt + 0.12 + rnd() * 0.3;
  }

  _getDollThrowTarget(pl) {
    const angle = rnd() * PI2;
    const distance = 20 + rnd() * 10;
    return {
      x: pl.x + Math.cos(angle) * distance,
      y: pl.y + Math.sin(angle) * distance
    };
  }

  _bomber(dt,pl,dx,dy,dist,slow) {
    if (dist <= this.r + pl.r + 4) {
      this.explode();
      return;
    }
    if (!this.fuse && dist > 90) {
      this.vx=(dx/dist)*this.speed*slow;
      this.vy=(dy/dist)*this.speed*slow;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
      return;
    }
    if (!this.fuse && !this._hasMeleeAttackSlot(pl)) {
      const tx = -dy / dist;
      const ty = dx / dist;
      this.vx += (tx * this.speed * 0.45 - (dx / dist) * this.speed * 0.22) * slow * dt * 4;
      this.vy += (ty * this.speed * 0.45 - (dy / dist) * this.speed * 0.22) * slow * dt * 4;
      this.vx *= 0.88; this.vy *= 0.88;
      this.x += this.vx * dt; this.y += this.vy * dt;
      return;
    }
    if (!this.fuse) this.primeBomber();
    this.fuseTimer -= dt;
    this.vx += (dx/dist)*this.speed*slow*dt*4.8;
    this.vy += (dy/dist)*this.speed*slow*dt*4.8;
    this.vx *= 0.9; this.vy *= 0.9;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (this.fuseTimer <= 0) this.explode();
  }

  _slime(dt,pl,dx,dy,dist,slow) {
    this.vx += (dx/dist)*this.speed*slow*dt*6;
    this.vy += (dy/dist)*this.speed*slow*dt*6;
    this.vx *= this.type==='slimelet' ? 0.86 : 0.92;
    this.vy *= this.type==='slimelet' ? 0.86 : 0.92;
    this.x += this.vx * dt; this.y += this.vy * dt;
    if (dist < this.r + pl.r + 3) pl.takeDamage(1, this.x, this.y);
  }

  finishStatusDeath(cause, damage=1) {
    const ctx = {
      traits: this.lastHitTraits || [],
      damage,
      cause,
      creditPlayer: true
    };
    if (this.type === 'bomber') {
      this.primeBomber(true, ctx);
      return false;
    }
    return this.die(ctx);
  }

  die(context={}) {
    if (!this.alive) return false;
    const traits = context.traits || [];
    const damage = context.damage || 2;
    this.alive = false;

    if (!context.suppressGenericFx) {
      for (let i=0;i<16;i++){
        const a=rnd()*PI2;
        const sp=60+rnd()*130;
        spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.7+rnd()*0.4,this.color,4);
      }
    }

    if (context.creditPlayer !== false && player) {
      if (traits.includes('vampiric')) player.hp=Math.min(player.maxHp, player.hp+1);
      player.currency++;
    }

    if (traits.includes('chain_explosion')) {
      for(const e2 of enemies) if(e2!==this&&e2.alive&&(e2.x-this.x)**2+(e2.y-this.y)**2<70*70) e2.hit(damage*0.8,[]);
      for(let i=0;i<18;i++){
        const a=rnd()*PI2;
        const sp=80+rnd()*150;
        spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.6,'#ff6000',5);
      }
    }

    if (this.type === 'slime' && this.canSplit) {
      for (let i=0;i<2;i++) {
        const a=i*Math.PI+rnd()*0.4;
        const p=findSafePointNear(this.x+Math.cos(a)*14,this.y+Math.sin(a)*14,'slimelet',28);
        const child=new Enemy(p.x,p.y,'slimelet');
        child.vx=Math.cos(a)*90;
        child.vy=Math.sin(a)*90;
        if (this.roomAggro) armRoomEnemy(child);
        enemies.push(child);
      }
    }

    if (!context.suppressGenericFx) {
      playSound('kill');
      triggerHitStop(0.06, 0.18);
      screenPulse(this.type === 'slime' ? '#8cffca' : '#ff9e72', 0.14, 3);
    }
    return true;
  }

  explode() {
    if (!this.alive) return;
    const deathContext = this.deathContext || { traits:[], damage:2, cause:'bomber', creditPlayer:false };
    for (let i=0;i<28;i++) {
      const a=rnd()*PI2;
      const sp=90+rnd()*150;
      spawnParticle(this.x,this.y,Math.cos(a)*sp,Math.sin(a)*sp,0.7,'#ff9040',5);
    }
    playSound('kill');
    screenPulse('#ff5a24', 0.28, 4);
    triggerHitStop(0.05, 0.4);
    if ((player.x-this.x)**2 + (player.y-this.y)**2 < 80*80) player.takeDamage(2, this.x, this.y);
    for (const e of enemies) {
      if (e===this || !e.alive) continue;
      if ((e.x-this.x)**2 + (e.y-this.y)**2 < 80*80) e.hit(2, []);
    }
    this.die({ ...deathContext, suppressGenericFx:true });
  }

  primeBomber(fromHit=false, context=null) {
    this.fuse = true;
    this.deathFuse = this.deathFuse || fromHit;
    if (fromHit && context) this.deathContext = context;
    this.fuseTimer = Math.min(this.fuseTimer, this.fuseBase);
    if (fromHit) {
      this.hp = Math.max(this.hp, 0.01);
      this.vx *= 0.5;
      this.vy *= 0.5;
    }
  }

  hit(dmg, traits, fromX, fromY) {
    traits = traits || [];
    if (traits.length) this.lastHitTraits = traits.slice();
    let d = dmg;
    const crit = rnd() < 0.3 && traits.includes('sight');
    if (traits.includes('silver'))   d *= 1.6;
    if (traits.includes('overload')) d *= 1.5;
    if (this.marked)                 { d *= 2; this.marked=false; this.markTimer=0; }
    if (this.corrosionTimer > 0)     d *= 1.5;
    this.awareTimer = Math.max(this.awareTimer, 3.0);
    for (const e of enemies) {
      if (e === this || !e.alive) continue;
      if ((e.x - this.x) ** 2 + (e.y - this.y) ** 2 < 140 * 140) e.awareTimer = Math.max(e.awareTimer || 0, 0.8);
    }
    // Armor shield: front = 80% reduction, rear = x2 damage
    if (this.type === 'armor' && fromX !== undefined) {
      const hitAngle = Math.atan2(fromY - this.y, fromX - this.x);
      const angleDiff = Math.abs(((hitAngle - this.shieldAngle + Math.PI * 3) % PI2) - Math.PI);
      if (this.shieldActive && !this.stunTimer && angleDiff < Math.PI * 0.45) {
        d *= 0.2; // front hit, shield absorbs 80%
        addDamagePopup(this.x, this.y - this.r - 20, 'BLOCKED', '#a0b0c0', false);
      } else if (angleDiff > Math.PI * 0.55) {
        d *= 2; // rear hit, weakness
      }
    }
    if (crit) {
      d *= 2;
      for (let i=0;i<8;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*130,Math.sin(a)*130,0.5,'#40e0ff',3);}
    }
    this.hp -= d; this.flashTimer = 0.1;
    if (d >= 3) { shakeDur=0.12; shakeIntensity=Math.min(11, d*0.55); }
    if (traits.includes('venom'))         { this.venomStacks=Math.min(3,this.venomStacks+1); this.venomTimer=0.5; }
    if (traits.includes('corrosion'))     this.corrosionTimer = 4.0;
    if (traits.includes('ignite'))        { this.igniteTimer=3.0; this.igniteTick=1.0; }
    if (traits.includes('mark'))          { this.marked=true; this.markTimer=4.0; }
    if (traits.includes('drain'))         player.hp=Math.min(player.maxHp, player.hp+d*0.25);
    if (traits.includes('thunder')) {
      let nearA = null, nearB = null, distA = Infinity, distB = Infinity;
      for (const e2 of enemies) {
        if (e2 === this || !e2.alive) continue;
        const d2 = (e2.x - this.x) ** 2 + (e2.y - this.y) ** 2;
        if (d2 < distA) {
          distB = distA; nearB = nearA;
          distA = d2; nearA = e2;
        } else if (d2 < distB) {
          distB = d2; nearB = e2;
        }
      }
      if (nearA) {
        nearA.hit(d * 0.5, []);
        for(let s=0;s<6;s++){const t=s/5; spawnParticle(this.x+(nearA.x-this.x)*t+(rnd()-0.5)*20,this.y+(nearA.y-this.y)*t+(rnd()-0.5)*20,0,0,0.25,'#ffff40',2);}
      }
      if (nearB) {
        nearB.hit(d * 0.5, []);
        for(let s=0;s<6;s++){const t=s/5; spawnParticle(this.x+(nearB.x-this.x)*t+(rnd()-0.5)*20,this.y+(nearB.y-this.y)*t+(rnd()-0.5)*20,0,0,0.25,'#ffff40',2);}
      }
    }
    addDamagePopup(this.x, this.y-this.r-12, Math.round(d*10)/10, crit ? '#ffe070' : '#ffb3a8', crit);
    playSound('enemyHit');
    triggerHitStop(0.03, 0.3);
    for (let i=0;i<5;i++){const a=rnd()*PI2; spawnParticle(this.x,this.y,Math.cos(a)*90,Math.sin(a)*90,0.4,'#ff8080',3);}
    if (this.type === 'bomber' && this.hp <= 0) {
      this.primeBomber(true, { traits:traits.slice(), damage:d, cause:'hit', creditPlayer:true });
      return false;
    }
    if (this.hp<=0) {
      return this.die({ traits:traits.slice(), damage:d, cause:'hit', creditPlayer:true });
    }
    return false;
  }

  draw() {
    if (!this.alive) return;
    cx.save();
    const fl = this.flashTimer>0;
    if (this.spawnDelay > 0) {
      const blink = 0.5 + 0.5 * Math.sin(frameNow * 0.03 + this.spawnBlinkOffset);
      cx.globalAlpha = 0.45 + blink * 0.28;
    }
    switch(this.type) {
      case 'sniper':  this._dSniper(fl);  break;
      case 'slasher': this._dSlasher(fl); break;
      case 'armor':   this._dArmor(fl);   break;
      case 'doll':    this._dDoll(fl);    break;
      case 'bomber':  this._dBomber(fl);  break;
      case 'slime':
      case 'slimelet': this._dSlime(fl);  break;
    }
    if (this.spawnDelay > 0) {
      const blink = 0.5 + 0.5 * Math.sin(frameNow * 0.03 + this.spawnBlinkOffset);
      cx.strokeStyle=`rgba(255,255,255,${0.18 + blink * 0.2})`;
      cx.lineWidth=2;
      cx.setLineDash([5, 4]);
      cx.beginPath(); cx.arc(this.x, this.y, this.r + 5 + blink * 2, 0, PI2); cx.stroke();
      cx.setLineDash([]);
    }
    // Status overlays
    if (this.freezeTimer > 0) {
      cx.fillStyle='rgba(128,208,255,0.38)'; cx.shadowColor='#80d0ff'; cx.shadowBlur=14;
      cx.beginPath(); cx.arc(this.x,this.y,this.r+3,0,PI2); cx.fill(); cx.shadowBlur=0;
    }
    if (this.marked) {
      const mp=Math.sin(frameNow*0.008)*0.3+0.7;
      cx.strokeStyle=`rgba(255,160,64,${mp})`; cx.lineWidth=2;
      cx.setLineDash([4,3]); cx.shadowColor='#ffa040'; cx.shadowBlur=8*mp;
      cx.beginPath(); cx.arc(this.x,this.y,this.r+6,0,PI2); cx.stroke();
      cx.setLineDash([]); cx.shadowBlur=0;
    }
    if (this.igniteTimer > 0) {
      const ip=Math.sin(frameNow*0.015)*0.3+0.7;
      cx.strokeStyle=`rgba(255,96,32,${ip*0.85})`; cx.lineWidth=2.5;
      cx.shadowColor='#ff6020'; cx.shadowBlur=10*ip;
      cx.beginPath(); cx.arc(this.x,this.y,this.r+2,0,PI2); cx.stroke(); cx.shadowBlur=0;
    }
    if (this.terrorTimer > 0) {
      cx.fillStyle='rgba(204,64,128,0.22)';
      cx.beginPath(); cx.arc(this.x,this.y,this.r+4,0,PI2); cx.fill();
    }
    // HP bar
    if (this.hp < this.maxHp) {
      cx.fillStyle='#300'; cx.fillRect(this.x-20, this.y-this.r-10, 40, 5);
      cx.fillStyle='#f44'; cx.fillRect(this.x-20, this.y-this.r-10, 40*(this.hp/this.maxHp), 5);
    }
    cx.restore();
  }

  _dSniper(fl) {
    cx.shadowColor='#a0c8e8'; cx.shadowBlur=fl?22:10;
    cx.fillStyle=fl?'#fff':'#a0c8e8';
    cx.beginPath(); cx.ellipse(this.x,this.y-4,this.r*0.8,this.r,0,0,PI2); cx.fill();
    cx.fillStyle='#1a0a2a';
    cx.beginPath(); cx.arc(this.x-4,this.y-5,3,0,PI2); cx.arc(this.x+4,this.y-5,3,0,PI2); cx.fill();
  }
  _dSlasher(fl) {
    const telegraphing = this.telegraph;
    const swinging = this.slashTimer > 0;
    const face = (telegraphing || swinging)
      ? this.slashAngle
      : Math.atan2((player?.y || this.y) - this.y, (player?.x || this.x + 1) - this.x);
    const wind = telegraphing ? clamp(1 - this.telegTimer / 0.42, 0, 1) : 0;

  _dArmor(fl) {

      cx.font = 'bold 10px Courier New'; cx.textAlign = 'center';

  }
  _dDoll(fl) {

    cx.shadowColor = this.windingUp ? '#ff00cc' : '#d04040';
    cx.shadowBlur = fl ? 22 : (this.windingUp ? windGlow : 14);

    cx.fillStyle=fl?'#ffa0a0':'#b03030';

      cx.fillStyle='#cc00cc'; cx.shadowColor='#ff00ff'; cx.shadowBlur=14;

    cx.beginPath();

    cx.moveTo(this.x-4,this.y-7); cx.lineTo(this.x-7,this.y-4);
    cx.moveTo(this.x+4,this.y-7); cx.lineTo(this.x+7,this.y-4);
    cx.moveTo(this.x+7,this.y-7); cx.lineTo(this.x+4,this.y-4);

  _dBomber(fl) {
